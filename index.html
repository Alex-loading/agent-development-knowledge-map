<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="面向 Agent 开发者的交互式 LLM 基础学习地图与面试训练手册。">
    <title>Agent Learner · LLM 基础研究手册</title>
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/app.css">
  </head>
  <body>
    <a class="skip-link" href="#app-main">跳到主要内容</a>

    <header class="app-header">
      <a class="brand" href="#llm-foundation/dashboard" aria-label="Agent Learner 首页">
        <span class="brand__index" aria-hidden="true">研究档案 / 01</span>
        <span class="brand__name">Agent Learner</span>
        <span class="brand__note">把概率能力装进可验证系统</span>
      </a>

      <div class="header-context" aria-label="当前学习状态">
        <div>
          <span class="eyebrow">当前模块</span>
          <strong id="current-module-title">LLM 基础</strong>
        </div>
        <div id="progress-summary" class="progress-summary" aria-label="学习进度">
          <span>课程 0 / 8</span>
          <span>面试 0 / 24</span>
        </div>
      </div>

      <label class="module-picker" for="module-select">
        <span>切换学习模块</span>
        <select id="module-select" name="module"></select>
      </label>
    </header>

    <div id="storage-notice" class="notice notice--storage" role="status" hidden>
      <strong>临时学习模式</strong>
      <span>浏览器阻止了本地存储；本次进度只会保留到页面关闭。</span>
    </div>

    <div class="app-layout">
      <aside class="module-rail" aria-label="学习手册索引">
        <p class="rail-caption">模块索引</p>
        <nav aria-label="学习模块">
          <div id="module-list" class="module-list"></div>
        </nav>
        <p class="margin-note">先建立模型心智，再进入 Agent 的控制、工具与工程系统。</p>
      </aside>

      <div class="reading-desk">
        <nav class="view-nav" aria-label="学习视图">
          <div id="view-tabs" class="view-tabs"></div>
        </nav>

        <main id="app-main" tabindex="-1">
          <div id="view-root" class="view-placeholder" aria-busy="true">
            <span class="section-index">正在打开研究手册</span>
            <h1>整理你的学习路径…</h1>
            <p>若页面长时间没有更新，请确认浏览器允许执行 JavaScript。</p>
          </div>
        </main>
      </div>
    </div>

    <div id="app-live-region" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
