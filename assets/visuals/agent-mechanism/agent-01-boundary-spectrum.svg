<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-01-boundary-spectrum-title visual-agent-01-boundary-spectrum-description">
  <title id="visual-agent-01-boundary-spectrum-title">模型、应用、Workflow 与 Agent 的决策权连续谱</title>
  <desc id="visual-agent-01-boundary-spectrum-description">四个节点按控制权递增排列，说明判断系统类型的关键是下一步决策位置。最后一段强调 Agent 只能在宿主授权的动作空间内选路，自治并不等于任意权限。</desc>
  <defs>
    <marker id="visual-agent-01-boundary-spectrum-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">决策权落在哪里？</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">固定路径与模型选路构成连续谱；权限始终由宿主划定。</text>
  <g data-kind="spectrum"><polyline data-edge="model-app" data-from="model" data-to="app" data-kind="forward" points="240,304 340,304" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-01-boundary-spectrum-arrow)"/><g data-edge-label="model-app"><rect x="254" y="211" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="290" y="228" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">OUTPUT</text></g><polyline data-edge="app-workflow" data-from="app" data-to="workflow" data-kind="forward" points="520,304 620,304" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-01-boundary-spectrum-arrow)"/><g data-edge-label="app-workflow"><rect x="514" y="211" width="112" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="570" y="228" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">ORCHESTRATE</text></g><polyline data-edge="workflow-agent" data-from="workflow" data-to="agent" data-kind="forward" points="800,304 900,304" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-01-boundary-spectrum-arrow)"/><g data-edge-label="workflow-agent"><rect x="802" y="211" width="96" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="850" y="228" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">AUTHORIZE</text></g><g data-node="model" data-kind="stage"><rect x="60" y="260" width="180" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="150" y="297.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">MODEL</text><text x="150" y="322.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">生成候选</text></g><g data-node="app" data-kind="stage"><rect x="340" y="260" width="180" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="430" y="297.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">APP</text><text x="430" y="322.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">确定性调用</text></g><g data-node="workflow" data-kind="stage"><rect x="620" y="260" width="180" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="710" y="297.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">WORKFLOW</text><text x="710" y="322.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">预设分支</text></g><g data-node="agent" data-kind="controlled"><rect x="900" y="260" width="180" height="88" rx="20" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/><text x="990" y="297.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">AGENT</text><text x="990" y="322.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">边界内选路</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">Agent 的区别在决策位置；权限、执行和刹车仍属于宿主。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">SPECTRUM · decision-authority-continuum</text>
</svg>