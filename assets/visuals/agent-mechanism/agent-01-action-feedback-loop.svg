<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-01-action-feedback-loop-title visual-agent-01-action-feedback-loop-description">
  <title id="visual-agent-01-action-feedback-loop-title">目标、状态、动作与反馈组成的最小 Agent 闭环</title>
  <desc id="visual-agent-01-action-feedback-loop-description">图把目标和当前状态、模型决策、宿主动作与环境观察串成闭环。它突出只有可信 observation 到达之后才能更新事实，模型生成候选不构成真实执行证据。</desc>
  <defs>
    <marker id="visual-agent-01-action-feedback-loop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">最小行动闭环</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">状态只有在可信 observation 到达后才能更新。</text>
  <g data-kind="loop"><polyline data-edge="state-decide" data-from="goal-state" data-to="decide" data-kind="forward" points="270,284 330,284" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-01-action-feedback-loop-arrow)"/><g data-edge-label="state-decide"><rect x="264" y="192" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="300" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">READ</text></g><polyline data-edge="decide-act" data-from="decide" data-to="host-act" data-kind="forward" points="540,284 600,284" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-01-action-feedback-loop-arrow)"/><g data-edge-label="decide-act"><rect x="530" y="192" width="80" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="570" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">PROPOSE</text></g><polyline data-edge="act-observe" data-from="host-act" data-to="observation" data-kind="forward" points="810,284 870,284" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-01-action-feedback-loop-arrow)"/><g data-edge-label="act-observe"><rect x="800" y="192" width="80" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="840" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">EXECUTE</text></g><polyline data-edge="observe-state" data-from="observation" data-to="goal-state" data-kind="feedback" points="975,328 975,480 165,480 165,328" fill="none" stroke="#F5C36A" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-01-action-feedback-loop-arrow)"/><g data-edge-label="observe-state"><rect x="494" y="467" width="152" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="570" y="484" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#F5D28C" text-anchor="middle">TRUSTED FEEDBACK</text></g><g data-node="goal-state" data-kind="stage"><rect x="60" y="240" width="210" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="165" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">GOAL + STATE</text><text x="165" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">当前可信事实</text></g><g data-node="decide" data-kind="stage"><rect x="330" y="240" width="210" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="435" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">DECIDE</text><text x="435" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">候选动作</text></g><g data-node="host-act" data-kind="host"><rect x="600" y="240" width="210" height="88" rx="20" fill="#3D315B" stroke="#B8A7F8" stroke-width="2"/><text x="705" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">HOST ACT</text><text x="705" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">校验并执行</text></g><g data-node="observation" data-kind="evidence"><rect x="870" y="240" width="210" height="88" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="975" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">OBSERVATION</text><text x="975" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">证据回填</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">没有受控动作、反馈写回和显式出口，就没有可治理的行动闭环。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">LOOP · directed-action-feedback</text>
</svg>