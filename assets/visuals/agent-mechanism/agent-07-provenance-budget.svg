<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">带 Provenance 的压缩、外置与回取</title>
  <desc id="description">图要求摘要、检索证据和长期记忆都携带 source、version 与有效期。压缩和 offload 只能减少活动窗口占用，不能删除回取指针、权限规则或未解决冲突。</desc>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="105" font-size="34" font-weight="750" fill="#F5FBFF">压缩与外置保留来源</text>
  <text x="64" y="150" font-size="19" fill="#B8CBD8">摘要、检索证据与长期记忆必须保留版本和回取指针。</text>
  <g data-edge="visual-agent-07-provenance-budget-edge-1">
      <path d="M 260 322 L 333 322" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <path d="M 327 314 L 345 322 L 327 330" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <rect x="264.5" y="274" width="76" height="30" rx="15" fill="#10283A"/>
      <text x="302.5" y="295" text-anchor="middle" font-size="16" fill="#8EECE1">排序</text>
    </g>
<g data-edge="visual-agent-07-provenance-budget-edge-2">
      <path d="M 545 322 L 618 322" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <path d="M 612 314 L 630 322 L 612 330" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <rect x="549.5" y="274" width="76" height="30" rx="15" fill="#10283A"/>
      <text x="587.5" y="295" text-anchor="middle" font-size="16" fill="#8EECE1">外置</text>
    </g>
<g data-edge="visual-agent-07-provenance-budget-edge-3">
      <path d="M 830 322 L 903 322" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <path d="M 897 314 L 915 322 L 897 330" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <rect x="834.5" y="274" width="76" height="30" rx="15" fill="#10283A"/>
      <text x="872.5" y="295" text-anchor="middle" font-size="16" fill="#8EECE1">引用</text>
    </g>
  <g data-node="visual-agent-07-provenance-budget-node-1">
      <rect x="60" y="270" width="200" height="104" rx="22" fill="#173B55" stroke="#75E3D6" stroke-width="2"/>
      <text x="160" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#F5FBFF">EVIDENCE</text>
<text x="160" y="328" text-anchor="middle" font-size="16" font-weight="500" fill="#F5FBFF">source + version</text>
    </g>
<g data-node="visual-agent-07-provenance-budget-node-2">
      <rect x="345" y="270" width="200" height="104" rx="22" fill="#1E4B55" stroke="#75E3D6" stroke-width="2"/>
      <text x="445" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#F5FBFF">BUDGET</text>
<text x="445" y="328" text-anchor="middle" font-size="16" font-weight="500" fill="#F5FBFF">选择与压缩</text>
    </g>
<g data-node="visual-agent-07-provenance-budget-node-3">
      <rect x="630" y="270" width="200" height="104" rx="22" fill="#173B55" stroke="#75E3D6" stroke-width="2"/>
      <text x="730" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#F5FBFF">OFFLOAD</text>
<text x="730" y="328" text-anchor="middle" font-size="16" font-weight="500" fill="#F5FBFF">稳定指针</text>
    </g>
<g data-node="visual-agent-07-provenance-budget-node-4">
      <rect x="915" y="270" width="200" height="104" rx="22" fill="#1E4B55" stroke="#75E3D6" stroke-width="2"/>
      <text x="1015" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#F5FBFF">CONTEXT</text>
<text x="1015" y="328" text-anchor="middle" font-size="16" font-weight="500" fill="#F5FBFF">可追溯投影</text>
    </g>
  <text x="64" y="590" font-size="18" fill="#7FA1B5">压缩可以丢叙事细节，不能丢硬约束、证据来源和恢复入口。</text>
  <text x="1136" y="610" text-anchor="end" font-size="16" fill="#5F8195">Agent Learner · 2026-07-30</text>
</svg>