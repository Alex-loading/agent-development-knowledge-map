<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-07-provenance-budget-title visual-agent-07-provenance-budget-description">
  <title id="visual-agent-07-provenance-budget-title">带 Provenance 的压缩、外置与回取</title>
  <desc id="visual-agent-07-provenance-budget-description">图要求摘要、检索证据和长期记忆都携带 source、version 与有效期。压缩和 offload 只能减少活动窗口占用，不能删除回取指针、权限规则或未解决冲突。</desc>
  <defs>
    <marker id="visual-agent-07-provenance-budget-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">压缩与外置保留来源</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">摘要、检索证据与长期记忆必须保留版本和回取指针。</text>
  <g data-kind="flow"><polyline data-edge="evidence-budget" data-from="evidence" data-to="budget" data-kind="forward" points="260,284 320,284" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-07-provenance-budget-arrow)"/><g data-edge-label="evidence-budget"><rect x="254" y="192" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="290" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">RANK</text></g><polyline data-edge="budget-offload" data-from="budget" data-to="offload" data-kind="forward" points="520,284 580,284" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-07-provenance-budget-arrow)"/><g data-edge-label="budget-offload"><rect x="506" y="192" width="88" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="550" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">COMPRESS</text></g><polyline data-edge="offload-context" data-from="offload" data-to="context" data-kind="forward" points="780,284 850,284" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-07-provenance-budget-arrow)"/><g data-edge-label="offload-context"><rect x="775" y="192" width="80" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="815" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">POINTER</text></g><polyline data-edge="offload-retrieve" data-from="offload" data-to="retrieve" data-kind="forward" points="680,328 680,430" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-07-provenance-budget-arrow)"/><g data-edge-label="offload-retrieve"><rect x="732" y="367" width="96" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="780" y="384" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">ON DEMAND</text></g><polyline data-edge="retrieve-context" data-from="retrieve" data-to="context" data-kind="forward" points="830,470 955,470 955,328" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-07-provenance-budget-arrow)"/><g data-edge-label="retrieve-context"><rect x="856" y="487" width="88" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="900" y="504" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">VERIFIED</text></g><g data-node="evidence" data-kind="evidence"><rect x="50" y="240" width="210" height="88" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="155" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">EVIDENCE</text><text x="155" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">source + version</text></g><g data-node="budget" data-kind="stage"><rect x="320" y="240" width="200" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="420" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">BUDGET</text><text x="420" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">选择 + 压缩</text></g><g data-node="offload" data-kind="host"><rect x="580" y="240" width="200" height="88" rx="20" fill="#3D315B" stroke="#B8A7F8" stroke-width="2"/><text x="680" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">OFFLOAD</text><text x="680" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">稳定指针</text></g><g data-node="context" data-kind="controlled"><rect x="850" y="240" width="210" height="88" rx="20" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/><text x="955" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">CONTEXT</text><text x="955" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">可追溯投影</text></g><g data-node="retrieve" data-kind="protocol"><rect x="580" y="430" width="250" height="80" rx="20" fill="#293B63" stroke="#9FB7FF" stroke-width="2"/><text x="705" y="463.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">AUTHORIZED RETRIEVAL</text><text x="705" y="488.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">hash + ACL 核验</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">压缩可以丢叙事细节，不能丢硬约束、证据来源和恢复入口。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">FLOW · provenance-preserving-projection</text>
</svg>