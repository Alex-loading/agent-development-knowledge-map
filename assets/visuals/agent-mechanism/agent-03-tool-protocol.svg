<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-03-tool-protocol-title visual-agent-03-tool-protocol-description">
  <title id="visual-agent-03-tool-protocol-title">工具从定义到 observation 的可信协议</title>
  <desc id="visual-agent-03-tool-protocol-description">图覆盖 definition、schema、discovery、selection、authorization、execution 与 observation。中间的宿主边界表明结构合法不等于有权限，最终结果必须与调用标识关联。</desc>
  <defs>
    <marker id="visual-agent-03-tool-protocol-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">工具调用不是执行证明</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">候选调用必须穿过宿主授权并以 observation 闭环。</text>
  <g data-kind="protocol"><polyline data-edge="definition-selection" data-from="definition" data-to="selection" data-kind="forward" points="270,264 320,264" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-03-tool-protocol-arrow)"/><g data-edge-label="definition-selection"><rect x="251" y="172" width="88" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="295" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">DISCOVER</text></g><polyline data-edge="selection-host" data-from="selection" data-to="host" data-kind="forward" points="520,264 570,264" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-03-tool-protocol-arrow)"/><g data-edge-label="selection-host"><rect x="501" y="172" width="88" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="545" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">VALIDATE</text></g><polyline data-edge="host-observation" data-from="host" data-to="observation" data-kind="forward" points="780,264 830,264" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-03-tool-protocol-arrow)"/><g data-edge-label="host-observation"><rect x="757" y="172" width="96" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="805" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">CORRELATE</text></g><polyline data-edge="observation-state" data-from="observation" data-to="state" data-kind="forward" points="940,308 940,420" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-03-tool-protocol-arrow)"/><g data-edge-label="observation-state"><rect x="976" y="352" width="88" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="1020" y="369" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">EVIDENCE</text></g><g data-node="definition" data-kind="stage"><rect x="50" y="220" width="220" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="160" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">DEFINITION</text><text x="160" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">Schema + capability</text></g><g data-node="selection" data-kind="stage"><rect x="320" y="220" width="200" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="420" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">SELECTION</text><text x="420" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">候选参数</text></g><g data-node="host" data-kind="host"><rect x="570" y="220" width="210" height="88" rx="20" fill="#3D315B" stroke="#B8A7F8" stroke-width="2"/><text x="675" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">AUTH + EXEC</text><text x="675" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">宿主边界</text></g><g data-node="observation" data-kind="evidence"><rect x="830" y="220" width="220" height="88" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="940" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">OBSERVATION</text><text x="940" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">callId + 结果</text></g><g data-node="state" data-kind="controlled"><rect x="830" y="420" width="220" height="82" rx="20" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/><text x="940" y="454.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">STATE UPDATE</text><text x="940" y="479.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">仅吸收可信证据</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">Tool call 是候选；宿主 observation 才是动作发生与否的证据。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">PROTOCOL · host-authorized-tool-call</text>
</svg>