<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-04-bounded-loop-title visual-agent-04-bounded-loop-description">
  <title id="visual-agent-04-bounded-loop-title">Single、multi、parallel 与 bounded loop 的统一出口</title>
  <desc id="visual-agent-04-bounded-loop-description">图把终止检查放在本轮动作之前，并将轮次、工具调用和时间预算作为宿主控制。无论单动作、多动作还是并行分支，都必须落到 continue、done、blocked、handoff 或 exhausted。</desc>
  <defs>
    <marker id="visual-agent-04-bounded-loop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">有界循环的确定性出口</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">每轮先检查完成、阻塞与预算，再决定继续或停止。</text>
  <g data-kind="decision"><polyline data-edge="guard-act" data-from="guard" data-to="act" data-kind="forward" points="280,266 360,266" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-04-bounded-loop-arrow)"/><g data-edge-label="guard-act"><rect x="284" y="177" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="320" y="194" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">READY</text></g><polyline data-edge="act-ledger" data-from="act" data-to="ledger" data-kind="forward" points="580,266 820,266" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-04-bounded-loop-arrow)"/><g data-edge-label="act-ledger"><rect x="664" y="217" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="700" y="234" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">DEBIT</text></g><polyline data-edge="act-continue" data-from="act" data-to="continue" data-kind="forward" points="470,312 470,380 150,380 150,430" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-04-bounded-loop-arrow)"/><g data-edge-label="act-continue"><rect x="272" y="367" width="96" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="320" y="384" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">MORE WORK</text></g><polyline data-edge="guard-stop" data-from="guard" data-to="stop" data-kind="forward" points="130,312 130,350 370,350 370,430" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-04-bounded-loop-arrow)"/><g data-edge-label="guard-stop"><rect x="234" y="337" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="270" y="354" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">DONE</text></g><polyline data-edge="guard-blocked" data-from="guard" data-to="blocked" data-kind="forward" points="210,312 210,330 590,330 590,430" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-04-bounded-loop-arrow)"/><g data-edge-label="guard-blocked"><rect x="398" y="317" width="144" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="470" y="334" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">NO PRECONDITION</text></g><polyline data-edge="guard-budget" data-from="guard" data-to="budget" data-kind="forward" points="60,266 20,266 20,550 830,550 830,502" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-04-bounded-loop-arrow)"/><g data-edge-label="guard-budget"><rect x="572" y="537" width="96" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="620" y="554" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">LIMIT HIT</text></g><polyline data-edge="continue-guard" data-from="continue" data-to="guard" data-kind="feedback" points="60,466 35,466 35,300 60,300" fill="none" stroke="#F5C36A" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-04-bounded-loop-arrow)"/><g data-node="guard" data-kind="decision"><rect x="60" y="220" width="220" height="92" rx="20" fill="#4A391D" stroke="#F5CA72" stroke-width="2"/><text x="170" y="259.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">GUARD</text><text x="170" y="284.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">完成？阻塞？预算？</text></g><g data-node="act" data-kind="host"><rect x="360" y="220" width="220" height="92" rx="20" fill="#3D315B" stroke="#B8A7F8" stroke-width="2"/><text x="470" y="259.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">ACT</text><text x="470" y="284.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">预留预算后执行</text></g><g data-node="ledger" data-kind="evidence"><rect x="820" y="210" width="280" height="112" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="960" y="250" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">BUDGET LEDGER</text><text x="960" y="272" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">MAX ROUNDS 4</text><text x="960" y="294" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">TOOL CALLS 8 · TIME 90s</text></g><g data-node="continue" data-kind="controlled"><rect x="60" y="430" width="180" height="72" rx="20" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/><text x="150" y="472" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">CONTINUE</text></g><g data-node="stop" data-kind="outcome"><rect x="280" y="430" width="180" height="72" rx="20" fill="#1E5141" stroke="#88E0B7" stroke-width="2"/><text x="370" y="472" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">STOP</text></g><g data-node="blocked" data-kind="blocked"><rect x="500" y="430" width="180" height="72" rx="20" fill="#562E35" stroke="#F2A6B2" stroke-width="2"/><text x="590" y="472" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">BLOCKED</text></g><g data-node="budget" data-kind="blocked"><rect x="720" y="430" width="220" height="72" rx="20" fill="#562E35" stroke="#F2A6B2" stroke-width="2"/><text x="830" y="472" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">BUDGET EXHAUSTED</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">循环模式可以变化，continue/stop 的确定性控制不能缺席。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">DECISION · bounded-loop-exits</text>
</svg>