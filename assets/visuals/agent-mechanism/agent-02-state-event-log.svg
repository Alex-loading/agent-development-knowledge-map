<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-02-state-event-log-title visual-agent-02-state-event-log-description">
  <title id="visual-agent-02-state-event-log-title">自然语言计划、状态机与耐久事件日志</title>
  <desc id="visual-agent-02-state-event-log-description">图分开计划建议、控制状态与耐久记录：计划可在新观察后变化，状态机限定合法迁移，append-only event log 保存每次动作和状态差异并支持恢复。</desc>
  <defs>
    <marker id="visual-agent-02-state-event-log-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">计划、状态机与事件日志</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">自然语言计划可改；状态机控制；event log 负责耐久取证。</text>
  <g data-kind="state-machine"><polyline data-edge="plan-state" data-from="plan" data-to="state-machine" data-kind="forward" points="230,264 280,264" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-02-state-event-log-arrow)"/><g data-edge-label="plan-state"><rect x="207" y="172" width="96" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="255" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">CONSTRAIN</text></g><polyline data-edge="state-event" data-from="state-machine" data-to="event-log" data-kind="forward" points="490,264 540,264" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-02-state-event-log-arrow)"/><g data-edge-label="state-event"><rect x="479" y="172" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="515" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">APPEND</text></g><polyline data-edge="event-checkpoint" data-from="event-log" data-to="checkpoint" data-kind="forward" points="740,264 790,264" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-02-state-event-log-arrow)"/><g data-edge-label="event-checkpoint"><rect x="729" y="172" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="765" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">CURSOR</text></g><polyline data-edge="checkpoint-recovery" data-from="checkpoint" data-to="recovery" data-kind="forward" points="895,308 895,370 565,370 565,420" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-02-state-event-log-arrow)"/><g data-edge-label="checkpoint-recovery"><rect x="714" y="357" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="750" y="374" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">RESUME</text></g><polyline data-edge="recovery-state" data-from="recovery" data-to="state-machine" data-kind="feedback" points="455,461 390,461 390,308" fill="none" stroke="#F5C36A" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-02-state-event-log-arrow)"/><g data-edge-label="recovery-state"><rect x="294" y="387" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="330" y="404" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#F5D28C" text-anchor="middle">REPLAY</text></g><g data-node="plan" data-kind="stage"><rect x="50" y="220" width="180" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="140" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">PLAN</text><text x="140" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">可修订建议</text></g><g data-node="state-machine" data-kind="decision"><rect x="280" y="220" width="210" height="88" rx="20" fill="#4A391D" stroke="#F5CA72" stroke-width="2"/><text x="385" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">STATE MACHINE</text><text x="385" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">合法迁移</text></g><g data-node="event-log" data-kind="evidence"><rect x="540" y="220" width="200" height="88" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="640" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">EVENT LOG</text><text x="640" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">追加事实</text></g><g data-node="checkpoint" data-kind="host"><rect x="790" y="220" width="210" height="88" rx="20" fill="#3D315B" stroke="#B8A7F8" stroke-width="2"/><text x="895" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">CHECKPOINT</text><text x="895" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">游标 + 版本</text></g><g data-node="recovery" data-kind="controlled"><rect x="455" y="420" width="220" height="82" rx="20" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/><text x="565" y="454.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">RECOVERY</text><text x="565" y="479.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">重放并核验</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">把聊天计划当唯一状态，会同时失去合法迁移约束和故障后的重放证据。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">STATE-MACHINE · event-sourced-recovery</text>
</svg>