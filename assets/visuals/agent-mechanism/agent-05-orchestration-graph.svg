<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-05-orchestration-graph-title visual-agent-05-orchestration-graph-description">
  <title id="visual-agent-05-orchestration-graph-title">依赖、并行、委派与汇合核验</title>
  <desc id="visual-agent-05-orchestration-graph-description">图表示 orchestration 的四个控制阶段：任务拆分、依赖建模、独立分支调度与 join validation。委派不会消除统一 task contract、预算或证据一致性责任。</desc>
  <defs>
    <marker id="visual-agent-05-orchestration-graph-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">编排图表达依赖、并行与汇合</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">仅独立分支并行；join 对共享状态与证据做统一核验。</text>
  <g data-kind="dag"><polyline data-edge="decompose-a" data-from="decompose" data-to="branch-a" data-kind="forward" points="250,294 300,294 300,224 350,224" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-orchestration-graph-arrow)"/><g data-edge-label="decompose-a"><rect x="332" y="144" width="176" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="420" y="161" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">2 PARALLEL BRANCHES</text></g><polyline data-edge="decompose-b" data-from="decompose" data-to="branch-b" data-kind="forward" points="250,334 300,334 300,414 350,414" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-orchestration-graph-arrow)"/><polyline data-edge="a-join" data-from="branch-a" data-to="join" data-kind="forward" points="550,224 620,224 620,294 690,294" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-orchestration-graph-arrow)"/><g data-edge-label="a-join"><rect x="560" y="177" width="120" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="620" y="194" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">JOIN INPUT 1</text></g><polyline data-edge="b-join" data-from="branch-b" data-to="join" data-kind="forward" points="550,414 640,414 640,334 690,334" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-orchestration-graph-arrow)"/><g data-edge-label="b-join"><rect x="580" y="427" width="120" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="640" y="444" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">JOIN INPUT 2</text></g><polyline data-edge="join-validate" data-from="join" data-to="validate" data-kind="forward" points="890,314 970,314" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-orchestration-graph-arrow)"/><g data-edge-label="join-validate"><rect x="878" y="227" width="104" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="930" y="244" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">CONSISTENT</text></g><g data-node="decompose" data-kind="stage"><rect x="50" y="270" width="200" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="150" y="307.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">DECOMPOSE</text><text x="150" y="332.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">任务拆分</text></g><g data-node="branch-a" data-kind="stage"><rect x="350" y="180" width="200" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="450" y="217.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">BRANCH A</text><text x="450" y="242.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">独立取证</text></g><g data-node="branch-b" data-kind="stage"><rect x="350" y="370" width="200" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="450" y="407.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">BRANCH B</text><text x="450" y="432.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">独立执行</text></g><g data-node="join" data-kind="decision"><rect x="690" y="270" width="200" height="88" rx="20" fill="#4A391D" stroke="#F5CA72" stroke-width="2"/><text x="790" y="307.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">JOIN</text><text x="790" y="332.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">2 INPUTS 对账</text></g><g data-node="validate" data-kind="evidence"><rect x="970" y="270" width="180" height="88" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="1060" y="307.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">VALIDATE</text><text x="1060" y="332.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">共同状态 + 证据</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">并行是依赖图的结果，不是多 Agent 数量越多越好。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">DAG · parallel-fork-join</text>
</svg>