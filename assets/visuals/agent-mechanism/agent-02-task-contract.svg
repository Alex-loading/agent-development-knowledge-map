<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-02-task-contract-title visual-agent-02-task-contract-description">
  <title id="visual-agent-02-task-contract-title">从用户意图到可验证任务契约</title>
  <desc id="visual-agent-02-task-contract-description">四个节点把模糊意图转为 objective、constraints、success evidence 与 termination。图强调硬约束、软偏好、未知项和验收必须在工具执行前变成可检查字段。</desc>
  <defs>
    <marker id="visual-agent-02-task-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">把意图编译成任务契约</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">成功标准与停止条件先于执行。</text>
  <g data-kind="decision"><polyline data-edge="intent-contract" data-from="intent" data-to="contract" data-kind="forward" points="250,264 320,264" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-02-task-contract-arrow)"/><g data-edge-label="intent-contract"><rect x="245" y="172" width="80" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="285" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">COMPILE</text></g><polyline data-edge="contract-success" data-from="contract" data-to="success" data-kind="forward" points="530,264 600,264" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-02-task-contract-arrow)"/><g data-edge-label="contract-success"><rect x="529" y="172" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="565" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">BIND</text></g><polyline data-edge="success-termination" data-from="success" data-to="termination" data-kind="forward" points="810,264 880,264" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-02-task-contract-arrow)"/><g data-edge-label="success-termination"><rect x="809" y="172" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="845" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">CHECK</text></g><polyline data-edge="termination-done" data-from="termination" data-to="done" data-kind="forward" points="950,308 950,365 795,365 795,410" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-02-task-contract-arrow)"/><g data-edge-label="termination-done"><rect x="839" y="352" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="875" y="369" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">TRUE</text></g><polyline data-edge="termination-blocked" data-from="termination" data-to="blocked" data-kind="forward" points="1030,308 1030,410" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-02-task-contract-arrow)"/><g data-edge-label="termination-blocked"><rect x="1050" y="347" width="80" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="1090" y="364" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">UNKNOWN</text></g><g data-node="intent" data-kind="stage"><rect x="60" y="220" width="190" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="155" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">INTENT</text><text x="155" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">用户意图</text></g><g data-node="contract" data-kind="stage"><rect x="320" y="220" width="210" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="425" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">CONTRACT</text><text x="425" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">目标 + 约束</text></g><g data-node="success" data-kind="evidence"><rect x="600" y="220" width="210" height="88" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="705" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">SUCCESS</text><text x="705" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">证据谓词</text></g><g data-node="termination" data-kind="decision"><rect x="880" y="220" width="220" height="88" rx="20" fill="#4A391D" stroke="#F5CA72" stroke-width="2"/><text x="990" y="257.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">TERMINATION</text><text x="990" y="282.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">出口判定</text></g><g data-node="done" data-kind="outcome"><rect x="710" y="410" width="170" height="78" rx="20" fill="#1E5141" stroke="#88E0B7" stroke-width="2"/><text x="795" y="442.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">DONE</text><text x="795" y="467.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">证据满足</text></g><g data-node="blocked" data-kind="blocked"><rect x="940" y="410" width="190" height="78" rx="20" fill="#562E35" stroke="#F2A6B2" stroke-width="2"/><text x="1035" y="442.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">BLOCKED</text><text x="1035" y="467.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">缺条件 / 需交接</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">计划说明可能怎么做；任务契约规定什么算完成以及何时必须停止。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">DECISION · task-contract-gates</text>
</svg>