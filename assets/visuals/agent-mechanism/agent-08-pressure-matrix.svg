<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-08-pressure-matrix-title visual-agent-08-pressure-matrix-description">
  <title id="visual-agent-08-pressure-matrix-title">端到端 Agent 压力测试矩阵</title>
  <desc id="visual-agent-08-pressure-matrix-description">图把 tool failure、ambiguous success、stale context、unauthorized action、loop 和 version drift 归入可观察故障，再要求恢复、blocked、handoff 或评测回归等明确出口。</desc>
  <defs>
    <marker id="visual-agent-08-pressure-matrix-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">上线前压力矩阵</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">故障必须落到可观察、可恢复、可评测的控制出口。</text>
  <g data-kind="matrix"><rect data-column="failure" x="82" y="182" width="210" height="52" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="187" y="215" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#8EECE1" text-anchor="middle">FAILURE</text><rect data-column="signal" x="292" y="182" width="245" height="52" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="414.5" y="215" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#8EECE1" text-anchor="middle">SIGNAL</text><rect data-column="control" x="537" y="182" width="260" height="52" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="667" y="215" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#8EECE1" text-anchor="middle">CONTROL</text><rect data-column="exit" x="797" y="182" width="320" height="52" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="957" y="215" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#8EECE1" text-anchor="middle">EXIT</text><g data-row="tool" data-column="failure"><rect x="82" y="234" width="210" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="187" y="270" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5FBFF" text-anchor="middle">TOOL FAILURE</text></g><g data-row="tool" data-column="signal"><rect x="292" y="234" width="245" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="414.5" y="270" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">ERROR + CALL ID</text></g><g data-row="tool" data-column="control"><rect x="537" y="234" width="260" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="667" y="270" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">RETRY / RECONCILE</text></g><g data-row="tool" data-column="exit"><rect x="797" y="234" width="320" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="957" y="270" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#A7E8C2" text-anchor="middle">RECOVERED / BLOCKED</text></g><g data-row="ambiguous" data-column="failure"><rect x="82" y="292" width="210" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="187" y="328" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5FBFF" text-anchor="middle">AMBIGUOUS SUCCESS</text></g><g data-row="ambiguous" data-column="signal"><rect x="292" y="292" width="245" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="414.5" y="328" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">MISSING PROOF</text></g><g data-row="ambiguous" data-column="control"><rect x="537" y="292" width="260" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="667" y="328" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">VALIDATE</text></g><g data-row="ambiguous" data-column="exit"><rect x="797" y="292" width="320" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="957" y="328" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#A7E8C2" text-anchor="middle">BLOCKED</text></g><g data-row="stale" data-column="failure"><rect x="82" y="350" width="210" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="187" y="386" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5FBFF" text-anchor="middle">STALE CONTEXT</text></g><g data-row="stale" data-column="signal"><rect x="292" y="350" width="245" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="414.5" y="386" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">VERSION MISMATCH</text></g><g data-row="stale" data-column="control"><rect x="537" y="350" width="260" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="667" y="386" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">REFRESH</text></g><g data-row="stale" data-column="exit"><rect x="797" y="350" width="320" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="957" y="386" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#A7E8C2" text-anchor="middle">REPLAN</text></g><g data-row="unauthorized" data-column="failure"><rect x="82" y="408" width="210" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="187" y="444" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5FBFF" text-anchor="middle">UNAUTHORIZED ACTION</text></g><g data-row="unauthorized" data-column="signal"><rect x="292" y="408" width="245" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="414.5" y="444" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">POLICY DENY</text></g><g data-row="unauthorized" data-column="control"><rect x="537" y="408" width="260" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="667" y="444" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">REJECT</text></g><g data-row="unauthorized" data-column="exit"><rect x="797" y="408" width="320" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="957" y="444" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#A7E8C2" text-anchor="middle">STOP</text></g><g data-row="loop" data-column="failure"><rect x="82" y="466" width="210" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="187" y="502" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5FBFF" text-anchor="middle">LOOP EXHAUSTED</text></g><g data-row="loop" data-column="signal"><rect x="292" y="466" width="245" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="414.5" y="502" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">ROUND 4 / 4</text></g><g data-row="loop" data-column="control"><rect x="537" y="466" width="260" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="667" y="502" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">CHECKPOINT</text></g><g data-row="loop" data-column="exit"><rect x="797" y="466" width="320" height="58" fill="#102C40" stroke="#31556B" stroke-width="1"/><text x="957" y="502" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#A7E8C2" text-anchor="middle">HANDOFF</text></g><g data-row="drift" data-column="failure"><rect x="82" y="524" width="210" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="187" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5FBFF" text-anchor="middle">VERSION DRIFT</text></g><g data-row="drift" data-column="signal"><rect x="292" y="524" width="245" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="414.5" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">CONTRACT CHANGED</text></g><g data-row="drift" data-column="control"><rect x="537" y="524" width="260" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="667" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">MIGRATE</text></g><g data-row="drift" data-column="exit"><rect x="797" y="524" width="320" height="58" fill="#0D2537" stroke="#31556B" stroke-width="1"/><text x="957" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#A7E8C2" text-anchor="middle">REGRESSION TEST</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">压力测试验证每个失败出口都可达、可解释且不会伪报完成。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">MATRIX · failure-control-exit-matrix</text>
</svg>