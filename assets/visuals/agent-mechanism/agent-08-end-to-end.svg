<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-08-end-to-end-title visual-agent-08-end-to-end-description">
  <title id="visual-agent-08-end-to-end-title">单 Agent 的端到端控制面</title>
  <desc id="visual-agent-08-end-to-end-description">图把 task contract、Agent loop、tool boundary 和 completion validator 串为一个可审计系统。模型只参与候选决策，宿主持有权限、状态、执行、证据和终止权。</desc>
  <defs>
    <marker id="visual-agent-08-end-to-end-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">单 Agent 端到端控制面</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">目标、工具、状态、验证与终止共同组成可上线闭环。</text>
  <g data-kind="control-loop"><polyline data-edge="contract-loop" data-from="contract" data-to="loop" data-kind="forward" points="270,284 330,284" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-08-end-to-end-arrow)"/><g data-edge-label="contract-loop"><rect x="264" y="192" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="300" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">DRIVE</text></g><polyline data-edge="loop-tools" data-from="loop" data-to="tools" data-kind="forward" points="540,284 600,284" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-08-end-to-end-arrow)"/><g data-edge-label="loop-tools"><rect x="534" y="192" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="570" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">CALL</text></g><polyline data-edge="tools-validator" data-from="tools" data-to="validator" data-kind="forward" points="810,284 870,284" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-08-end-to-end-arrow)"/><g data-edge-label="tools-validator"><rect x="800" y="192" width="80" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="840" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">OBSERVE</text></g><polyline data-edge="validator-done" data-from="validator" data-to="done" data-kind="forward" points="975,328 975,440" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-08-end-to-end-arrow)"/><g data-edge-label="validator-done"><rect x="1014" y="372" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="1050" y="389" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">PROVED</text></g><polyline data-edge="validator-loop" data-from="validator" data-to="loop" data-kind="feedback" points="870,284 840,284 840,390 435,390 435,328" fill="none" stroke="#F5C36A" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-08-end-to-end-arrow)"/><g data-edge-label="validator-loop"><rect x="596" y="377" width="88" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="640" y="394" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#F5D28C" text-anchor="middle">CONTINUE</text></g><g data-node="contract" data-kind="stage"><rect x="60" y="240" width="210" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="165" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">CONTRACT</text><text x="165" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">目标 + 约束</text></g><g data-node="loop" data-kind="controlled"><rect x="330" y="240" width="210" height="88" rx="20" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/><text x="435" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">AGENT LOOP</text><text x="435" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">状态 + 候选动作</text></g><g data-node="tools" data-kind="host"><rect x="600" y="240" width="210" height="88" rx="20" fill="#3D315B" stroke="#B8A7F8" stroke-width="2"/><text x="705" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">TOOLS</text><text x="705" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">最小权限执行</text></g><g data-node="validator" data-kind="evidence"><rect x="870" y="240" width="210" height="88" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="975" y="277.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">VALIDATOR</text><text x="975" y="302.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">完成证据裁决</text></g><g data-node="done" data-kind="outcome"><rect x="870" y="440" width="210" height="74" rx="20" fill="#1E5141" stroke="#88E0B7" stroke-width="2"/><text x="975" y="470.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">DONE</text><text x="975" y="495.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">显式终止</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">可上线 Agent 是一组相互校验的控制契约，不是模型外面套一个 while 循环。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">CONTROL-LOOP · validated-agent-control-loop</text>
</svg>