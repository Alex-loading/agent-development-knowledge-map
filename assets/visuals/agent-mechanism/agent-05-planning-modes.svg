<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Direct、Plan-then-act、Replan 与 Workflow Graph</title>
  <desc id="description">图把一步直达、先计划后执行、观察驱动重规划和显式工作流图放在同一复杂度轴上。选择依据是依赖是否稳定及关键事实何时可见，而不是框架名称。</desc>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="105" font-size="34" font-weight="750" fill="#F5FBFF">规划模式按不确定性升级</text>
  <text x="64" y="150" font-size="19" fill="#B8CBD8">越晚才能获得关键事实，越需要在线重规划。</text>
  <g data-edge="visual-agent-05-planning-modes-edge-1">
      <path d="M 260 322 L 333 322" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <path d="M 327 314 L 345 322 L 327 330" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <rect x="264.5" y="274" width="76" height="30" rx="15" fill="#10283A"/>
      <text x="302.5" y="295" text-anchor="middle" font-size="16" fill="#8EECE1">复杂度+</text>
    </g>
<g data-edge="visual-agent-05-planning-modes-edge-2">
      <path d="M 545 322 L 618 322" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <path d="M 612 314 L 630 322 L 612 330" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <rect x="549.5" y="274" width="76" height="30" rx="15" fill="#10283A"/>
      <text x="587.5" y="295" text-anchor="middle" font-size="16" fill="#8EECE1">不确定性+</text>
    </g>
<g data-edge="visual-agent-05-planning-modes-edge-3">
      <path d="M 830 322 L 903 322" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <path d="M 897 314 L 915 322 L 897 330" fill="none" stroke="#57D6C7" stroke-width="4"/>
      <rect x="834.5" y="274" width="76" height="30" rx="15" fill="#10283A"/>
      <text x="872.5" y="295" text-anchor="middle" font-size="16" fill="#8EECE1">耐久性+</text>
    </g>
  <g data-node="visual-agent-05-planning-modes-node-1">
      <rect x="60" y="270" width="200" height="104" rx="22" fill="#173B55" stroke="#75E3D6" stroke-width="2"/>
      <text x="160" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#F5FBFF">DIRECT</text>
<text x="160" y="328" text-anchor="middle" font-size="16" font-weight="500" fill="#F5FBFF">一步可证</text>
    </g>
<g data-node="visual-agent-05-planning-modes-node-2">
      <rect x="345" y="270" width="200" height="104" rx="22" fill="#1E4B55" stroke="#75E3D6" stroke-width="2"/>
      <text x="445" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#F5FBFF">PLAN-THEN-ACT</text>
<text x="445" y="328" text-anchor="middle" font-size="16" font-weight="500" fill="#F5FBFF">低变化</text>
    </g>
<g data-node="visual-agent-05-planning-modes-node-3">
      <rect x="630" y="270" width="200" height="104" rx="22" fill="#173B55" stroke="#75E3D6" stroke-width="2"/>
      <text x="730" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#F5FBFF">REPLAN</text>
<text x="730" y="328" text-anchor="middle" font-size="16" font-weight="500" fill="#F5FBFF">观察驱动</text>
    </g>
<g data-node="visual-agent-05-planning-modes-node-4">
      <rect x="915" y="270" width="200" height="104" rx="22" fill="#1E4B55" stroke="#75E3D6" stroke-width="2"/>
      <text x="1015" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#F5FBFF">GRAPH</text>
<text x="1015" y="328" text-anchor="middle" font-size="16" font-weight="500" fill="#F5FBFF">显式依赖</text>
    </g>
  <text x="64" y="590" font-size="18" fill="#7FA1B5">关键事实越晚出现，越需要在线重规划；路径越稳定，越适合确定性图。</text>
  <text x="1136" y="610" text-anchor="end" font-size="16" fill="#5F8195">Agent Learner · 2026-07-30</text>
</svg>