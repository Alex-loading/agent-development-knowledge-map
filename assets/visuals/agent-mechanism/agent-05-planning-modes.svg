<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-05-planning-modes-title visual-agent-05-planning-modes-description">
  <title id="visual-agent-05-planning-modes-title">Direct、Plan-then-act、Replan 与 Workflow Graph</title>
  <desc id="visual-agent-05-planning-modes-description">图把一步直达、先计划后执行、观察驱动重规划和显式工作流图放在同一复杂度轴上。选择依据是依赖是否稳定及关键事实何时可见，而不是框架名称。</desc>
  <defs>
    <marker id="visual-agent-05-planning-modes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">规划模式按不确定性升级</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">关键事实越晚出现，越需要在线重规划或显式依赖图。</text>
  <g data-kind="planning-graph"><polyline data-edge="task-direct" data-from="task" data-to="direct" data-kind="forward" points="250,314 285,314 285,214 330,214" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-planning-modes-arrow)"/><g data-edge-label="task-direct"><rect x="249" y="222" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="285" y="239" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">STABLE</text></g><polyline data-edge="task-plan" data-from="task" data-to="plan" data-kind="forward" points="250,314 285,314 285,414 330,414" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-planning-modes-arrow)"/><g data-edge-label="task-plan"><rect x="254" y="377" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="290" y="394" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">KNOWN</text></g><polyline data-edge="direct-verified" data-from="direct" data-to="verified" data-kind="forward" points="425,170 425,155 900,155 900,314 950,314" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-planning-modes-arrow)"/><g data-edge-label="direct-verified"><rect x="666" y="142" width="88" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="710" y="159" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">ONE STEP</text></g><polyline data-edge="plan-replan" data-from="plan" data-to="replan" data-kind="forward" points="540,414 600,414 600,214 650,214" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-planning-modes-arrow)"/><g data-edge-label="plan-replan"><rect x="552" y="302" width="96" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="600" y="319" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">NEW FACTS</text></g><polyline data-edge="plan-graph" data-from="plan" data-to="graph" data-kind="forward" points="540,414 650,414" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-planning-modes-arrow)"/><g data-edge-label="plan-graph"><rect x="555" y="452" width="80" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="595" y="469" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">DURABLE</text></g><polyline data-edge="replan-verified" data-from="replan" data-to="verified" data-kind="forward" points="840,214 900,214 900,314 950,314" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-planning-modes-arrow)"/><polyline data-edge="graph-verified" data-from="graph" data-to="verified" data-kind="forward" points="860,414 900,414 900,314 950,314" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-05-planning-modes-arrow)"/><g data-node="task" data-kind="decision"><rect x="50" y="270" width="200" height="88" rx="20" fill="#4A391D" stroke="#F5CA72" stroke-width="2"/><text x="150" y="307.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">TASK</text><text x="150" y="332.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">依赖与不确定性</text></g><g data-node="direct" data-kind="stage"><rect x="330" y="170" width="190" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="425" y="207.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">DIRECT</text><text x="425" y="232.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">一步可证</text></g><g data-node="plan" data-kind="stage"><rect x="330" y="370" width="210" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="435" y="407.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">PLAN-THEN-ACT</text><text x="435" y="432.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">低变化路径</text></g><g data-node="replan" data-kind="controlled"><rect x="650" y="170" width="190" height="88" rx="20" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/><text x="745" y="207.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">REPLAN</text><text x="745" y="232.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">观察驱动</text></g><g data-node="graph" data-kind="protocol"><rect x="650" y="370" width="210" height="88" rx="20" fill="#293B63" stroke="#9FB7FF" stroke-width="2"/><text x="755" y="407.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">WORKFLOW GRAPH</text><text x="755" y="432.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">显式依赖</text></g><g data-node="verified" data-kind="evidence"><rect x="950" y="270" width="190" height="88" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="1045" y="307.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">VERIFIED EXIT</text><text x="1045" y="332.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">统一验收</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">关键事实越晚出现，越需要在线重规划；路径越稳定，越适合确定性图。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">PLANNING-GRAPH · uncertainty-escalation</text>
</svg>