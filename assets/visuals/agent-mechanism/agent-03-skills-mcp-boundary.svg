<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-03-skills-mcp-boundary-title visual-agent-03-skills-mcp-boundary-description">
  <title id="visual-agent-03-skills-mcp-boundary-title">Skills、MCP、宿主执行与 Agent Loop 的职责边界</title>
  <desc id="visual-agent-03-skills-mcp-boundary-description">四个节点逐层区分知识封装、连接协议、执行授权和控制循环。图明确接入 MCP server 不会自动授予业务权限，拥有 Skill 也不等于工具已经执行。</desc>
  <defs>
    <marker id="visual-agent-03-skills-mcp-boundary-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">Skills、MCP 与 Agent 的边界</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">知识封装、互操作协议与控制循环解决不同问题。</text>
  <g data-kind="layers"><polyline data-edge="skills-agent" data-from="skills" data-to="agent-loop" data-kind="forward" points="600,239 600,270" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-03-skills-mcp-boundary-arrow)"/><g data-edge-label="skills-agent"><rect x="664" y="241" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="700" y="258" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">INFORM</text></g><polyline data-edge="agent-mcp" data-from="agent-loop" data-to="mcp" data-kind="forward" points="600,334 600,365" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-03-skills-mcp-boundary-arrow)"/><g data-edge-label="agent-mcp"><rect x="664" y="336" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="700" y="353" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">SELECT</text></g><polyline data-edge="mcp-host" data-from="mcp" data-to="host" data-kind="forward" points="600,429 600,460" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-03-skills-mcp-boundary-arrow)"/><g data-edge-label="mcp-host"><rect x="660" y="431" width="80" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="700" y="448" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">REQUEST</text></g><g data-node="skills" data-kind="layer"><rect x="180" y="175" width="840" height="64" rx="16" fill="#183850" stroke="#7CCBDD" stroke-width="2"/><text x="600" y="213" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">SKILLS · 操作知识与渐进披露</text></g><g data-node="agent-loop" data-kind="controlled"><rect x="180" y="270" width="840" height="64" rx="20" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/><text x="600" y="308" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">AGENT LOOP · 决定何时以及为何调用</text></g><g data-node="mcp" data-kind="protocol"><rect x="180" y="365" width="840" height="64" rx="20" fill="#293B63" stroke="#9FB7FF" stroke-width="2"/><text x="600" y="403" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">MCP · 工具发现与能力互操作协议</text></g><g data-node="host" data-kind="host"><rect x="180" y="460" width="840" height="64" rx="20" fill="#3D315B" stroke="#B8A7F8" stroke-width="2"/><text x="600" y="498" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">HOST · 授权、执行、审计与停止权</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">Skills 不是 MCP，MCP 也不是 Agent；三者可组合但不能互相替代。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">LAYERS · responsibility-boundary-stack</text>
</svg>