<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-07-context-layers-title visual-agent-07-context-layers-description">
  <title id="visual-agent-07-context-layers-title">Transcript、State、Scratchpad 与 Context 分层</title>
  <desc id="visual-agent-07-context-layers-description">图分开原始消息历史、结构化当前状态、临时工作草稿和单次模型可见上下文。它强调 context 是按任务与预算组装的投影视图，不等于所有存储。</desc>
  <defs>
    <marker id="visual-agent-07-context-layers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">上下文对象分层</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">本轮 context 是投影视图，不等于 transcript、state 或长期存储。</text>
  <g data-kind="layers"><polyline data-edge="transcript-state" data-from="transcript" data-to="state" data-kind="forward" points="600,225 600,245" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-07-context-layers-arrow)"/><g data-edge-label="transcript-state"><rect x="1069" y="222" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="1105" y="239" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">REDUCE</text></g><polyline data-edge="state-scratch" data-from="state" data-to="scratchpad" data-kind="forward" points="600,305 600,325" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-07-context-layers-arrow)"/><g data-edge-label="state-scratch"><rect x="1069" y="302" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="1105" y="319" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">GUIDE</text></g><polyline data-edge="scratch-evidence" data-from="scratchpad" data-to="evidence" data-kind="forward" points="600,385 600,405" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-07-context-layers-arrow)"/><g data-edge-label="scratch-evidence"><rect x="1069" y="382" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="1105" y="399" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">QUERY</text></g><polyline data-edge="evidence-context" data-from="evidence" data-to="context" data-kind="forward" points="600,465 600,485" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-07-context-layers-arrow)"/><g data-edge-label="evidence-context"><rect x="1069" y="462" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="1105" y="479" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">SELECT</text></g><g data-node="transcript" data-kind="layer"><rect x="140" y="165" width="920" height="60" rx="16" fill="#183850" stroke="#7CCBDD" stroke-width="2"/><text x="600" y="201" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">TRANSCRIPT · 原始交互事件</text></g><g data-node="state" data-kind="controlled"><rect x="140" y="245" width="920" height="60" rx="20" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/><text x="600" y="281" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">STATE · 结构化当前事实</text></g><g data-node="scratchpad" data-kind="layer"><rect x="140" y="325" width="920" height="60" rx="16" fill="#183850" stroke="#7CCBDD" stroke-width="2"/><text x="600" y="361" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">SCRATCHPAD · 临时工作，不作事实证据</text></g><g data-node="evidence" data-kind="evidence"><rect x="140" y="405" width="920" height="60" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="600" y="441" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">RETRIEVED EVIDENCE · 来源 + 版本</text></g><g data-node="context" data-kind="host"><rect x="140" y="485" width="920" height="60" rx="20" fill="#3D315B" stroke="#B8A7F8" stroke-width="2"/><text x="600" y="521" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">CONTEXT · 本轮按权限与预算装配的投影</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">保存在哪里与本轮是否可见是两个问题；state 也不应退化成完整聊天记录。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">LAYERS · context-projection-stack</text>
</svg>