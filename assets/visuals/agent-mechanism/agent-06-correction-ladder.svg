<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-agent-06-correction-ladder-title visual-agent-06-correction-ladder-description">
  <title id="visual-agent-06-correction-ladder-title">Retry、Replan、Reflection 与 External Validation 纠错阶梯</title>
  <desc id="visual-agent-06-correction-ladder-description">图将四类纠错动作按信息增量排列。Reflection 只能从轨迹提出下一次约束，测试、规则、环境状态或人工反馈才提供独立的接受证据。</desc>
  <defs>
    <marker id="visual-agent-06-correction-ladder-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#F5FBFF" text-anchor="start">纠错阶梯</text>
  <text x="64" y="137" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8CBD8" text-anchor="start">Reflection 只能提出修订；独立验证决定接受还是拒绝。</text>
  <g data-kind="ladder"><polyline data-edge="failure-retry" data-from="failure" data-to="retry" data-kind="forward" points="190,304 225,304" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-06-correction-ladder-arrow)"/><g data-edge-label="failure-retry"><rect x="160" y="192" width="96" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="208" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">TRANSIENT</text></g><polyline data-edge="retry-replan" data-from="retry" data-to="replan" data-kind="forward" points="435,304 475,304" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-06-correction-ladder-arrow)"/><g data-edge-label="retry-replan"><rect x="399" y="192" width="112" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="455" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">STILL FAILS</text></g><polyline data-edge="replan-reflect" data-from="replan" data-to="reflect" data-kind="forward" points="645,304 685,304" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-06-correction-ladder-arrow)"/><g data-edge-label="replan-reflect"><rect x="617" y="192" width="96" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="665" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">SUMMARIZE</text></g><polyline data-edge="reflect-validate" data-from="reflect" data-to="validate" data-kind="forward" points="875,304 915,304" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-06-correction-ladder-arrow)"/><g data-edge-label="reflect-validate"><rect x="855" y="192" width="80" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="895" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">PROPOSE</text></g><polyline data-edge="validate-accept" data-from="validate" data-to="accept" data-kind="forward" points="1015,348 1015,395 885,395 885,440" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-06-correction-ladder-arrow)"/><g data-edge-label="validate-accept"><rect x="894" y="382" width="72" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="930" y="399" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">PROVED</text></g><polyline data-edge="validate-reject" data-from="validate" data-to="reject" data-kind="forward" points="1015,348 1015,440" fill="none" stroke="#57D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-agent-06-correction-ladder-arrow)"/><g data-edge-label="validate-reject"><rect x="1038" y="382" width="104" height="24" rx="12" fill="#10283A" stroke="#31556B" stroke-width="1"/><text x="1090" y="399" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#8EECE1" text-anchor="middle">NOT PROVED</text></g><g data-node="failure" data-kind="stage"><rect x="40" y="260" width="150" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="115" y="297.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">FAILURE</text><text x="115" y="322.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">分类</text></g><g data-node="retry" data-kind="controlled"><rect x="225" y="240" width="210" height="128" rx="20" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/><text x="330" y="288" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">RETRY</text><text x="330" y="310" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">ATTEMPT 1 → ATTEMPT 2</text><text x="330" y="332" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">MAX RETRIES 2</text></g><g data-node="replan" data-kind="stage"><rect x="475" y="260" width="170" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="560" y="297.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">REPLAN</text><text x="560" y="322.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">换路径</text></g><g data-node="reflect" data-kind="stage"><rect x="685" y="260" width="190" height="88" rx="20" fill="#173B55" stroke="#75E3D6" stroke-width="2"/><text x="780" y="297.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">REFLECT</text><text x="780" y="322.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">形成修订假设</text></g><g data-node="validate" data-kind="evidence"><rect x="915" y="260" width="200" height="88" rx="20" fill="#24482F" stroke="#9FE5B0" stroke-width="2"/><text x="1015" y="297.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">VALIDATE</text><text x="1015" y="322.5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" fill="#F5FBFF" text-anchor="middle">独立外部证明</text></g><g data-node="accept" data-kind="outcome"><rect x="815" y="440" width="140" height="70" rx="20" fill="#1E5141" stroke="#88E0B7" stroke-width="2"/><text x="885" y="481" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">ACCEPT</text></g><g data-node="reject" data-kind="blocked"><rect x="1010" y="440" width="140" height="70" rx="20" fill="#562E35" stroke="#F2A6B2" stroke-width="2"/><text x="1080" y="481" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">REJECT</text></g></g>
  <text x="64" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#91AABA" text-anchor="start">Reflection 是候选修订，不是正确性证明；外部验证才关闭证据环。</text>
  <text x="1136" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">LADDER · retry-replan-reflect-validate</text>
</svg>