<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">两类 revision 使用不同通信前提</title>
<desc id="desc">左侧是 2026-07-28，可选 discover 预查，也可以直接发送带完整 metadata 的业务请求。右侧是 2025-11-25，先 initialize，再 initialized，然后按协商版本通信。可识别 Modern 错误需要修正请求，HTTP 400 需要检查正文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#183d36">
<text x="44" y="47" font-size="16" font-weight="700" fill="#a06a21">AGENT LEARNER / VERSIONING</text>
<text x="44" y="93" font-size="32" font-weight="700">两类 revision 使用不同通信前提</text>
<rect x="44" y="148" width="490" height="327" rx="10" fill="#e4ebe3"/>
<rect x="586" y="148" width="490" height="327" rx="10" fill="#ece4d6"/>
<text x="68" y="189" font-size="24" font-weight="700">2026-07-28 / Modern</text>
<text x="610" y="189" font-size="24" font-weight="700">2025-11-25 / Legacy</text>
<rect x="68" y="213" width="442" height="84" rx="8" fill="#f7f1e5" stroke="#899f91"/>
<text x="88" y="247" font-size="22" font-weight="700">server/discover · 可选预查</text>
<text x="88" y="278" font-size="18">Server 必须提供；Client 可先调用</text>
<line x1="289" y1="298" x2="289" y2="326" stroke="#183d36" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="68" y="330" width="442" height="94" rx="8" fill="#183d36"/>
<text x="88" y="366" font-size="22" font-weight="700" fill="#f7f1e5">每请求携带 version 与 capabilities</text>
<text x="88" y="401" font-size="19" fill="#f7f1e5">Client 也可直接发送业务请求</text>
<text x="68" y="455" font-size="18">虚线表示可选预查后的路线</text>
<rect x="610" y="213" width="442" height="58" rx="8" fill="#f7f1e5" stroke="#b29c78"/>
<text x="632" y="250" font-size="23" font-weight="700">initialize</text>
<line x1="831" y1="272" x2="831" y2="298" stroke="#183d36" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="610" y="301" width="442" height="58" rx="8" fill="#f7f1e5" stroke="#b29c78"/>
<text x="632" y="338" font-size="23" font-weight="700">notifications/initialized</text>
<line x1="831" y1="360" x2="831" y2="386" stroke="#183d36" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="610" y="389" width="442" height="58" rx="8" fill="#183d36"/>
<text x="632" y="426" font-size="22" font-weight="700" fill="#f7f1e5">按协商 revision 通信</text>
<rect x="44" y="502" width="1032" height="104" rx="8" fill="#e4ebe3"/>
<text x="64" y="533" font-size="20" font-weight="700">Dual-era：可识别 Modern 错误 → 修正当前请求</text>
<text x="64" y="565" font-size="19">stdio 其他错误或合理超时 → 旧版 initialize</text>
<text x="64" y="594" font-size="19">HTTP 400 → 继续检查 JSON-RPC 正文，不能仅凭状态码决定回退</text>
</g>
</svg>
