<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">Host 管理上下文，Client 分别连接 Server</title>
<desc id="desc">一个企业资料助手 Host 管理完整对话、授权控制和两个 Client。制度 Client 与工单 Client 分别连接对应 Server，箭头表示请求和结果。Host 控制跨服务信息流，连接数量无法证明 Agent 数量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#183d36">
<text x="44" y="47" font-size="16" font-weight="700" fill="#a06a21">AGENT LEARNER / MCP 2026-07-28</text>
<text x="44" y="93" font-size="30" font-weight="700">Host 管理上下文，Client 分别连接 Server</text>
<rect x="44" y="152" width="580" height="385" rx="12" fill="#e4ebe3" stroke="#899f91" stroke-width="2"/>
<text x="68" y="194" font-size="24" font-weight="700">Host · 企业资料助手</text>
