<text x="88" y="316" fill="#f7f1e5" font-size="22" font-weight="700">完整对话</text>
<text x="88" y="351" fill="#f7f1e5" font-size="21">上下文与授权控制</text>
<text x="88" y="394" fill="#f7f1e5" font-size="18">仅交付本次所需信息</text>
<rect x="348" y="219" width="240" height="114" rx="9" fill="#f7f1e5" stroke="#899f91"/>
<text x="369" y="264" font-size="23" font-weight="700">制度 Client</text>
<text x="369" y="299" font-size="18">对应制度 Server</text>
<rect x="348" y="389" width="240" height="114" rx="9" fill="#f7f1e5" stroke="#899f91"/>
<text x="369" y="434" font-size="23" font-weight="700">工单 Client</text>
<text x="369" y="469" font-size="18">对应工单 Server</text>
<path d="M 308 331 L 328 331 L 328 276 L 346 276" fill="none" stroke="#183d36" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 308 373 L 328 373 L 328 446 L 346 446" fill="none" stroke="#183d36" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="744" y="219" width="332" height="114" rx="9" fill="#ece4d6" stroke="#b29c78"/>
<text x="769" y="265" font-size="24" font-weight="700">制度 Server</text>
<text x="769" y="301" font-size="20">提供制度能力与内容</text>
<rect x="744" y="389" width="332" height="114" rx="9" fill="#ece4d6" stroke="#b29c78"/>
<text x="769" y="435" font-size="24" font-weight="700">工单 Server</text>
<text x="769" y="471" font-size="20">提供工单业务能力</text>
<line x1="591" y1="260" x2="740" y2="260" stroke="#183d36" stroke-width="2" marker-end="url(#arrow)"/>
<text x="646" y="245" font-size="18">请求</text>
<line x1="741" y1="307" x2="592" y2="307" stroke="#183d36" stroke-width="2" marker-end="url(#arrow)"/>
