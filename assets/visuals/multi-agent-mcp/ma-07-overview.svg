<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">一次调用的授权责任</title>
  <desc id="desc">用户许可经 host 限定委托，MCP 服务验证身份与适用的 audience，执行端检查动作、资源与确认。外部材料和 capabilities 仅提供输入或功能信息。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#315c52"/></marker></defs>
  <rect width="1120" height="660" rx="20" fill="#f5f3eb"/>
  <text x="40" y="62" font-family="sans-serif" font-size="32" font-weight="700" fill="#193c35">一次调用的授权责任</text>
  <text x="40" y="105" font-family="sans-serif" font-size="21" fill="#52665f">先识别 transport，再检查每一层的资源与动作许可</text>
  <g fill="#fffdf6" stroke="#9aafa4" stroke-width="2">
    <rect x="40" y="172" width="230" height="156" rx="14"/>
    <rect x="310" y="172" width="230" height="156" rx="14"/>
    <rect x="580" y="172" width="230" height="156" rx="14"/>
    <rect x="850" y="172" width="230" height="156" rx="14"/>
  </g>
  <g stroke="#315c52" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M270 250 H302"/>
    <path d="M540 250 H572"/>
    <path d="M810 250 H842"/>
    <path d="M965 328 V402"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#193c35">
    <text x="155" y="211" font-size="23" font-weight="700">用户许可</text>
    <text x="155" y="254" font-size="21">可申请的动作</text>
    <text x="155" y="293" font-size="19">read / export</text>
    <text x="425" y="211" font-size="23" font-weight="700">host</text>
    <text x="425" y="254" font-size="21">限定本次委托</text>
    <text x="425" y="293" font-size="19">worker：read</text>
    <text x="695" y="211" font-size="23" font-weight="700">MCP 服务</text>
    <text x="695" y="254" font-size="21">验证身份</text>
    <text x="695" y="293" font-size="18">HTTP：检查 audience</text>
    <text x="965" y="211" font-size="23" font-weight="700">执行端</text>
    <text x="965" y="254" font-size="21">动作与资源</text>
    <text x="965" y="293" font-size="21">具体确认</text>
  </g>
  <rect x="40" y="426" width="365" height="96" rx="14" fill="#e7ece2" stroke="#9aafa4" stroke-width="2"/>
  <rect x="455" y="426" width="335" height="96" rx="14" fill="#e7ece2" stroke="#9aafa4" stroke-width="2"/>
  <rect x="840" y="412" width="250" height="124" rx="14" fill="#244f45"/>
  <g fill="none" stroke="#6b8177" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)">
    <path d="M290 426 L400 337"/>
    <path d="M655 426 L695 337"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="222" y="465" font-size="22" fill="#193c35">工具描述与外部材料</text>
    <text x="222" y="499" font-size="19" fill="#52665f">仅提供待分析的输入</text>
    <text x="622" y="465" font-size="22" fill="#193c35">capabilities</text>
    <text x="622" y="499" font-size="19" fill="#52665f">仅表达协议功能支持</text>
    <text x="965" y="460" font-size="23" font-weight="700" fill="#ffffff">允许执行</text>
    <text x="965" y="501" font-size="23" fill="#ffffff">或拒绝</text>
  </g>
  <path d="M40 567 H1080" stroke="#c6d0c4" stroke-width="2"/>
  <text x="40" y="604" font-family="sans-serif" font-size="21" fill="#315c52">描述信息不能自行扩大授权；真实检查由 host、服务和执行端承担。</text>
</svg>
