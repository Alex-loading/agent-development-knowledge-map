<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">委托权限逐层求交</title>
  <desc id="desc">五组条件合计七项判断：身份与用户动作、委托动作、资源租户、HTTP audience 与 scope、export 的具体确认。全部必需条件满足才允许，任一失败则拒绝。stdio 的 HTTP audience 与 scope 项不适用。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#315c52"/></marker></defs>
  <rect width="1120" height="660" rx="20" fill="#f5f3eb"/>
  <text x="30" y="61" font-family="sans-serif" font-size="32" font-weight="700" fill="#193c35">委托权限逐层求交</text>
  <text x="30" y="104" font-family="sans-serif" font-size="20" fill="#52665f">示例：用户拥有 read/export，worker 只有 read；导出在委托层被拒绝</text>
  <g fill="#fffdf6" stroke="#9aafa4" stroke-width="2">
    <rect x="30" y="158" width="180" height="176" rx="14"/>
    <rect x="470" y="158" width="180" height="176" rx="14"/>
    <rect x="690" y="158" width="180" height="176" rx="14"/>
    <rect x="910" y="158" width="180" height="176" rx="14"/>
  </g>
  <rect x="250" y="158" width="180" height="176" rx="14" fill="#fae6d6" stroke="#ad642f" stroke-width="3"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#193c35">
    <text x="120" y="197" font-size="22" font-weight="700">身份与用户</text>
    <text x="120" y="237" font-size="19">身份有效</text>
    <text x="120" y="273" font-size="19">用户允许动作</text>
    <text x="120" y="309" font-size="18">read / export</text>
    <text x="340" y="197" font-size="22" font-weight="700">委托动作</text>
    <text x="340" y="242" font-size="19">worker 仅有 read</text>
    <text x="340" y="287" font-size="21" font-weight="700" fill="#934d26">export：拒绝</text>
    <text x="560" y="197" font-size="22" font-weight="700">资源归属</text>
    <text x="560" y="242" font-size="19">资源租户</text>
    <text x="560" y="278" font-size="19">符合允许范围</text>
    <text x="780" y="197" font-size="22" font-weight="700">HTTP 凭据</text>
    <text x="780" y="237" font-size="18">audience 正确</text>
    <text x="780" y="270" font-size="18">scope 包含动作</text>
    <text x="780" y="309" font-size="17" fill="#52665f">stdio：不适用</text>
    <text x="1000" y="197" font-size="22" font-weight="700">具体确认</text>
    <text x="1000" y="237" font-size="19">export 绑定</text>
    <text x="1000" y="273" font-size="19">当前资源</text>
    <text x="1000" y="309" font-size="19">与当前动作</text>
  </g>
  <g fill="none" stroke="#315c52" stroke-width="2.5">
    <path d="M120 334 V374 H1000 V334"/>
    <path d="M340 334 V374"/>
    <path d="M560 334 V413" marker-end="url(#arrow)"/>
    <path d="M780 334 V374"/>
  </g>
  <rect x="335" y="421" width="450" height="64" rx="14" fill="#244f45"/>
  <text x="560" y="462" font-family="sans-serif" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">全部必需条件求交</text>
  <g fill="none" stroke="#315c52" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M470 485 V509 H350 V529"/>
    <path d="M650 485 V509 H790 V529"/>
  </g>
  <rect x="190" y="537" width="320" height="68" rx="14" fill="#e0ebda" stroke="#7e9b7d" stroke-width="2"/>
  <rect x="610" y="537" width="360" height="68" rx="14" fill="#fae6d6" stroke="#ad642f" stroke-width="2"/>
  <text x="350" y="580" font-family="sans-serif" text-anchor="middle" font-size="22" fill="#193c35">全部满足：允许</text>
  <text x="790" y="580" font-family="sans-serif" text-anchor="middle" font-size="22" fill="#934d26">任一失败：拒绝并记录原因</text>
  <text x="560" y="639" font-family="sans-serif" text-anchor="middle" font-size="17" fill="#52665f">课程自拟策略计算，不包含 token 验签或真实 OAuth 流程</text>
</svg>
