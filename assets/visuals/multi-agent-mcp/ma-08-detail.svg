<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">同一 URI 的 private 缓存隔离</title>
  <desc id="desc">用户甲乙请求相同 URI。甲访问自己上下文的 private 缓存，乙需要按自己的上下文检查权限。禁止从甲缓存向乙跨上下文共享；TTL 只提示新鲜度，访问控制仍须执行。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#315c52"/></marker>
    <marker id="warn-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#ad642f"/></marker>
  </defs>
  <rect width="1120" height="660" rx="20" fill="#f5f3eb"/>
  <text x="40" y="61" font-family="sans-serif" font-size="32" font-weight="700" fill="#193c35">同一 URI 的 private 缓存隔离</text>
  <text x="40" y="104" font-family="sans-serif" font-size="21" fill="#52665f">相同 URI，且甲的缓存仍在 TTL 内：乙仍须使用自己的授权上下文</text>
  <rect x="50" y="166" width="300" height="88" rx="14" fill="#244f45"/>
  <rect x="770" y="166" width="300" height="88" rx="14" fill="#244f45"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="200" y="204" font-size="24" font-weight="700">用户甲</text>
    <text x="200" y="235" font-size="18">请求 resource URI</text>
    <text x="920" y="204" font-size="24" font-weight="700">用户乙</text>
    <text x="920" y="235" font-size="18">请求相同 resource URI</text>
  </g>
  <g fill="none" stroke="#315c52" stroke-width="3" marker-end="url(#arrow)">
    <path d="M200 254 V343"/>
    <path d="M920 254 V343"/>
    <path d="M920 447 V484"/>
  </g>
  <rect x="50" y="351" width="300" height="124" rx="14" fill="#e0ebda" stroke="#7e9b7d" stroke-width="2"/>
  <rect x="770" y="351" width="300" height="96" rx="14" fill="#fffdf6" stroke="#9aafa4" stroke-width="2"/>
  <rect x="770" y="492" width="300" height="68" rx="14" fill="#e0ebda" stroke="#7e9b7d" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#193c35">
    <text x="200" y="393" font-size="23" font-weight="700">甲的 private 缓存</text>
    <text x="200" y="436" font-size="21">仅用于授权上下文甲</text>
    <text x="920" y="390" font-size="23" font-weight="700">乙的授权上下文</text>
    <text x="920" y="426" font-size="21">独立检查访问权限</text>
    <text x="920" y="534" font-size="21">返回乙获准访问的内容</text>
  </g>
  <path d="M350 380 L752 242" fill="none" stroke="#ad642f" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#warn-arrow)"/>
  <rect x="402" y="280" width="298" height="58" rx="12" fill="#fae6d6" stroke="#ad642f" stroke-width="2"/>
  <text x="551" y="317" font-family="sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="#934d26">禁止跨上下文共享</text>
  <text x="404" y="405" font-family="sans-serif" font-size="20" fill="#52665f">TTL：只提示新鲜度</text>
  <text x="404" y="443" font-family="sans-serif" font-size="20" fill="#52665f">相关通知可使缓存失效</text>
  <path d="M50 588 H1070" stroke="#c6d0c4" stroke-width="2"/>
  <text x="50" y="627" font-family="sans-serif" font-size="21" fill="#315c52">每个原语的访问控制持续生效；缓存命中无法替代资源授权。</text>
</svg>
