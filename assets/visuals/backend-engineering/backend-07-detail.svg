<text x="205" y="220" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">HIGH CARDINALITY</text>
  </g>
<g data-node="trace" data-kind="channel">
    <rect x="850" y="175" width="250" height="58" rx="12" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/>
    <text x="975" y="201" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">TRACE</text>
<text x="975" y="220" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">per-request identity</text>
  </g>
<g data-node="job-id" data-kind="identity">
    <rect x="80" y="255" width="250" height="58" rx="12" fill="#183850" stroke="#7CCBDD" stroke-width="2"/>
    <text x="205" y="281" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">jobId → LOG</text>
<text x="205" y="300" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">HIGH CARDINALITY</text>
  </g>
<g data-node="log" data-kind="channel">
    <rect x="850" y="255" width="250" height="58" rx="12" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/>
    <text x="975" y="281" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">LOG</text>
<text x="975" y="300" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">structured fact</text>
  </g>
<g data-node="model-version" data-kind="version">
    <rect x="80" y="335" width="250" height="58" rx="12" fill="#443716" stroke="#F5CA72" stroke-width="2"/>
