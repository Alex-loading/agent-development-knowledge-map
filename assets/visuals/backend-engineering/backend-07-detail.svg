<text x="205" y="380" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">BOUNDED CARDINALITY</text>
  </g>
<g data-node="metric" data-kind="channel">
    <rect x="850" y="335" width="250" height="58" rx="12" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/>
    <text x="975" y="361" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">METRIC</text>
<text x="975" y="380" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">bounded enum</text>
  </g>
<g data-node="prompt-version" data-kind="version">
    <rect x="80" y="415" width="250" height="58" rx="12" fill="#443716" stroke="#F5CA72" stroke-width="2"/>
    <text x="205" y="441" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">prompt v12 → EVAL</text>
<text x="205" y="460" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">BOUNDED CARDINALITY</text>
  </g>
<g data-node="eval" data-kind="channel">
    <rect x="850" y="415" width="250" height="58" rx="12" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/>
    <text x="975" y="441" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">EVAL</text>
<text x="975" y="460" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">golden + online</text>
  </g></g>
  <g data-value="obs-ttft">
    <rect x="64" y="525" width="330" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="229" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">p95 TTFT 620 ms</text>
  </g>
<g data-value="obs-tokens">
    <rect x="410" y="525" width="330" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="575" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">tokens 3.4k</text>
  </g>
<g data-value="obs-score">
    <rect x="756" y="525" width="380" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="946" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">eval score 0.91</text>
  </g>
  <text x="64" y="610" data-region="caption" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#91AABA" text-anchor="start">版本用于关联回归，但指标维度必须有界。</text>
  <text x="1136" y="610" data-region="footer" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">OBSERVABILITY · bounded-cardinality</text>
</svg>