<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-07-detail-title visual-backend-07-detail-description">
  <title id="visual-backend-07-detail-title">关联身份与高基数边界</title>
  <desc id="visual-backend-07-detail-description">逐请求身份进入日志和 trace，受控版本维度进入 metric 与 evaluation。 图中状态、数值与边标签来自独立 fixture，用于验证关系而非声明生产默认值。</desc>
  <defs><marker id="visual-backend-07-detail-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/></marker></defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="94" data-region="title" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760" fill="#F5FBFF" text-anchor="start">关联身份与高基数边界</text>
  <text x="64" y="132" data-region="subtitle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#B8CBD8" text-anchor="start">逐请求身份进入 log/trace；受控版本才进入聚合 metric 与 evaluation。</text>
  <g data-kind="observability"><rect x="56" y="168" width="1088" height="72" rx="14" fill="#0F3044" stroke="#244A61" stroke-width="1"/>
<rect x="56" y="248" width="1088" height="72" rx="14" fill="#10283A" stroke="#244A61" stroke-width="1"/>
<rect x="56" y="328" width="1088" height="72" rx="14" fill="#0F3044" stroke="#244A61" stroke-width="1"/>
<rect x="56" y="408" width="1088" height="72" rx="14" fill="#10283A" stroke="#244A61" stroke-width="1"/><polyline data-edge="request-to-trace" data-from="request-id" data-to="trace" data-kind="flow" points="330,204 850,204" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-07-detail-arrow)"/>
<g data-edge-label="request-to-trace">
      <rect x="533" y="172" width="114" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="590" y="191" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">PER REQUEST</text>
    </g>
<polyline data-edge="job-to-log" data-from="job-id" data-to="log" data-kind="flow" points="330,284 850,284" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-07-detail-arrow)"/>
<g data-edge-label="job-to-log">
      <rect x="517.5" y="252" width="145" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="590" y="271" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">attempt + state</text>
    </g>
<polyline data-edge="model-to-metric" data-from="model-version" data-to="metric" data-kind="flow" points="330,364 850,364" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-07-detail-arrow)"/>
<g data-edge-label="model-to-metric">
      <rect x="548.5" y="332" width="83" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="590" y="351" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">BOUNDED</text>
    </g>
<polyline data-edge="prompt-to-eval" data-from="prompt-version" data-to="eval" data-kind="flow" points="330,444 850,444" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-07-detail-arrow)"/>
<g data-edge-label="prompt-to-eval">
      <rect x="528.5" y="412" width="123" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="590" y="431" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">quality join</text>
    </g><g data-node="request-id" data-kind="identity">
    <rect x="80" y="175" width="250" height="58" rx="12" fill="#183850" stroke="#7CCBDD" stroke-width="2"/>
