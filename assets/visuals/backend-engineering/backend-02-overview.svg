<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-02-overview-title visual-backend-02-overview-description">
  <title id="visual-backend-02-overview-title">Typed SSE 可恢复生命周期</title>
  <desc id="visual-backend-02-overview-description">同步、流式与异步路径共享状态机，断线、取消和恢复分别取证。 图中所有数值来自课程固定 fixture，用于说明关系与边界而非生产默认值。</desc>
  <defs><marker id="visual-backend-02-overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/></marker></defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="94" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760" fill="#F5FBFF" text-anchor="start">Typed SSE 的可恢复生命周期</text>
  <text x="64" y="132" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#B8CBD8" text-anchor="start">传输事件、断线信号与业务终态分别记录。</text>
  <g data-kind="timeline">
    
    <g data-node="card-1" data-kind="entry">
