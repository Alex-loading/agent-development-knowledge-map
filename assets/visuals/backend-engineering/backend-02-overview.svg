  </g>
<g data-node="card-5" data-kind="stage">
    <rect x="427" y="350" width="346" height="92" rx="18" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="600" y="402" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">CANCEL REQUEST</text>
  </g>
<g data-node="card-6" data-kind="outcome">
    <rect x="791" y="350" width="346" height="92" rx="18" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/>
    <text x="964" y="402" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">TERMINAL</text>
  </g>
    <g data-value="1">
