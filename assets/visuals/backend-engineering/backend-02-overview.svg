    <rect x="427" y="205" width="346" height="92" rx="18" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="600" y="257" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">DELTA #1</text>
  </g>
<g data-node="card-3" data-kind="stage">
    <rect x="791" y="205" width="346" height="92" rx="18" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="964" y="257" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">HEARTBEAT</text>
  </g>
<g data-node="card-4" data-kind="stage">
