<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-07-overview-title visual-backend-07-overview-description">
  <title id="visual-backend-07-overview-title">生命周期与可观测证据流</title>
  <desc id="visual-backend-07-overview-description">启动、接流、排空和停止由日志、trace、metric 与评测事件共同解释。 图中所有数值来自课程固定 fixture，用于说明关系与边界而非生产默认值。</desc>
  <defs><marker id="visual-backend-07-overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/></marker></defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="94" data-region="title" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760" fill="#F5FBFF" text-anchor="start">生命周期与可观测证据流</text>
  <text x="64" y="132" data-region="subtitle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#B8CBD8" text-anchor="start">接流、摘流、排空与停止的事实流向日志、trace、metric 和 eval。</text>
