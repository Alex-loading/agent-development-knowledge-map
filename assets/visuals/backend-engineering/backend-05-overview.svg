<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-05-overview-title visual-backend-05-overview-description">
  <title id="visual-backend-05-overview-title">权威存储与缓存层</title>
  <desc id="visual-backend-05-overview-description">PostgreSQL、对象存储、向量库与 Redis 按事实所有权分层。 图中所有数值来自课程固定 fixture，用于说明关系与边界而非生产默认值。</desc>
  <defs><marker id="visual-backend-05-overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/></marker></defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="94" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760" fill="#F5FBFF" text-anchor="start">权威存储与可重建加速层</text>
  <text x="64" y="132" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#B8CBD8" text-anchor="start">事务事实、对象、向量索引和缓存承担不同所有权。</text>
  <g data-kind="layers">
    
    <g data-node="card-1" data-kind="entry">
    <rect x="178" y="240" width="190" height="104" rx="18" fill="#173B55" stroke="#74D8F2" stroke-width="2"/>
    <text x="273" y="298" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">POSTGRESQL</text>
  </g>
<g data-node="card-2" data-kind="stage">
    <rect x="396" y="240" width="190" height="104" rx="18" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="491" y="298" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">OBJECT STORAGE</text>
  </g>
<g data-node="card-3" data-kind="stage">
    <rect x="614" y="240" width="190" height="104" rx="18" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="709" y="298" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">VECTOR STORE</text>
  </g>
<g data-node="card-4" data-kind="outcome">
    <rect x="832" y="240" width="190" height="104" rx="18" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/>
    <text x="927" y="298" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">REDIS</text>
  </g>
    <g data-value="1">
      <rect x="64" y="535" width="256" height="38" rx="19" fill="#102C40" stroke="#31556B"/>
      <text x="192" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#A7E8C2" text-anchor="middle">TENANT acme</text>
    </g>
<g data-value="2">
      <rect x="336" y="535" width="256" height="38" rx="19" fill="#102C40" stroke="#31556B"/>
      <text x="464" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#A7E8C2" text-anchor="middle">ACL v9</text>
    </g>
<g data-value="3">
      <rect x="608" y="535" width="256" height="38" rx="19" fill="#102C40" stroke="#31556B"/>
      <text x="736" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#A7E8C2" text-anchor="middle">CACHE v12</text>
    </g>
<g data-value="4">
