      <text x="1008" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#A7E8C2" text-anchor="middle">TTL 300 s</text>
    </g>
  </g>
  <text x="64" y="610" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#91AABA" text-anchor="start">缓存可以丢失，授权与业务真相不能丢失。</text>
  <text x="1136" y="610" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">LAYERS · authoritative-storage-cache-layers</text>
