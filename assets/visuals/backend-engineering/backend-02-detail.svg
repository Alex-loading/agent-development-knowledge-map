<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-02-detail-title visual-backend-02-detail-description">
  <title id="visual-backend-02-detail-title">Typed SSE 可恢复生命周期：决策与失败路径</title>
  <desc id="visual-backend-02-detail-description">同步、流式与异步路径共享状态机，断线、取消和恢复分别取证。 细化图把容易混淆的控制面、事实面和恢复动作拆开，帮助学习者在练习中逐项验证。</desc>
  <defs><marker id="visual-backend-02-detail-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/></marker></defs>
