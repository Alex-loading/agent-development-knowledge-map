<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-03-overview-title visual-backend-03-overview-description">
  <title id="visual-backend-03-overview-title">共享容量与 Deadline 包络</title>
  <desc id="visual-backend-03-overview-description">并发、队列、供应商限额、token 与重试共同消费有界容量。 图中所有数值来自课程固定 fixture，用于说明关系与边界而非生产默认值。</desc>
  <defs><marker id="visual-backend-03-overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/></marker></defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="94" data-region="title" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760" fill="#F5FBFF" text-anchor="start">共享容量与 Deadline 包络</text>
  <text x="64" y="132" data-region="subtitle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#B8CBD8" text-anchor="start">并发、队列、token、供应商限额和重试共同消费受限预算。</text>
  <g data-kind="envelope"><g data-region="deadline-envelope">
    <rect x="58" y="170" width="1084" height="305" rx="24" fill="none" stroke="#F5CA72" stroke-width="3"/>
  </g>
<g data-region="capacity-envelope">
    <rect x="78" y="205" width="1044" height="235" rx="24" fill="none" stroke="#31556B" stroke-width="2" stroke-dasharray="8 7"/>
  </g><polyline data-edge="admit-queue" data-from="admission" data-to="queue" data-kind="flow" points="270,323 360,323" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-03-overview-arrow)"/>
<g data-edge-label="admit-queue">
      <rect x="277.5" y="241" width="75" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="315" y="260" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">ACCEPT</text>
    </g>
<polyline data-edge="queue-provider" data-from="queue" data-to="provider" data-kind="flow" points="530,323 620,323" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-03-overview-arrow)"/>
<g data-edge-label="queue-provider">
      <rect x="509.5" y="241" width="131" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="575" y="260" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">WITHIN BUDGET</text>
    </g>
<polyline data-edge="admission-shed" data-from="admission" data-to="load-shed" data-kind="reject" points="185,361 185,440 965,440 965,361" fill="none" stroke="#F2A6B2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-03-overview-arrow)"/>
<g data-edge-label="admission-shed">
      <rect x="342.5" y="408" width="75" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="380" y="427" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#F2A6B2" text-anchor="middle">REJECT</text>
    </g>
<polyline data-edge="provider-retry" data-from="provider" data-to="admission" data-kind="retry" points="705,285 705,155 80,155 80,323 100,323" fill="none" stroke="#F5CA72" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-03-overview-arrow)"/>
<g data-edge-label="provider-retry">
      <rect x="410" y="159" width="180" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="500" y="178" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#F5CA72" text-anchor="middle">RETRY SHARES BUDGET</text>
    </g><g data-node="admission" data-kind="entry">
    <rect x="100" y="285" width="170" height="76" rx="16" fill="#173B55" stroke="#74D8F2" stroke-width="2"/>
    <text x="185" y="320" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">ADMISSION</text>
<text x="185" y="339" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">estimate work</text>
  </g>
<g data-node="queue" data-kind="queue">
    <rect x="360" y="285" width="170" height="76" rx="16" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="445" y="320" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">BOUNDED QUEUE</text>
<text x="445" y="339" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">age 1.1 s</text>
  </g>
<g data-node="provider" data-kind="service">
    <rect x="620" y="285" width="170" height="76" rx="16" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="705" y="320" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">PROVIDER</text>
<text x="705" y="339" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">rate limit</text>
  </g>
<g data-node="load-shed" data-kind="terminal">
    <rect x="880" y="285" width="170" height="76" rx="16" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/>
    <text x="965" y="320" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">LOAD SHED</text>
<text x="965" y="339" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">BUDGET EXHAUSTED</text>
  </g></g>
  <g data-value="concurrency">
    <rect x="64" y="525" width="250" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="189" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">CONCURRENCY 12 / 16</text>
  </g>
<g data-value="tokens">
    <rect x="330" y="525" width="250" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="455" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">TOKENS 64k / 80k</text>
  </g>
<g data-value="deadline">
    <rect x="596" y="525" width="250" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="721" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">DEADLINE 3.2 s</text>
  </g>
<g data-value="retry">
    <rect x="862" y="525" width="274" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="999" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">RETRY 1 / 2</text>
  </g>
  <text x="64" y="610" data-region="caption" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#91AABA" text-anchor="start">重试不创造容量，所有尝试共用一个预算。</text>
  <text x="1136" y="610" data-region="footer" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">ENVELOPE · shared-capacity</text>
</svg>