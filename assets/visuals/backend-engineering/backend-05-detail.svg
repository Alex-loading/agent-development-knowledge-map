<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-05-detail-title visual-backend-05-detail-description">
  <title id="visual-backend-05-detail-title">权威存储与缓存层：决策与失败路径</title>
  <desc id="visual-backend-05-detail-description">PostgreSQL、对象存储、向量库与 Redis 按事实所有权分层。 细化图把容易混淆的控制面、事实面和恢复动作拆开，帮助学习者在练习中逐项验证。</desc>
