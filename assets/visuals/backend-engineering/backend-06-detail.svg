<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-06-detail-title visual-backend-06-detail-description">
  <title id="visual-backend-06-detail-title">投递、未知结果与恢复动作</title>
  <desc id="visual-backend-06-detail-description">relay、consumer 与远端 effect 的故障点具有不同恢复动作，未知结果先查证再重试。 图中状态、数值与边标签来自独立 fixture，用于验证关系而非声明生产默认值。</desc>
  <defs><marker id="visual-backend-06-detail-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/></marker></defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="94" data-region="title" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760" fill="#F5FBFF" text-anchor="start">投递、未知结果与恢复动作</text>
  <text x="64" y="132" data-region="subtitle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#B8CBD8" text-anchor="start">relay、consumer 与远端 effect 的故障点不同，恢复先查询证据再重试。</text>
  <g data-kind="delivery"><polyline data-edge="relay" data-from="outbox" data-to="broker" data-kind="flow" points="240,223 340,223" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-06-detail-arrow)"/>
<g data-edge-label="relay">
      <rect x="257" y="151" width="66" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="290" y="170" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">relay</text>
    </g>
<polyline data-edge="redelivery" data-from="broker" data-to="consumer" data-kind="flow" points="510,223 610,223" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-06-detail-arrow)"/>
<g data-edge-label="redelivery">
      <rect x="509.5" y="151" width="101" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="560" y="170" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">messageId</text>
    </g>
<polyline data-edge="execute" data-from="consumer" data-to="effect" data-kind="flow" points="780,223 880,223" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-06-detail-arrow)"/>
<g data-edge-label="execute">
      <rect x="755.5" y="151" width="149" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="830" y="170" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">idempotency key</text>
    </g>
<polyline data-edge="effect-reconcile" data-from="effect" data-to="reconcile" data-kind="ambiguous" points="975,261 975,405" fill="none" stroke="#F2A6B2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-06-detail-arrow)"/>
<g data-edge-label="effect-reconcile">
      <rect x="989" y="319" width="162" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="1070" y="338" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#F2A6B2" text-anchor="middle">AMBIGUOUS · QUERY</text>
    </g>
<polyline data-edge="effect-retry" data-from="effect" data-to="consumer" data-kind="retry" points="920,261 920,350 695,350 695,261" fill="none" stroke="#F5CA72" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-06-detail-arrow)"/>
<g data-edge-label="effect-retry">
      <rect x="717" y="318" width="180" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="807" y="337" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#F5CA72" text-anchor="middle">RETRYABLE · BACKOFF</text>
    </g><g data-node="outbox" data-kind="record">
    <rect x="70" y="185" width="170" height="76" rx="14" fill="#183850" stroke="#7CCBDD" stroke-width="2"/>
    <circle cx="88" cy="203" r="11" fill="#0D2537" stroke="#57D6C7" stroke-width="1"/>
    <text x="155" y="219" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">OUTBOX</text>
    <text x="155" y="240" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">PERMANENT</text>
  </g>
<g data-node="broker" data-kind="transport">
    <rect x="340" y="185" width="170" height="76" rx="14" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <circle cx="358" cy="203" r="11" fill="#0D2537" stroke="#57D6C7" stroke-width="1"/>
    <text x="425" y="219" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">BROKER</text>
    <text x="425" y="240" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">at-least-once</text>
  </g>
<g data-node="consumer" data-kind="worker">
    <rect x="610" y="185" width="170" height="76" rx="14" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <circle cx="628" cy="203" r="11" fill="#0D2537" stroke="#57D6C7" stroke-width="1"/>
    <text x="695" y="219" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">CONSUMER</text>
    <text x="695" y="240" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">RECOVERED</text>
  </g>
<g data-node="effect" data-kind="external">
    <rect x="880" y="185" width="190" height="76" rx="14" fill="#553240" stroke="#F2A6B2" stroke-width="2"/>
    <circle cx="898" cy="203" r="11" fill="#0D2537" stroke="#57D6C7" stroke-width="1"/>
    <text x="975" y="219" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">REMOTE EFFECT</text>
    <text x="975" y="240" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">AMBIGUOUS → QUERY</text>
  </g>
<g data-node="reconcile" data-kind="outcome">
    <rect x="880" y="405" width="190" height="68" rx="14" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/>
    <circle cx="898" cy="423" r="11" fill="#0D2537" stroke="#57D6C7" stroke-width="1"/>
    <text x="975" y="439" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">RECONCILE</text>
    <text x="975" y="460" data-region="node-secondary" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="540" fill="#C1D4E0" text-anchor="middle">FAILED / STOP</text>
  </g></g>
  <g data-value="delivery-budget">
    <rect x="64" y="525" width="330" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="229" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">budget 1 / 2</text>
  </g>
<g data-value="delivery-hit">
    <rect x="410" y="525" width="330" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="575" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">dedupe hit</text>
  </g>
<g data-value="delivery-manual">
    <rect x="756" y="525" width="380" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="946" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">manual reconcile</text>
  </g>
  <text x="64" y="610" data-region="caption" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#91AABA" text-anchor="start">unknown outcome 先取证，exactly-once 是业务不变量。</text>
  <text x="1136" y="610" data-region="footer" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">DELIVERY · delivery-failure</text>
</svg>