<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-06-detail-title visual-backend-06-detail-description">
  <title id="visual-backend-06-detail-title">幂等投递与 Effect Ledger：决策与失败路径</title>
  <desc id="visual-backend-06-detail-description">至少一次投递通过 outbox、inbox、去重和副作用账本恢复。 细化图把容易混淆的控制面、事实面和恢复动作拆开，帮助学习者在练习中逐项验证。</desc>
  <defs><marker id="visual-backend-06-detail-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/></marker></defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="94" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760" fill="#F5FBFF" text-anchor="start">失败分类与恢复动作</text>
  <text x="64" y="132" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#B8CBD8" text-anchor="start">retryable、ambiguous 与 permanent 不能共用同一重试分支。</text>
  <g data-kind="matrix">
    
    <g data-node="card-1" data-kind="entry">
    <rect x="63" y="205" width="346" height="92" rx="18" fill="#173B55" stroke="#74D8F2" stroke-width="2"/>
    <text x="236" y="257" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">RETRYABLE</text>
  </g>
<g data-node="card-2" data-kind="stage">
    <rect x="427" y="205" width="346" height="92" rx="18" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="600" y="257" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">AMBIGUOUS</text>
  </g>
<g data-node="card-3" data-kind="stage">
    <rect x="791" y="205" width="346" height="92" rx="18" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="964" y="257" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">PERMANENT</text>
  </g>
<g data-node="card-4" data-kind="stage">
    <rect x="63" y="350" width="346" height="92" rx="18" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="236" y="402" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">BACKOFF</text>
  </g>
<g data-node="card-5" data-kind="stage">
    <rect x="427" y="350" width="346" height="92" rx="18" fill="#24375F" stroke="#9FB7FF" stroke-width="2"/>
    <text x="600" y="402" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">QUERY</text>
  </g>
<g data-node="card-6" data-kind="outcome">
    <rect x="791" y="350" width="346" height="92" rx="18" fill="#174B4A" stroke="#8EECE1" stroke-width="2"/>
    <text x="964" y="402" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F5FBFF" text-anchor="middle">STOP</text>
  </g>
    <g data-value="1">
      <rect x="64" y="535" width="346" height="38" rx="19" fill="#102C40" stroke="#31556B"/>
      <text x="237" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#A7E8C2" text-anchor="middle">budget 1 / 2</text>
    </g>
<g data-value="2">
      <rect x="426" y="535" width="346" height="38" rx="19" fill="#102C40" stroke="#31556B"/>
      <text x="599" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#A7E8C2" text-anchor="middle">dedupe hit</text>
    </g>
<g data-value="3">
      <rect x="788" y="535" width="346" height="38" rx="19" fill="#102C40" stroke="#31556B"/>
      <text x="961" y="560" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#A7E8C2" text-anchor="middle">manual reconcile</text>
    </g>
  </g>
  <text x="64" y="610" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#91AABA" text-anchor="start">unknown outcome 先取证，exactly-once 是业务不变量。</text>
  <text x="1136" y="610" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">MATRIX · delivery-failure-recovery-matrix</text>
</svg>