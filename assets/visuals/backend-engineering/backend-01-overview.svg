<polyline data-edge="authorized-call" data-from="api" data-to="tools" data-kind="flow" points="368,370 832,370" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-01-overview-arrow)"/>
<g data-edge-label="authorized-call">
      <rect x="525.5" y="336" width="149" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
