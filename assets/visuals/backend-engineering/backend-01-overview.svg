<polyline data-edge="inference" data-from="api" data-to="provider" data-kind="flow" points="368,320 600,320" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-01-overview-arrow)"/>
