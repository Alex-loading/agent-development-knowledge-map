<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-01-overview-title visual-backend-01-overview-description">
  <title id="visual-backend-01-overview-title">AI API 五层责任边界</title>
  <desc id="visual-backend-01-overview-description">客户端、AI API、模型供应商、工具与存储之间的职责和可信证据边界。 图中所有数值来自课程固定 fixture，用于说明关系与边界而非生产默认值。</desc>
  <defs><marker id="visual-backend-01-overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/></marker></defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="94" data-region="title" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760" fill="#F5FBFF" text-anchor="start">AI API 的五层责任边界</text>
  <text x="64" y="132" data-region="subtitle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#B8CBD8" text-anchor="start">消息越过宿主边界时，身份、版本、能力与证据必须显式传递。</text>
  <g data-kind="sequence"><g data-node="client" data-kind="actor">
    <rect x="58" y="178" width="156" height="48" rx="12" fill="#173B55" stroke="#74D8F2" stroke-width="2"/>
    <text x="136" y="209" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">CLIENT</text>
    <line x1="136" y1="226" x2="136" y2="478" stroke="#31556B" stroke-width="2" stroke-dasharray="7 7"/>
  </g>
<g data-node="api" data-kind="actor">
    <rect x="290" y="178" width="156" height="48" rx="12" fill="#173B55" stroke="#74D8F2" stroke-width="2"/>
    <text x="368" y="209" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">AI API</text>
    <line x1="368" y1="226" x2="368" y2="478" stroke="#31556B" stroke-width="2" stroke-dasharray="7 7"/>
  </g>
<g data-node="provider" data-kind="actor">
    <rect x="522" y="178" width="156" height="48" rx="12" fill="#173B55" stroke="#74D8F2" stroke-width="2"/>
