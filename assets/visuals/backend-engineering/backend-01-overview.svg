    <line x1="1064" y1="226" x2="1064" y2="478" stroke="#31556B" stroke-width="2" stroke-dasharray="7 7"/>
  </g><polyline data-edge="request" data-from="client" data-to="api" data-kind="request" points="136,270 368,270" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-01-overview-arrow)"/>
<g data-edge-label="request">
