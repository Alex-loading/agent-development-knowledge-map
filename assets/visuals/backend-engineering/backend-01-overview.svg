      <text x="716" y="405" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">PERSIST EVIDENCE</text>
    </g></g>
  <g data-value="request-value">
    <rect x="64" y="525" width="250" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="189" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">requestId req_42</text>
  </g>
<g data-value="model-value">
    <rect x="330" y="525" width="250" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="455" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">model v7</text>
  </g>
<g data-value="prompt-value">
    <rect x="596" y="525" width="250" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="721" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">prompt v12</text>
  </g>
<g data-value="tool-schema-value">
    <rect x="862" y="525" width="274" height="40" rx="19" fill="#102C40" stroke="#31556B" stroke-width="1"/>
    <text x="999" y="551" data-region="value" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#A7E8C2" text-anchor="middle">tool schema v3</text>
  </g>
  <text x="64" y="610" data-region="caption" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#91AABA" text-anchor="start">API 契约必须绑定身份、版本、能力与执行证据。</text>
  <text x="1136" y="610" data-region="footer" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#66899D" text-anchor="end">SEQUENCE · client-api</text>
</svg>