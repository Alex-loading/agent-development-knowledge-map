  </g>
<g data-node="tools" data-kind="actor">
    <rect x="754" y="178" width="156" height="48" rx="12" fill="#173B55" stroke="#74D8F2" stroke-width="2"/>
    <text x="832" y="209" data-region="node-primary" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760" fill="#F5FBFF" text-anchor="middle">TOOLS</text>
    <line x1="832" y1="226" x2="832" y2="478" stroke="#31556B" stroke-width="2" stroke-dasharray="7 7"/>
  </g>
<g data-node="storage" data-kind="actor">
    <rect x="986" y="178" width="156" height="48" rx="12" fill="#173B55" stroke="#74D8F2" stroke-width="2"/>
