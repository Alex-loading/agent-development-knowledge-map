<polyline data-edge="provider-failover" data-from="provider" data-to="stateful-worker" data-kind="failover" points="825,270 825,155 590,155 590,270" fill="none" stroke="#F5CA72" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-08-detail-arrow)"/>
