    </g>
<polyline data-edge="worker-provider" data-from="stateful-worker" data-to="provider" data-kind="flow" points="685,311 740,311" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-08-detail-arrow)"/>
