<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-backend-08-detail-title visual-backend-08-detail-description">
  <title id="visual-backend-08-detail-title">无状态 API 与有状态 Worker 发布拓扑</title>
  <desc id="visual-backend-08-detail-description">API、队列、worker、provider 与区域数据边界独立扩缩，并沿同一证据链诊断。 图中状态、数值与边标签来自独立 fixture，用于验证关系而非声明生产默认值。</desc>
  <defs><marker id="visual-backend-08-detail-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57D6C7"/></marker></defs>
  <rect width="1200" height="675" fill="#081B2A"/>
  <rect x="36" y="36" width="1128" height="603" rx="28" fill="#0D2537" stroke="#244A61" stroke-width="2"/>
  <text x="64" y="94" data-region="title" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760" fill="#F5FBFF" text-anchor="start">无状态 API 与有状态 Worker 发布拓扑</text>
  <text x="64" y="132" data-region="subtitle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#B8CBD8" text-anchor="start">API、队列、worker、provider 与区域数据边界独立扩缩并沿证据链诊断。</text>
  <g data-kind="deployment"><rect data-region="stateless-zone" x="45" y="175" width="410" height="300" rx="22" fill="#0B2233" stroke="#31556B" stroke-width="2" stroke-dasharray="9 7"/>
<rect data-region="stateful-zone" x="475" y="175" width="680" height="300" rx="22" fill="#0B2233" stroke="#31556B" stroke-width="2" stroke-dasharray="9 7"/><polyline data-edge="api-enqueue" data-from="stateless-api" data-to="queue" data-kind="flow" points="225,311 280,311" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-08-detail-arrow)"/>
<g data-edge-label="api-enqueue">
      <rect x="197" y="224" width="110" height="28" rx="14" fill="#0C2638" stroke="#477083" stroke-width="1"/>
      <text x="252" y="243" data-region="edge-label" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="680" fill="#57D6C7" text-anchor="middle">202 / jobId</text>
    </g>
<polyline data-edge="queue-lease" data-from="queue" data-to="stateful-worker" data-kind="flow" points="440,311 495,311" fill="none" stroke="#57D6C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visual-backend-08-detail-arrow)"/>
