<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">从端到端失败向内找证据</title><desc id="desc">答案错误时，应该先换模型吗？ 局部指标用于定位，端到端结果用于验收；两者不能互相替代。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="44" y="47" fill="#a06a21" font-size="16" font-weight="700"><tspan x="44" y="47">AGENT LEARNER / EVALUATION LAB</tspan></text>
<text x="44" y="93" fill="#183d36" font-size="32" font-weight="700"><tspan x="44" y="93">从端到端失败向内找证据</tspan></text>
<rect x="44" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="62" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="62" y="228">01</tspan></text><text x="62" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="62" y="272">输入与环境</tspan></text><text x="62" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="62" y="335">任务可解吗</tspan></text><text x="62" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="62" y="381">版本与数据是否可用</tspan></text><path d="M 284 351 L 301 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="308" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="326" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="326" y="228">02</tspan></text><text x="326" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="326" y="272">检索与打包</tspan></text><text x="326" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="326" y="335">相关材料召回了吗</tspan></text><text x="326" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="326" y="381">送入模型的证据够吗</tspan></text><path d="M 548 351 L 565 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="572" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="590" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="590" y="228">03</tspan></text><text x="590" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="590" y="272">推理与行动</tspan></text><text x="590" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="590" y="335">陈述有证据吗</tspan></text><text x="590" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="590" y="381">动作符合约束吗</tspan></text><path d="M 812 351 L 829 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="836" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="854" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="854" y="228">04</tspan></text><text x="854" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="854" y="272">最终结果</tspan></text><text x="854" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="854" y="335">用户目标实现了吗</tspan></text><text x="854" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="854" y="381">失败回到具体环节</tspan></text>
<line x1="44" y1="574" x2="1076" y2="574" stroke="#a5afa2"/>
<text x="44" y="607" fill="#183d36" font-size="21" font-weight="400"><tspan x="44" y="607">局部指标用于定位，端到端结果用于验收；两者不能互相替代。</tspan></text>
</g></svg>
