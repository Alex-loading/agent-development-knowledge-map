<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">评测集有不同职责</title><desc id="desc">为什么开发集与封存评测集不能混用？ 集合划分、去重与访问规则先确定；每次改样例都留下新版本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="44" y="47" fill="#a06a21" font-size="16" font-weight="700"><tspan x="44" y="47">AGENT LEARNER / EVALUATION LAB</tspan></text>
<text x="44" y="93" fill="#183d36" font-size="32" font-weight="700"><tspan x="44" y="93">评测集有不同职责</tspan></text>
<rect x="44" y="157" width="1032" height="57" rx="8" fill="#183d36"/><text x="60" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="60" y="194">集合</tspan></text><text x="346" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="346" y="194">可做什么</tspan></text><text x="696" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="696" y="194">不能据此声称什么</tspan></text><rect x="44" y="222" width="1032" height="75" rx="6" fill="#e4ebe3"/><text x="60" y="251" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="251">开发样例</tspan></text><text x="346" y="251" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="251">调提示、调评分器</tspan></text><text x="696" y="251" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="251">不能证明未见样例泛化</tspan></text><rect x="44" y="303" width="1032" height="75" rx="6" fill="#ece4d6"/><text x="60" y="332" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="332">封存评测</tspan></text><text x="346" y="332" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="332">固定版本比较候选</tspan></text><text x="696" y="332" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="332">不能看完结果继续暗调</tspan></text><rect x="44" y="384" width="1032" height="75" rx="6" fill="#e4ebe3"/><text x="60" y="413" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="413">回归集合</tspan></text><text x="346" y="413" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="413">复现已经修复的失败</tspan></text><text x="696" y="413" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="413">不能覆盖所有新风险</tspan></text><rect x="44" y="465" width="1032" height="75" rx="6" fill="#ece4d6"/><text x="60" y="494" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="494">生产回流</tspan></text><text x="346" y="494" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="494">脱敏、复核、版本化再入库</tspan></text><text x="696" y="494" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="494">不能直接搬运私人正文</tspan></text>
<line x1="44" y1="574" x2="1076" y2="574" stroke="#a5afa2"/>
<text x="44" y="607" fill="#183d36" font-size="21" font-weight="400"><tspan x="44" y="607">集合划分、去重与访问规则先确定；每次改样例都留下新版本。</tspan></text>
</g></svg>
