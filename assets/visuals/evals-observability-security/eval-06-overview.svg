<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">外部内容不能跨越授权边界</title><desc id="desc">检索文档里的一条指令为何不能直接变成工具权限？ 模型被诱导与副作用获准是两个事件；下游不能把模型输出当成授权凭据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="44" y="47" fill="#a06a21" font-size="16" font-weight="700"><tspan x="44" y="47">AGENT LEARNER / EVALUATION LAB</tspan></text>
<text x="44" y="93" fill="#183d36" font-size="32" font-weight="700"><tspan x="44" y="93">外部内容不能跨越授权边界</tspan></text>
<rect x="44" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="62" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="62" y="228">01</tspan></text><text x="62" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="62" y="272">外部材料</tspan></text><text x="62" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="62" y="335">网页 / 文档 / 工具</tspan><tspan x="62" y="365.45">输出</tspan></text><text x="62" y="411" fill="#183d36" font-size="21" font-weight="400"><tspan x="62" y="411">可含攻击者指令</tspan></text><path d="M 284 351 L 301 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="308" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="326" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="326" y="228">02</tspan></text><text x="326" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="326" y="272">模型上下文</tspan></text><text x="326" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="326" y="335">材料作为数据处理</tspan></text><text x="326" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="326" y="381">动作只是候选提案</tspan></text><path d="M 548 351 L 565 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="572" y="195" width="240" height="300" rx="12" fill="#f1dfd3" stroke="#a5afa2"/><text x="590" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="590" y="228">03</tspan></text><text x="590" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="590" y="272">执行端策略</tspan></text><text x="590" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="590" y="335">校验身份与资源</tspan></text><text x="590" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="590" y="381">逐次检查权限和参数</tspan></text><path d="M 812 351 L 829 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="836" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="854" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="854" y="228">04</tspan></text><text x="854" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="854" y="272">受保护资源</tspan></text><text x="854" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="854" y="335">只执行允许的动作</tspan></text><text x="854" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="854" y="381">拒绝也留下审计证据</tspan></text><line x1="560" y1="145" x2="560" y2="540" stroke="#a44835" stroke-width="2" stroke-dasharray="8 6"/><text x="577" y="169" fill="#a44835" font-size="19" font-weight="700"><tspan x="577" y="169">独立授权检查</tspan></text>
<line x1="44" y1="574" x2="1076" y2="574" stroke="#a5afa2"/>
<text x="44" y="607" fill="#183d36" font-size="21" font-weight="400"><tspan x="44" y="607">模型被诱导与副作用获准是两个事件；下游不能把模型输出当成授权凭据。</tspan></text>
</g></svg>
