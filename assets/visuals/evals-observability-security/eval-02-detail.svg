<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">交换位置，检查裁判误差</title><desc id="desc">怎样检查裁判根据内容还是左侧位置选择答案？ 此表是教学流程；交换顺序用于检查位置影响，其他裁判误差仍需分别核验。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="44" y="47" fill="#a06a21" font-size="16" font-weight="700"><tspan x="44" y="47">AGENT LEARNER / EVALUATION LAB</tspan></text>
<text x="44" y="93" fill="#183d36" font-size="32" font-weight="700"><tspan x="44" y="93">交换位置，检查裁判误差</tspan></text>
<rect x="44" y="157" width="1032" height="57" rx="8" fill="#183d36"/><text x="60" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="60" y="194">一次比较</tspan></text><text x="346" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="346" y="194">左侧内容 / 右侧内容</tspan></text><text x="696" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="696" y="194">解释</tspan></text><rect x="44" y="222" width="1032" height="75" rx="6" fill="#e4ebe3"/><text x="60" y="251" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="251">第一次</tspan></text><text x="346" y="251" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="251">答案 A / 答案 B，选择 A</tspan></text><text x="696" y="251" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="251">先保留原始评分</tspan></text><rect x="44" y="303" width="1032" height="75" rx="6" fill="#ece4d6"/><text x="60" y="332" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="332">交换顺序</tspan></text><text x="346" y="332" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="332">答案 B / 答案 A，仍选择 A</tspan></text><text x="696" y="332" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="332">内容选择在此对样例一致</tspan></text><rect x="44" y="384" width="1032" height="75" rx="6" fill="#e4ebe3"/><text x="60" y="413" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="413">位置翻转</tspan></text><text x="346" y="413" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="413">答案 B / 答案 A，改选 B</tspan></text><text x="696" y="413" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="413">标记顺序敏感，复核</tspan></text><rect x="44" y="465" width="1032" height="75" rx="6" fill="#ece4d6"/><text x="60" y="494" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="494">证据不足</tspan></text><text x="346" y="494" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="494">两次都不充分</tspan></text><text x="696" y="494" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="494">允许未知，转人工核验</tspan></text>
<line x1="44" y1="574" x2="1076" y2="574" stroke="#a5afa2"/>
<text x="44" y="607" fill="#183d36" font-size="21" font-weight="400"><tspan x="44" y="607">此表是教学流程；交换顺序用于检查位置影响，其他裁判误差仍需分别核验。</tspan></text>
</g></svg>
