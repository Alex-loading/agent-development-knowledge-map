<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">把威胁写成可验证的边界</title><desc id="desc">怎样把“注意安全”改写成具体的测试条件？ 人工确认要绑定具体动作；确认不能覆盖执行端的硬性授权限制。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="44" y="47" fill="#a06a21" font-size="16" font-weight="700"><tspan x="44" y="47">AGENT LEARNER / EVALUATION LAB</tspan></text>
<text x="44" y="93" fill="#183d36" font-size="32" font-weight="700"><tspan x="44" y="93">把威胁写成可验证的边界</tspan></text>
<rect x="44" y="157" width="1032" height="57" rx="8" fill="#183d36"/><text x="60" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="60" y="194">边界</tspan></text><text x="346" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="346" y="194">可核验条件</tspan></text><text x="696" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="696" y="194">失败时的动作</tspan></text><rect x="44" y="222" width="1032" height="75" rx="6" fill="#e4ebe3"/><text x="60" y="251" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="251">输入来源</tspan></text><text x="346" y="251" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="251">文档内容不是用户授权</tspan></text><text x="696" y="251" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="251">保留来源，不提升权限</tspan></text><rect x="44" y="303" width="1032" height="75" rx="6" fill="#ece4d6"/><text x="60" y="332" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="332">工具入口</tspan></text><text x="346" y="332" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="332">允许工具 + 参数 schema</tspan></text><text x="696" y="332" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="332">无效提案不执行</tspan></text><rect x="44" y="384" width="1032" height="75" rx="6" fill="#e4ebe3"/><text x="60" y="413" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="413">资源读取</tspan></text><text x="346" y="413" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="413">当前身份具有读取权</tspan></text><text x="696" y="413" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="413">拒绝跨租户读取</tspan></text><rect x="44" y="465" width="1032" height="75" rx="6" fill="#ece4d6"/><text x="60" y="494" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="494">外发 / 变更</tspan></text><text x="346" y="494" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="494">授权范围内的具体确认</tspan></text><text x="696" y="494" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="494">缺条件则拒绝或暂停</tspan></text>
<line x1="44" y1="574" x2="1076" y2="574" stroke="#a5afa2"/>
<text x="44" y="607" fill="#183d36" font-size="21" font-weight="400"><tspan x="44" y="607">人工确认要绑定具体动作；确认不能覆盖执行端的硬性授权限制。</tspan></text>
</g></svg>
