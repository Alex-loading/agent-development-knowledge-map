<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">任务成功需要三类证据</title><desc id="desc">回答声称完成，为什么还需要环境与约束证据？ 结果正确只是部分证据；约束违反不能被漂亮的回答抵消。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="44" y="47" fill="#a06a21" font-size="16" font-weight="700"><tspan x="44" y="47">AGENT LEARNER / EVALUATION LAB</tspan></text>
<text x="44" y="93" fill="#183d36" font-size="32" font-weight="700"><tspan x="44" y="93">任务成功需要三类证据</tspan></text>
<rect x="44" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="62" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="62" y="228">01</tspan></text><text x="62" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="62" y="272">任务定义</tspan></text><text x="62" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="62" y="335">输入与初始环境</tspan></text><text x="62" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="62" y="381">预期结果与禁止行为</tspan></text><path d="M 284 351 L 301 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="308" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="326" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="326" y="228">02</tspan></text><text x="326" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="326" y="272">执行记录</tspan></text><text x="326" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="326" y="335">工具参数与观察</tspan></text><text x="326" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="326" y="381">保留版本和失败原因</tspan></text><path d="M 548 351 L 565 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="572" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="590" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="590" y="228">03</tspan></text><text x="590" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="590" y="272">结果与约束</tspan></text><text x="590" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="590" y="335">环境终态是否成立</tspan></text><text x="590" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="590" y="381">权限与策略是否满足</tspan></text><path d="M 812 351 L 829 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="836" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="854" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="854" y="228">04</tspan></text><text x="854" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="854" y="272">逐项判定</tspan></text><text x="854" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="854" y="335">成功 / 失败 / 未知</tspan></text><text x="854" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="854" y="381">不能只读最后一句话</tspan></text>
<line x1="44" y1="574" x2="1076" y2="574" stroke="#a5afa2"/>
<text x="44" y="607" fill="#183d36" font-size="21" font-weight="400"><tspan x="44" y="607">结果正确只是部分证据；约束违反不能被漂亮的回答抵消。</tspan></text>
</g></svg>
