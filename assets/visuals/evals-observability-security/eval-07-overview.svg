<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">安全测试同时看两类样本</title><desc id="desc">如果拒绝所有请求，为什么仍不能算好系统？ 同时保留攻击集和正常对照，分开报告漏防、误拒和实际后果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="44" y="47" fill="#a06a21" font-size="16" font-weight="700"><tspan x="44" y="47">AGENT LEARNER / EVALUATION LAB</tspan></text>
<text x="44" y="93" fill="#183d36" font-size="32" font-weight="700"><tspan x="44" y="93">安全测试同时看两类样本</tspan></text>
<rect x="44" y="157" width="1032" height="57" rx="8" fill="#183d36"/><text x="60" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="60" y="194">真实类型</tspan></text><text x="346" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="346" y="194">被防护拦截</tspan></text><text x="696" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="696" y="194">未被防护拦截</tspan></text><rect x="44" y="222" width="1032" height="75" rx="6" fill="#e4ebe3"/><text x="60" y="251" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="251">恶意请求</tspan></text><text x="346" y="251" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="251">命中；继续核对副作用</tspan></text><text x="696" y="251" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="251">漏报；执行端仍需约束</tspan></text><rect x="44" y="303" width="1032" height="75" rx="6" fill="#ece4d6"/><text x="60" y="332" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="332">正常请求</tspan></text><text x="346" y="332" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="332">误拒；正常能力受损</tspan></text><text x="696" y="332" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="332">正常放行；验证任务质量</tspan></text><rect x="44" y="384" width="1032" height="75" rx="6" fill="#e4ebe3"/><text x="60" y="413" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="413">评分目标</tspan></text><text x="346" y="413" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="413">不只看“我拒绝”的文字</tspan></text><text x="696" y="413" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="413">检查环境是否发生越权</tspan></text>
<line x1="44" y1="574" x2="1076" y2="574" stroke="#a5afa2"/>
<text x="44" y="607" fill="#183d36" font-size="21" font-weight="400"><tspan x="44" y="607">同时保留攻击集和正常对照，分开报告漏防、误拒和实际后果。</tspan></text>
</g></svg>
