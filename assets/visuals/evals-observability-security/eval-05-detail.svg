<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">留下的样本改变了分母</title><desc id="desc">只保留错误后，100% 错误率说明了什么？ 错误优先样本适合故障诊断；样本错误率不能直接当成总体错误率。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="44" y="47" fill="#a06a21" font-size="16" font-weight="700"><tspan x="44" y="47">AGENT LEARNER / EVALUATION LAB</tspan></text>
<text x="44" y="93" fill="#183d36" font-size="32" font-weight="700"><tspan x="44" y="93">留下的样本改变了分母</tspan></text>
<rect x="44" y="157" width="1032" height="57" rx="8" fill="#183d36"/><text x="60" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="60" y="194">固定教学选择</tspan></text><text x="346" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="346" y="194">保留数 / 总数</tspan></text><text x="696" y="194" fill="#f7f1e5" font-size="22" font-weight="700"><tspan x="696" y="194">保留样本错误率</tspan></text><rect x="44" y="222" width="1032" height="75" rx="6" fill="#e4ebe3"/><text x="60" y="251" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="251">全部保留</tspan></text><text x="346" y="251" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="251">6 / 6</tspan></text><text x="696" y="251" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="251">33.3%</tspan></text><rect x="44" y="303" width="1032" height="75" rx="6" fill="#ece4d6"/><text x="60" y="332" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="332">头部选择第1、4条</tspan></text><text x="346" y="332" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="332">2 / 6</tspan></text><text x="696" y="332" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="332">0.0%</tspan></text><rect x="44" y="384" width="1032" height="75" rx="6" fill="#e4ebe3"/><text x="60" y="413" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="413">只保留错误</tspan></text><text x="346" y="413" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="413">2 / 6</tspan></text><text x="696" y="413" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="413">100.0%</tspan></text><rect x="44" y="465" width="1032" height="75" rx="6" fill="#ece4d6"/><text x="60" y="494" fill="#183d36" font-size="21" font-weight="700"><tspan x="60" y="494">完整教学总体</tspan></text><text x="346" y="494" fill="#183d36" font-size="21" font-weight="400"><tspan x="346" y="494">2 个错误 / 6 条 trace</tspan></text><text x="696" y="494" fill="#183d36" font-size="21" font-weight="400"><tspan x="696" y="494">33.3%（已知集合）</tspan></text>
<line x1="44" y1="574" x2="1076" y2="574" stroke="#a5afa2"/>
<text x="44" y="607" fill="#183d36" font-size="21" font-weight="400"><tspan x="44" y="607">错误优先样本适合故障诊断；样本错误率不能直接当成总体错误率。</tspan></text>
</g></svg>
