<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">从配对样本走到门槛判断</title><desc id="desc">比较新版本时，哪些信息不能混成一个总分？ 发布门槛是预先写下的决策规则；小样本成功不构成普适可靠性证明。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#183d36"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f1e5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="44" y="47" fill="#a06a21" font-size="16" font-weight="700"><tspan x="44" y="47">AGENT LEARNER / EVALUATION LAB</tspan></text>
<text x="44" y="93" fill="#183d36" font-size="32" font-weight="700"><tspan x="44" y="93">从配对样本走到门槛判断</tspan></text>
<rect x="44" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="62" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="62" y="228">01</tspan></text><text x="62" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="62" y="272">冻结比较条件</tspan></text><text x="62" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="62" y="335">同一批案例与切片</tspan></text><text x="62" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="62" y="381">相同评分器版本</tspan></text><path d="M 284 351 L 301 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="308" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="326" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="326" y="228">02</tspan></text><text x="326" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="326" y="272">同时看分组</tspan></text><text x="326" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="326" y="335">总体和每个切片</tspan></text><text x="326" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="326" y="381">保留分子与分母</tspan></text><path d="M 548 351 L 565 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="572" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="590" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="590" y="228">03</tspan></text><text x="590" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="590" y="272">检查证据量</tspan></text><text x="590" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="590" y="335">重复试验与未知</tspan></text><text x="590" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="590" y="381">小样本暂缓结论</tspan></text><path d="M 812 351 L 829 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="836" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="854" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="854" y="228">04</tspan></text><text x="854" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="854" y="272">约束优先</tspan></text><text x="854" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="854" y="335">关键失败先阻止</tspan></text><text x="854" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="854" y="381">通过仅代表当前规则</tspan></text>
<line x1="44" y1="574" x2="1076" y2="574" stroke="#a5afa2"/>
<text x="44" y="607" fill="#183d36" font-size="21" font-weight="400"><tspan x="44" y="607">发布门槛是预先写下的决策规则；小样本成功不构成普适可靠性证明。</tspan></text>
</g></svg>
