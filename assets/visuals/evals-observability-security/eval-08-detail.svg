<text x="44" y="93" fill="#183d36" font-size="32" font-weight="700"><tspan x="44" y="93">让事故变成可复验的改进</tspan></text>
<rect x="44" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="62" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="62" y="228">01</tspan></text><text x="62" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="62" y="272">限制影响</tspan></text><text x="62" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="62" y="335">停止相关动作</tspan></text><text x="62" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="62" y="381">保全必要诊断证据</tspan></text><path d="M 284 351 L 301 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="308" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="326" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="326" y="228">02</tspan></text><text x="326" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="326" y="272">还原时间线</tspan></text><text x="326" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="326" y="335">影响 / 触发 / 缺口</tspan></text><text x="326" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="326" y="381">区分事实与推断</tspan></text><path d="M 548 351 L 565 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="572" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="590" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="590" y="228">03</tspan></text><text x="590" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="590" y="272">完成修复</tspan></text><text x="590" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="590" y="335">负责人和验证条件</tspan></text><text x="590" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="590" y="381">加入正反回归样例</tspan></text><path d="M 812 351 L 829 351" fill="none" stroke="#183d36" stroke-width="3" marker-end="url(#arrow)"/><rect x="836" y="195" width="240" height="300" rx="12" fill="#e4ebe3" stroke="#a5afa2"/><text x="854" y="228" fill="#a06a21" font-size="19" font-weight="700"><tspan x="854" y="228">04</tspan></text><text x="854" y="272" fill="#183d36" font-size="25" font-weight="700"><tspan x="854" y="272">再次验收</tspan></text><text x="854" y="335" fill="#183d36" font-size="21" font-weight="400"><tspan x="854" y="335">重跑评测与安全测试</tspan></text><text x="854" y="381" fill="#183d36" font-size="21" font-weight="400"><tspan x="854" y="381">更新门槛和运行手册</tspan></text>
<line x1="44" y1="574" x2="1076" y2="574" stroke="#a5afa2"/>
<text x="44" y="607" fill="#183d36" font-size="21" font-weight="400"><tspan x="44" y="607">回滚实现不能撤销已发生的副作用；复盘完成以行动项验证为准。</tspan></text>
