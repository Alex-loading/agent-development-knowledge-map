<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Backpressure watermarks</title>
  <desc id="desc">Soft and hard queue watermarks trigger slowing, degradation, rejection and staged recovery.</desc>
  <rect width="1200" height="675" fill="#f7f5ef"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">BACKPRESSURE</text>
  <rect x="94" y="144" width="1012" height="238" rx="26" fill="#ffffff" stroke="#172554" stroke-width="3"/>
  <rect x="126" y="186" width="348" height="150" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <rect x="474" y="186" width="294" height="150" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
  <rect x="768" y="186" width="306" height="150" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <g font-family="Arial" text-anchor="middle" font-weight="700">
    <text x="300" y="250" font-size="20" fill="#166534">NORMAL</text>
    <text x="621" y="240" font-size="20" fill="#854d0e">SOFT 70</text>
    <text x="621" y="274" font-size="15" fill="#854d0e">SLOW · DEGRADE</text>
    <text x="921" y="240" font-size="20" fill="#991b1b">HARD 90</text>
    <text x="921" y="274" font-size="15" fill="#991b1b">REJECT</text>
  </g>
  <line x1="148" y1="318" x2="1044" y2="318" stroke="#172554" stroke-width="4"/>
  <polygon points="1026,306 1048,318 1026,330" fill="#172554"/>
  <text x="148" y="355" font-family="Arial" font-size="13" fill="#475569">0</text>
  <text x="474" y="355" font-family="Arial" font-size="13" text-anchor="middle" fill="#854d0e">70</text>
  <text x="768" y="355" font-family="Arial" font-size="13" text-anchor="middle" fill="#991b1b">90</text>
  <path d="M921 382 L921 462 L314 462" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="11 7"/>
  <polygon points="332,450 310,462 332,474" fill="#0f766e"/>
  <rect x="314" y="424" width="414" height="76" rx="20" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
  <text x="521" y="470" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle" fill="#115e59">STAGED RECOVERY</text>
  <g font-family="Arial" font-size="14" text-anchor="middle" fill="#475569">
    <text x="245" y="556">queue depth</text>
    <text x="480" y="556">oldest age</text>
    <text x="720" y="556">dependency load</text>
    <text x="955" y="556">tenant fairness</text>
  </g>
  <line x1="150" y1="526" x2="1050" y2="526" stroke="#cbd5e1" stroke-width="2"/>
</svg>
