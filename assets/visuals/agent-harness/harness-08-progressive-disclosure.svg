<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Progressive disclosure controls</title>
  <desc id="desc">A compact catalog expands into install, skill and hook contracts only when needed.</desc>
  <rect width="1200" height="675" fill="#f7f5ef"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">PROGRESSIVE DISCLOSURE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="56" y="236" width="206" height="108" rx="22" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="159" y="299" font-size="14" font-weight="700" fill="#312e81">COMPACT CATALOG</text>
    <rect x="310" y="236" width="188" height="108" rx="22" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="404" y="299" font-size="18" font-weight="700" fill="#115e59">Install.md</text>
    <rect x="546" y="210" width="216" height="160" rx="24" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/>
    <text x="654" y="280" font-size="18" font-weight="700" fill="#9a3412">SELECTED SKILL</text>
    <text x="654" y="317" font-size="14" fill="#7c2d12">instructions · resources</text>
    <rect x="810" y="236" width="188" height="108" rx="22" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>
    <text x="904" y="299" font-size="14" font-weight="700" fill="#854d0e">LIFECYCLE HOOK</text>
    <rect x="820" y="446" width="292" height="92" rx="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="966" y="503" font-size="14" font-weight="700" fill="#991b1b">APPROVAL CHECKPOINT</text>
  </g>
  <g stroke="#172554" stroke-width="4">
    <line x1="262" y1="290" x2="310" y2="290"/>
    <line x1="498" y1="290" x2="546" y2="290"/>
    <line x1="762" y1="290" x2="810" y2="290"/>
  </g>
  <path d="M904 344 L904 402 L966 446" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <rect x="96" y="438" width="614" height="100" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="403" y="478" font-family="Arial" font-size="15" text-anchor="middle" fill="#475569">unselected skills and detailed references remain unloaded</text>
  <text x="403" y="509" font-family="Arial" font-size="14" text-anchor="middle" fill="#64748b">deterministic hooks still enforce runtime boundaries</text>
</svg>
