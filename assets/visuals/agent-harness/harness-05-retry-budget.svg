<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Shared retry budget</title>
  <desc id="desc">Three retry layers converge on one owner and three bounded attempts.</desc>
  <rect width="1200" height="675" fill="#f7f5ef"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">RETRY BUDGET</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="62" y="146" width="230" height="74" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="177" y="190" font-size="15" fill="#312e81">client retry layer</text>
    <rect x="62" y="264" width="230" height="74" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="177" y="308" font-size="15" fill="#312e81">orchestrator layer</text>
    <rect x="62" y="382" width="230" height="74" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="177" y="426" font-size="15" fill="#312e81">adapter retry layer</text>
    <rect x="378" y="242" width="272" height="118" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
    <text x="514" y="307" font-size="15" font-weight="700" fill="#115e59">SHARED RETRY OWNER</text>
    <rect x="724" y="126" width="220" height="72" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="834" y="170" font-size="17" font-weight="700" fill="#166534">ATTEMPT 1</text>
    <rect x="724" y="240" width="220" height="72" rx="18" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>
    <text x="834" y="284" font-size="17" font-weight="700" fill="#854d0e">ATTEMPT 2</text>
    <rect x="724" y="354" width="220" height="72" rx="18" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="834" y="398" font-size="17" font-weight="700" fill="#9a3412">ATTEMPT 3</text>
    <rect x="724" y="490" width="220" height="72" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/>
    <text x="834" y="534" font-size="17" font-weight="700" fill="#991b1b">STOP GUARD</text>
  </g>
  <g stroke="#4338ca" stroke-width="3" stroke-dasharray="8 6" fill="none">
    <line x1="292" y1="183" x2="378" y2="276"/>
    <line x1="292" y1="301" x2="378" y2="301"/>
    <line x1="292" y1="419" x2="378" y2="326"/>
  </g>
  <line x1="650" y1="301" x2="724" y2="276" stroke="#172554" stroke-width="4"/>
  <path d="M834 198 L834 240 M834 312 L834 354 M834 426 L834 490" fill="none" stroke="#172554" stroke-width="3"/>
  <text x="1042" y="171" font-family="Arial" font-size="14" fill="#475569">delay 1</text>
  <text x="1042" y="285" font-family="Arial" font-size="14" fill="#475569">delay 2</text>
  <text x="1042" y="399" font-family="Arial" font-size="14" fill="#475569">delay 3</text>
</svg>
