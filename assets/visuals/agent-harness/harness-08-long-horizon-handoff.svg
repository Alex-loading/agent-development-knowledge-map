<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Long horizon context handoff</title>
  <desc id="desc">Active context offloads evidence and records a precise waiting or terminal state with an allowed next action.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">LONG-HORIZON HANDOFF</text>
  <rect x="62" y="132" width="286" height="184" rx="24" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
  <text x="205" y="198" font-family="Arial" font-size="19" font-weight="700" text-anchor="middle" fill="#312e81">ACTIVE CONTEXT</text>
  <text x="205" y="238" font-family="Arial" font-size="14" text-anchor="middle" fill="#475569">goal · summary · cursor</text>
  <rect x="62" y="376" width="286" height="184" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
  <text x="205" y="438" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle" fill="#115e59">OFFLOADED EVIDENCE</text>
  <text x="205" y="480" font-family="Arial" font-size="14" text-anchor="middle" fill="#475569">trace · output · artifact</text>
  <line x1="205" y1="316" x2="205" y2="376" stroke="#0f766e" stroke-width="4" stroke-dasharray="9 6"/>
  <polygon points="194,361 205,381 216,361" fill="#0f766e"/>
  <g font-family="Arial" text-anchor="middle" font-weight="700">
    <rect x="424" y="132" width="318" height="74" rx="18" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>
    <text x="583" y="177" font-size="16" fill="#854d0e">AWAITING APPROVAL</text>
    <rect x="424" y="234" width="318" height="74" rx="18" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="583" y="279" font-size="17" fill="#9a3412">BLOCKED</text>
    <rect x="424" y="336" width="318" height="74" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="583" y="381" font-size="17" fill="#991b1b">FAILED</text>
    <rect x="424" y="438" width="318" height="74" rx="18" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <text x="583" y="483" font-size="17" fill="#334155">CANCELLED</text>
    <rect x="824" y="226" width="310" height="190" rx="26" fill="#f0fdf4" stroke="#15803d" stroke-width="4"/>
    <text x="979" y="310" font-size="15" fill="#166534">ALLOWED NEXT ACTION</text>
    <text x="979" y="365" font-size="14" fill="#14532d">resume · supply · close</text>
  </g>
  <path d="M348 224 L390 224 L390 322 L424 322" fill="none" stroke="#172554" stroke-width="3"/>
  <g stroke="#172554" stroke-width="2">
    <line x1="742" y1="169" x2="824" y2="274"/>
    <line x1="742" y1="271" x2="824" y2="304"/>
    <line x1="742" y1="373" x2="824" y2="338"/>
    <line x1="742" y1="475" x2="824" y2="372"/>
  </g>
  <text x="600" y="612" font-family="Arial" font-size="14" text-anchor="middle" fill="#475569">reason code · evidence refs · recoverable condition · owner</text>
</svg>
