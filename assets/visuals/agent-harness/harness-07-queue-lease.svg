<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Queue lease lifecycle</title>
  <desc id="desc">A worker receives a visibility lease, checkpoints progress, persists completion and acknowledges, or is fenced on redelivery.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">QUEUE LEASE</text>
  <g font-family="Arial" text-anchor="middle" font-weight="700">
    <rect x="52" y="224" width="168" height="80" rx="20" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="136" y="272" font-size="17" fill="#312e81">RECEIVE</text>
    <rect x="258" y="208" width="206" height="112" rx="22" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="361" y="272" font-size="14" fill="#9a3412">VISIBILITY LEASE</text>
    <rect x="502" y="224" width="176" height="80" rx="20" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="590" y="272" font-size="17" fill="#115e59">CHECKPOINT</text>
    <rect x="716" y="208" width="206" height="112" rx="22" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <text x="819" y="272" font-size="15" fill="#166534">COMPLETE FACT</text>
    <rect x="960" y="224" width="168" height="80" rx="20" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="1044" y="272" font-size="17" fill="#166534">ACK</text>
    <rect x="330" y="430" width="220" height="82" rx="20" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>
    <text x="440" y="479" font-size="17" fill="#854d0e">REDELIVERY</text>
    <rect x="652" y="430" width="294" height="82" rx="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="799" y="479" font-size="16" fill="#991b1b">FENCE OLD WORKER</text>
  </g>
  <g stroke="#172554" stroke-width="4">
    <line x1="220" y1="264" x2="258" y2="264"/>
    <line x1="464" y1="264" x2="502" y2="264"/>
    <line x1="678" y1="264" x2="716" y2="264"/>
    <line x1="922" y1="264" x2="960" y2="264"/>
  </g>
  <path d="M361 320 L361 386 L440 430" fill="none" stroke="#a16207" stroke-width="3" stroke-dasharray="9 6"/>
  <line x1="550" y1="471" x2="652" y2="471" stroke="#b91c1c" stroke-width="3"/>
  <path d="M799 430 L799 358 L590 304" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="9 6"/>
  <rect x="178" y="552" width="844" height="62" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="589" font-family="Arial" font-size="14" text-anchor="middle" fill="#475569">completion fact precedes ack · expired lease permits a new fenced owner</text>
</svg>
