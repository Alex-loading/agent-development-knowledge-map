<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Continue and stop guard</title>
  <desc id="desc">A running state branches through a deterministic evidence guard.</desc>
  <rect width="1200" height="675" fill="#f7f5ef"/>
  <text x="64" y="80" font-family="Arial" font-size="30" font-weight="700" fill="#172554">CONTINUE OR STOP</text>
  <rect x="74" y="268" width="190" height="92" rx="46" fill="#e0e7ff" stroke="#4338ca" stroke-width="4"/>
  <text x="169" y="322" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" fill="#312e81">RUNNING</text>
  <line x1="264" y1="314" x2="414" y2="314" stroke="#172554" stroke-width="4"/>
  <polygon points="397,302 419,314 397,326" fill="#172554"/>
  <polygon points="530,180 692,314 530,448 368,314" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
  <text x="530" y="278" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#115e59">EVIDENCE GUARD</text>
  <text x="530" y="311" font-family="Arial" font-size="14" text-anchor="middle" fill="#134e4a">goal, budget, approval</text>
  <text x="530" y="337" font-family="Arial" font-size="14" text-anchor="middle" fill="#134e4a">cancel, error, next action</text>
  <g font-family="Arial" font-size="17" font-weight="700" text-anchor="middle">
    <rect x="792" y="96" width="220" height="66" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="902" y="136" fill="#166534">CONTINUE</text>
    <rect x="792" y="190" width="220" height="66" rx="18" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>
    <text x="902" y="230" fill="#854d0e">WAIT</text>
    <rect x="792" y="284" width="220" height="66" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="902" y="324" fill="#991b1b">FAILED</text>
    <rect x="792" y="378" width="220" height="66" rx="18" fill="#d1fae5" stroke="#047857" stroke-width="3"/>
    <text x="902" y="418" fill="#065f46">COMPLETED</text>
    <rect x="792" y="472" width="220" height="66" rx="18" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <text x="902" y="512" fill="#334155">CANCELLED</text>
  </g>
  <g stroke="#172554" stroke-width="3" fill="none">
    <path d="M649 217 L792 129"/>
    <path d="M678 264 L792 223"/>
    <path d="M692 314 L792 317"/>
    <path d="M678 364 L792 411"/>
    <path d="M649 411 L792 505"/>
  </g>
  <text x="530" y="590" font-family="Arial" font-size="16" text-anchor="middle" fill="#475569">every branch emits reason, event and evidence reference</text>
</svg>
