<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Recovery evidence decision</title>
  <desc id="desc">A recovery lease and evidence checks produce five distinct actions.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">EVIDENCE DECISION</text>
  <rect x="424" y="112" width="352" height="76" rx="22" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
  <text x="600" y="158" font-family="Arial" font-size="19" font-weight="700" text-anchor="middle" fill="#312e81">ACQUIRE LEASE</text>
  <polygon points="600,222 760,330 600,438 440,330" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
  <text x="600" y="316" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle" fill="#115e59">READ LOCAL AND</text>
  <text x="600" y="342" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle" fill="#115e59">REMOTE EVIDENCE</text>
  <line x1="600" y1="188" x2="600" y2="222" stroke="#172554" stroke-width="4"/>
  <g font-family="Arial" text-anchor="middle" font-weight="700">
    <rect x="54" y="510" width="190" height="74" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="149" y="555" font-size="18" fill="#166534">SKIP</text>
    <rect x="280" y="510" width="190" height="74" rx="18" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>
    <text x="375" y="555" font-size="18" fill="#854d0e">RETRY</text>
    <rect x="506" y="510" width="190" height="74" rx="18" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="601" y="555" font-size="18" fill="#115e59">RECONCILE</text>
    <rect x="732" y="510" width="190" height="74" rx="18" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="827" y="555" font-size="18" fill="#9a3412">MANUAL</text>
    <rect x="958" y="510" width="190" height="74" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="1053" y="555" font-size="18" fill="#991b1b">FAIL</text>
  </g>
  <g stroke="#172554" stroke-width="3" fill="none">
    <path d="M492 392 L149 510"/>
    <path d="M544 425 L375 510"/>
    <path d="M600 438 L601 510"/>
    <path d="M656 425 L827 510"/>
    <path d="M708 392 L1053 510"/>
  </g>
  <text x="600" y="622" font-family="Arial" font-size="14" text-anchor="middle" fill="#475569">completion · query · idempotency · version · authority · budget</text>
</svg>
