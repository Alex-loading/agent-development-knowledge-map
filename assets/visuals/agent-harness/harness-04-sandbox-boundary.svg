<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sandbox capability boundary</title>
  <desc id="desc">Untrusted code crosses explicit capability gates into a restricted sandbox.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">SANDBOX BOUNDARY</text>
  <rect x="58" y="132" width="250" height="402" rx="24" fill="#fee2e2" stroke="#b91c1c" stroke-width="3" stroke-dasharray="11 7"/>
  <text x="183" y="210" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#991b1b">UNTRUSTED CODE</text>
  <path d="M116 280 L250 414 M250 280 L116 414" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <rect x="356" y="104" width="264" height="458" rx="24" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/>
  <text x="488" y="160" font-family="Arial" font-size="19" font-weight="700" text-anchor="middle" fill="#9a3412">CAPABILITY GATES</text>
  <g font-family="Arial" font-size="15" text-anchor="middle" fill="#7c2d12">
    <rect x="400" y="206" width="176" height="56" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <text x="488" y="240">FILES</text>
    <rect x="400" y="284" width="176" height="56" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <text x="488" y="318">PROCESS</text>
    <rect x="400" y="362" width="176" height="56" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <text x="488" y="396">NETWORK</text>
    <rect x="400" y="440" width="176" height="56" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <text x="488" y="474">secret and resource</text>
  </g>
  <rect x="674" y="104" width="456" height="458" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
  <text x="902" y="160" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#115e59">SANDBOX</text>
  <rect x="730" y="216" width="344" height="170" rx="20" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="902" y="274" font-family="Arial" font-size="16" text-anchor="middle" fill="#134e4a">scoped filesystem</text>
  <text x="902" y="307" font-family="Arial" font-size="16" text-anchor="middle" fill="#134e4a">bounded process tree</text>
  <text x="902" y="340" font-family="Arial" font-size="16" text-anchor="middle" fill="#134e4a">default-deny egress</text>
  <rect x="766" y="432" width="272" height="72" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="902" y="476" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#166534">EVIDENCE</text>
  <line x1="308" y1="333" x2="356" y2="333" stroke="#172554" stroke-width="4"/>
  <polygon points="341,322 361,333 341,344" fill="#172554"/>
  <line x1="620" y1="333" x2="674" y2="333" stroke="#172554" stroke-width="4"/>
  <polygon points="659,322 679,333 659,344" fill="#172554"/>
  <path d="M902 562 L902 610 L488 610 L488 562" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="9 6"/>
</svg>
