<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tool transcript identity chain</title>
  <desc id="desc">A three-stage transcript preserves run, attempt, step, session and call identity.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="40" y="34" width="1120" height="607" rx="28" fill="#ffffff" stroke="#172554" stroke-width="3"/>
  <text x="72" y="88" font-family="Arial" font-size="29" font-weight="700" fill="#172554">TOOL TRANSCRIPT</text>
  <g font-family="Arial" font-size="15" text-anchor="middle">
    <rect x="72" y="116" width="180" height="46" rx="23" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="162" y="145" fill="#312e81">RUN run-42</text>
    <rect x="266" y="116" width="180" height="46" rx="23" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="356" y="145" fill="#312e81">ATTEMPT 2</text>
    <rect x="460" y="116" width="180" height="46" rx="23" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="550" y="145" fill="#312e81">STEP 3</text>
    <rect x="654" y="116" width="206" height="46" rx="23" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="757" y="145" fill="#9a3412">SESSION sbx-7</text>
    <rect x="874" y="116" width="214" height="46" rx="23" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="981" y="145" fill="#166534">CALL call-9</text>
  </g>
  <g font-family="Arial" text-anchor="middle">
    <rect x="86" y="224" width="286" height="260" rx="22" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <circle cx="132" cy="270" r="23" fill="#4338ca"/>
    <text x="132" y="277" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="229" y="278" font-size="19" font-weight="700" fill="#312e81">PROPOSAL</text>
    <text x="229" y="334" font-size="16" fill="#172554">read_file path</text>
    <text x="229" y="371" font-size="14" fill="#475569">candidate only</text>
    <rect x="457" y="224" width="286" height="260" rx="22" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <circle cx="503" cy="270" r="23" fill="#c2410c"/>
    <text x="503" y="277" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="600" y="278" font-size="19" font-weight="700" fill="#9a3412">HOST EXECUTION</text>
    <text x="600" y="334" font-size="16" fill="#7c2d12">policy passed</text>
    <text x="600" y="371" font-size="14" fill="#7c2d12">session isolated</text>
    <rect x="828" y="224" width="286" height="260" rx="22" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <circle cx="874" cy="270" r="23" fill="#15803d"/>
    <text x="874" y="277" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <text x="971" y="278" font-size="19" font-weight="700" fill="#166534">OBSERVATION</text>
    <text x="971" y="334" font-size="16" fill="#14532d">result plus evidence</text>
    <text x="971" y="371" font-size="14" fill="#14532d">linked to call-9</text>
  </g>
  <line x1="372" y1="354" x2="457" y2="354" stroke="#172554" stroke-width="4"/>
  <polygon points="442,343 462,354 442,365" fill="#172554"/>
  <line x1="743" y1="354" x2="828" y2="354" stroke="#172554" stroke-width="4"/>
  <polygon points="813,343 833,354 813,365" fill="#172554"/>
  <text x="600" y="548" font-family="Arial" font-size="16" text-anchor="middle" fill="#475569">identity survives scheduling, isolation and result ordering</text>
</svg>
