<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Idempotent recovery identity</title>
  <desc id="desc">One business intent and stable key survive multiple execution attempts.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">IDEMPOTENT RECOVERY</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="64" y="252" width="210" height="96" rx="24" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="169" y="309" font-size="20" font-weight="700" fill="#312e81">ONE INTENT</text>
    <rect x="332" y="252" width="210" height="96" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="437" y="309" font-size="20" font-weight="700" fill="#115e59">STABLE KEY</text>
    <rect x="610" y="142" width="190" height="80" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="705" y="190" font-size="18" font-weight="700" fill="#9a3412">ATTEMPT A</text>
    <rect x="610" y="378" width="190" height="80" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="705" y="426" font-size="18" font-weight="700" fill="#9a3412">ATTEMPT B</text>
    <rect x="858" y="224" width="276" height="152" rx="26" fill="#f0fdf4" stroke="#15803d" stroke-width="4"/>
    <text x="996" y="309" font-size="17" font-weight="700" fill="#166534">REMOTE OPERATION</text>
    <rect x="438" y="510" width="324" height="76" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <text x="600" y="557" font-size="18" font-weight="700" fill="#334155">RECONCILE</text>
  </g>
  <line x1="274" y1="300" x2="332" y2="300" stroke="#172554" stroke-width="4"/>
  <path d="M542 280 L610 182 M542 320 L610 418" fill="none" stroke="#0f766e" stroke-width="4"/>
  <path d="M800 182 L858 270 M800 418 L858 330" fill="none" stroke="#c2410c" stroke-width="4"/>
  <path d="M996 376 L996 548 L762 548" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="10 7"/>
  <path d="M438 548 L437 348" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="951" y="612" font-family="Arial" font-size="14" text-anchor="end" fill="#475569">attempt changes · intent does not</text>
</svg>
