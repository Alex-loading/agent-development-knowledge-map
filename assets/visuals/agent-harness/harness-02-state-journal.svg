<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Event projection checkpoint layers</title>
  <desc id="desc">Immutable events feed a pure reducer, projection and checkpoint replay path.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="68" y="80" font-family="Arial" font-size="30" font-weight="700" fill="#172554">STATE JOURNAL</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="84" y="128" width="1032" height="116" rx="22" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="600" y="174" font-size="21" font-weight="700" fill="#312e81">IMMUTABLE EVENTS</text>
    <text x="600" y="207" font-size="15" fill="#475569">event 001 · event 002 · event 003 · event 004</text>
    <rect x="406" y="280" width="388" height="90" rx="20" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="600" y="335" font-size="20" font-weight="700" fill="#115e59">PURE REDUCER</text>
    <rect x="120" y="432" width="398" height="108" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <text x="319" y="480" font-size="20" font-weight="700" fill="#166534">PROJECTION</text>
    <text x="319" y="511" font-size="14" fill="#14532d">current readable state</text>
    <rect x="682" y="432" width="398" height="108" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="881" y="480" font-size="20" font-weight="700" fill="#9a3412">CHECKPOINT</text>
    <text x="881" y="511" font-size="14" fill="#7c2d12">cursor plus versions</text>
  </g>
  <line x1="600" y1="244" x2="600" y2="280" stroke="#172554" stroke-width="4"/>
  <polygon points="589,266 600,286 611,266" fill="#172554"/>
  <path d="M520 370 L319 432" fill="none" stroke="#172554" stroke-width="4"/>
  <path d="M680 370 L881 432" fill="none" stroke="#172554" stroke-width="4"/>
  <path d="M881 540 L881 593 L184 593 L184 244" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="10 7"/>
  <polygon points="173,259 184,239 195,259" fill="#c2410c"/>
  <text x="550" y="622" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle" fill="#9a3412">REPLAY</text>
</svg>
