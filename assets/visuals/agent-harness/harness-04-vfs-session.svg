    <rect x="948" y="418" width="202" height="96" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <text x="1049" y="474" font-size="14" font-weight="700" fill="#166534">VERIFIED ARTIFACT</text>
