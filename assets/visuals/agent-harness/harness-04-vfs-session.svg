    <text x="394" y="279" font-size="15" fill="#312e81">BASH</text>
    <text x="280" y="382" font-size="14" fill="#475569">root /run/a · quota · token A</text>
    <rect x="528" y="132" width="420" height="366" rx="26" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
    <text x="738" y="184" font-size="21" font-weight="700" fill="#115e59">SESSION B</text>
    <rect x="574" y="236" width="100" height="72" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="624" y="279" font-size="15" fill="#115e59">FILES</text>
    <rect x="688" y="236" width="100" height="72" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="738" y="279" font-size="15" fill="#115e59">GIT</text>
    <rect x="802" y="236" width="100" height="72" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="852" y="279" font-size="15" fill="#115e59">BASH</text>
