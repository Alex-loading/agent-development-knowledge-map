<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">VFS session isolation</title>
  <desc id="desc">Two sessions receive separate filesystem capabilities and verified artifact export.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">VFS SESSION ISOLATION</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="132" width="420" height="366" rx="26" fill="#eef2ff" stroke="#4338ca" stroke-width="4"/>
