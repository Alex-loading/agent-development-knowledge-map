  <line x1="490" y1="315" x2="528" y2="315" stroke="#b91c1c" stroke-width="5" stroke-dasharray="7 6"/>
  <path d="M502 291 L516 339 M516 291 L502 339" stroke="#b91c1c" stroke-width="4"/>
