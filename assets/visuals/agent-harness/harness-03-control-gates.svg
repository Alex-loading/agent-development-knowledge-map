<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Four control gates</title>
  <desc id="desc">A proposed tool call must pass four independent gates before execution.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="62" y="80" font-family="Arial" font-size="30" font-weight="700" fill="#172554">FOUR CONTROL GATES</text>
  <line x1="82" y1="300" x2="1114" y2="300" stroke="#172554" stroke-width="5"/>
  <g font-family="Arial" text-anchor="middle">
    <rect x="118" y="190" width="190" height="218" rx="24" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="213" y="270" font-size="18" font-weight="700" fill="#312e81">1 SCHEMA</text>
    <text x="213" y="329" font-size="14" fill="#475569">shape and types</text>
    <rect x="374" y="190" width="190" height="218" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="469" y="270" font-size="18" font-weight="700" fill="#115e59">2 AUTHORIZATION</text>
    <text x="469" y="329" font-size="14" fill="#475569">identity and resource</text>
    <rect x="630" y="190" width="190" height="218" rx="24" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="725" y="270" font-size="18" font-weight="700" fill="#9a3412">3 APPROVAL</text>
    <text x="725" y="329" font-size="14" fill="#475569">specific intent</text>
    <rect x="886" y="190" width="224" height="218" rx="24" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <text x="998" y="276" font-size="14" font-weight="700" fill="#166534">4 RUNTIME VALIDATION</text>
    <text x="998" y="329" font-size="14" fill="#475569">current facts</text>
  </g>
  <g font-family="Arial" text-anchor="middle" font-weight="700">
    <rect x="232" y="484" width="240" height="66" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="352" y="524" font-size="18" fill="#991b1b">REJECT</text>
    <rect x="828" y="484" width="240" height="66" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="948" y="524" font-size="18" fill="#166534">EXECUTE</text>
  </g>
  <g stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6">
    <line x1="213" y1="408" x2="304" y2="484"/>
    <line x1="469" y1="408" x2="400" y2="484"/>
    <line x1="725" y1="408" x2="448" y2="484"/>
  </g>
  <line x1="998" y1="408" x2="948" y2="484" stroke="#15803d" stroke-width="3"/>
</svg>
