<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tool governance lanes</title>
  <desc id="desc">Tool definition and model decision remain separate from host registry and policy execution.</desc>
  <rect width="1200" height="675" fill="#f7f5ef"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">TOOL GOVERNANCE</text>
  <rect x="64" y="120" width="1072" height="196" rx="24" fill="#eef2ff" stroke="#4338ca" stroke-width="3" stroke-dasharray="12 7"/>
  <text x="92" y="158" font-family="Arial" font-size="15" font-weight="700" fill="#4338ca">MODEL-FACING DISCOVERY</text>
  <rect x="112" y="194" width="262" height="78" rx="18" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <text x="243" y="241" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle" fill="#312e81">TOOL DEFINITION</text>
  <rect x="464" y="194" width="262" height="78" rx="18" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <text x="595" y="241" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle" fill="#312e81">MODEL DECISION</text>
  <rect x="64" y="354" width="1072" height="238" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
  <text x="92" y="393" font-family="Arial" font-size="15" font-weight="700" fill="#0f766e">HOST EXECUTION AUTHORITY</text>
  <g font-family="Arial" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="104" y="452" width="212" height="76" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="210" y="498" fill="#115e59">HOST REGISTRY</text>
    <rect x="354" y="452" width="180" height="76" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="444" y="498" fill="#115e59">POLICY</text>
    <rect x="572" y="452" width="180" height="76" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="662" y="498" fill="#115e59">ADAPTER</text>
    <rect x="790" y="452" width="254" height="76" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="917" y="498" fill="#166534">RESULT</text>
  </g>
  <line x1="374" y1="233" x2="464" y2="233" stroke="#4338ca" stroke-width="3"/>
  <polygon points="449,222 469,233 449,244" fill="#4338ca"/>
  <path d="M595 272 L595 330 L210 330 L210 452" fill="none" stroke="#172554" stroke-width="3"/>
  <polygon points="199,437 210,457 221,437" fill="#172554"/>
  <g stroke="#172554" stroke-width="3">
    <line x1="316" y1="490" x2="354" y2="490"/>
    <line x1="534" y1="490" x2="572" y2="490"/>
    <line x1="752" y1="490" x2="790" y2="490"/>
  </g>
</svg>
