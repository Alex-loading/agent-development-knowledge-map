<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Bounded open and closed loops</title>
  <desc id="desc">Both loop forms consume the same hierarchical run budget.</desc>
  <rect width="1200" height="675" fill="#f7f5ef"/>
  <text x="62" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#172554">BOUNDED RUN</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="74" y="158" width="300" height="160" rx="24" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="224" y="220" font-size="21" font-weight="700" fill="#312e81">OPEN LOOP</text>
    <text x="224" y="260" font-size="14" fill="#475569">planned sequence</text>
    <rect x="74" y="366" width="300" height="160" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="224" y="428" font-size="21" font-weight="700" fill="#115e59">CLOSED LOOP</text>
    <text x="224" y="468" font-size="14" fill="#475569">observe and adjust</text>
    <rect x="448" y="116" width="680" height="454" rx="28" fill="#ffffff" stroke="#172554" stroke-width="4"/>
    <text x="788" y="172" font-size="22" font-weight="700" fill="#172554">RUN BUDGET</text>
    <rect x="500" y="224" width="112" height="206" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="556" y="332" font-size="16" font-weight="700" fill="#991b1b">TIME</text>
    <rect x="626" y="224" width="112" height="206" rx="18" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="682" y="332" font-size="16" font-weight="700" fill="#9a3412">STEPS</text>
    <rect x="752" y="224" width="112" height="206" rx="18" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
    <text x="808" y="332" font-size="16" font-weight="700" fill="#854d0e">TOKENS</text>
    <rect x="878" y="224" width="112" height="206" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="934" y="332" font-size="16" font-weight="700" fill="#166534">COST</text>
    <rect x="1004" y="224" width="92" height="206" rx="18" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="1050" y="332" font-size="10" font-weight="700" fill="#312e81">SIDE EFFECTS</text>
    <rect x="572" y="474" width="432" height="62" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="788" y="512" font-size="16" font-weight="700" fill="#334155">validation · stop condition · evidence</text>
  </g>
  <line x1="374" y1="238" x2="448" y2="238" stroke="#4338ca" stroke-width="4"/>
  <polygon points="433,227 453,238 433,249" fill="#4338ca"/>
  <line x1="374" y1="446" x2="448" y2="446" stroke="#0f766e" stroke-width="4"/>
  <polygon points="433,435 453,446 433,457" fill="#0f766e"/>
</svg>
