<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Harness control system</title>
  <desc id="desc">Model proposal crosses the Harness control plane before sandbox execution and evidence return.</desc>
