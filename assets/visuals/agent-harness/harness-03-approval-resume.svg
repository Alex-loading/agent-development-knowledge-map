<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Approval pause and resume</title>
  <desc id="desc">A specific intent digest is persisted before approval and revalidated after reacquiring a lease.</desc>
  <rect width="1200" height="675" fill="#f7f5ef"/>
  <text x="62" y="80" font-family="Arial" font-size="30" font-weight="700" fill="#172554">APPROVAL RESUME</text>
  <g font-family="Arial" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="52" y="242" width="180" height="92" rx="20" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="142" y="294" font-size="14" fill="#312e81">NORMALIZE INTENT</text>
    <rect x="272" y="242" width="180" height="92" rx="20" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="362" y="294" font-size="14" fill="#312e81">PERSIST DIGEST</text>
    <rect x="492" y="220" width="196" height="136" rx="24" fill="#fef3c7" stroke="#a16207" stroke-width="4"/>
    <text x="590" y="294" font-size="15" fill="#854d0e">AWAIT APPROVAL</text>
    <rect x="728" y="242" width="180" height="92" rx="20" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="818" y="294" font-size="14" fill="#115e59">REACQUIRE LEASE</text>
    <polygon points="1014,208 1128,288 1014,368 900,288" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="1014" y="294" fill="#115e59">REVALIDATE</text>
    <rect x="904" y="472" width="220" height="76" rx="20" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="1014" y="518" fill="#166534">EXECUTE</text>
  </g>
  <g stroke="#172554" stroke-width="4">
    <line x1="232" y1="288" x2="272" y2="288"/>
    <line x1="452" y1="288" x2="492" y2="288"/>
    <line x1="688" y1="288" x2="728" y2="288" stroke-dasharray="9 7"/>
    <line x1="908" y1="288" x2="900" y2="288"/>
    <line x1="1014" y1="368" x2="1014" y2="472"/>
  </g>
  <path d="M944 352 L944 418 L590 418 L590 356" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="770" y="445" font-family="Arial" font-size="14" text-anchor="middle" fill="#991b1b">changed digest or authority creates a new request</text>
  <text x="370" y="520" font-family="Arial" font-size="15" text-anchor="middle" fill="#475569">pause releases worker, lock and short-lived credential</text>
</svg>
