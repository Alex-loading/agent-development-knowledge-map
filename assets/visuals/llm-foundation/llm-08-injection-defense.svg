<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Prompt Injection 沿系统路径扩散，纵深控制逐层截断</title>
<desc id="desc">直接和间接注入以虚线经过模型走向工具与数据影响；输入隔离、最小权限、参数校验、人工确认、日志响应五个模型外控制分别截断不同路径。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B766E"/></marker>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#49645E" stroke-width="3"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="675" fill="#F6F0E3"/>
<path d="M34 112 H1166" stroke="#18312D" stroke-width="2"/>
<text x="42" y="62" font-family="Avenir Next, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#18312D" text-anchor="start" >Prompt Injection 沿系统路径扩散，纵深控制逐层截断</text>
<rect x="35" y="150" width="190" height="78" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="direct-input"/><text x="130" y="183" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >直接注入</text><text x="130" y="217" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >用户请求</text><rect x="35" y="285" width="190" height="78" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="indirect-input"/><text x="130" y="318" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >间接注入</text><text x="130" y="352" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >文档或工具结果</text><rect x="335" y="218" width="180" height="92" rx="14" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="model"/><text x="425" y="258" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >模型被诱导</text><text x="425" y="292" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >提示不是强边界</text><rect x="665" y="150" width="205" height="84" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="tool-impact"/><text x="768" y="186" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >工具副作用</text><text x="768" y="220" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >写入或转账</text><rect x="665" y="295" width="205" height="84" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="data-impact"/><text x="768" y="331" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >数据影响</text><text x="768" y="365" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >泄露或跨租户</text><line x1="225" y1="189" x2="330" y2="245" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="attack-path" data-from="direct-input" data-to="model" data-edge="direct-input-model"/><line x1="225" y1="324" x2="330" y2="282" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="attack-path" data-from="indirect-input" data-to="model" data-edge="indirect-input-model"/><line x1="515" y1="250" x2="660" y2="192" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="attack-path" data-from="model" data-to="tool-impact" data-edge="model-tool-impact"/><line x1="515" y1="280" x2="660" y2="337" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="attack-path" data-from="model" data-to="data-impact" data-edge="model-data-impact"/><rect x="930" y="130" width="220" height="68" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="input-isolation"/><text x="1040" y="172" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >① 输入隔离</text><rect x="930" y="225" width="220" height="68" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="least-privilege"/><text x="1040" y="267" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >② 最小权限</text><rect x="930" y="320" width="220" height="68" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="parameter-validation"/><text x="1040" y="362" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >③ 参数校验</text><rect x="930" y="415" width="220" height="68" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="human-confirmation"/><text x="1040" y="457" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >④ 人工确认</text><rect x="930" y="510" width="220" height="68" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="logging-response"/><text x="1040" y="552" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >⑤ 日志响应</text><path d="M930 164 H900 V125 H260 V189 H225" fill="none" stroke="#0B766E" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="control-edge" data-from="input-isolation" data-to="direct-input" data-edge="input-isolation-direct-input"/><path d="M930 164 H900 V410 H260 V324 H225" fill="none" stroke="#0B766E" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="control-edge" data-from="input-isolation" data-to="indirect-input" data-edge="input-isolation-indirect-input"/><path d="M930 259 H910 V192 H870" fill="none" stroke="#0B766E" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="control-edge" data-from="least-privilege" data-to="tool-impact" data-edge="least-privilege-tool-impact"/><path d="M930 354 H900 V205 H870" fill="none" stroke="#0B766E" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="control-edge" data-from="parameter-validation" data-to="tool-impact" data-edge="parameter-validation-tool-impact"/><path d="M930 449 H890 V218 H870" fill="none" stroke="#0B766E" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="control-edge" data-from="human-confirmation" data-to="tool-impact" data-edge="human-confirmation-tool-impact"/><path d="M930 544 H880 V226 H870" fill="none" stroke="#0B766E" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="control-edge" data-from="logging-response" data-to="tool-impact" data-edge="logging-response-tool-impact"/><path d="M930 544 H875 V337 H870" fill="none" stroke="#0B766E" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="control-edge" data-from="logging-response" data-to="data-impact" data-edge="logging-response-data-impact"/><text x="575" y="145" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#0B766E" text-anchor="middle" >截断入口</text><text x="35" y="625" font-family="Avenir Next, PingFang SC, sans-serif" font-size="27" font-weight="800" fill="#18312D" text-anchor="start" >没有单一控制消除注入；五层模型外控制共同缩小可达影响。</text>
</svg>
