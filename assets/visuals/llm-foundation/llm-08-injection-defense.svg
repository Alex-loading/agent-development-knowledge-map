<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Injection 的预防屏障与影响后响应必须分开</title>
  <desc id="desc">直接和间接注入以红色虚线尝试经过模型到达工具与数据影响。输入隔离、最小权限、参数校验和人工确认用四个横跨红色路径的实体屏障表示预防。工具或数据影响发生后，箭头才进入日志检测，再进入遏制与控制反馈，不把日志响应冒充预防门。</desc>
  <defs>
    <marker id="attack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B94B42"/>
    </marker>
    <marker id="response-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0B766E"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#F7F1E3"/>
  <text x="42" y="62" font-family="Avenir Next, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#18312D">Prompt Injection：预防屏障在路径上，日志响应在影响后</text>
  <text x="42" y="103" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#49645E">红色虚线＝攻击尝试　实体栏杆＝预防阻断　绿色实线＝检测与遏制</text>
  <line x1="34" y1="118" x2="1166" y2="118" stroke="#18312D" stroke-width="2"/>

  <rect x="35" y="140" width="190" height="78" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="direct-input"/>
  <text x="130" y="172" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="middle">直接注入</text>
  <text x="130" y="205" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">用户请求</text>
  <rect x="35" y="292" width="190" height="78" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="indirect-input"/>
  <text x="130" y="324" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="middle">间接注入</text>
  <text x="130" y="357" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">文档或工具结果</text>
  <rect x="400" y="155" width="180" height="100" rx="14" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="model"/>
  <text x="490" y="195" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="middle">模型被诱导</text>
  <text x="490" y="228" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">提示不是强边界</text>
  <rect x="800" y="140" width="170" height="90" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="tool-impact"/>
  <text x="885" y="177" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="middle">工具影响</text>
  <text x="885" y="210" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">写入或转账</text>
  <rect x="800" y="295" width="170" height="90" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="data-impact"/>
  <text x="885" y="332" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="middle">数据影响</text>
  <text x="885" y="365" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">泄露或跨租户</text>

  <path d="M225 179 H395" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#attack-arrow)" data-region="attack-path" data-from="direct-input" data-to="model" data-edge="direct-input-model"/>
  <path d="M225 331 H330 V235 H395" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#attack-arrow)" data-region="attack-path" data-from="indirect-input" data-to="model" data-edge="indirect-input-model"/>
  <path d="M580 185 H795" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#attack-arrow)" data-region="attack-path" data-from="model" data-to="tool-impact" data-edge="model-tool-impact"/>
  <path d="M580 225 H665 V340 H795" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#attack-arrow)" data-region="attack-path" data-from="model" data-to="data-impact" data-edge="model-data-impact"/>

  <rect x="292" y="146" width="24" height="196" rx="8" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="prevention-barrier" data-node="input-isolation-barrier" data-token="input-isolation" data-kind="blocked"/>
  <line x1="282" y1="168" x2="326" y2="190" stroke="#18312D" stroke-width="4"/>
  <line x1="326" y1="168" x2="282" y2="190" stroke="#18312D" stroke-width="4"/>
  <line x1="282" y1="320" x2="326" y2="342" stroke="#18312D" stroke-width="4"/>
  <line x1="326" y1="320" x2="282" y2="342" stroke="#18312D" stroke-width="4"/>
  <text x="304" y="137" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#0B766E" text-anchor="middle">①</text>
  <rect x="618" y="150" width="24" height="70" rx="8" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="prevention-barrier" data-node="least-privilege-barrier" data-token="least-privilege" data-kind="blocked"/>
  <text x="630" y="142" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#0B766E" text-anchor="middle">②</text>
  <rect x="682" y="150" width="24" height="70" rx="8" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="prevention-barrier" data-node="parameter-validation-barrier" data-token="parameter-validation" data-kind="blocked"/>
  <text x="694" y="142" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#0B766E" text-anchor="middle">③</text>
  <rect x="746" y="150" width="24" height="70" rx="8" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="prevention-barrier" data-node="human-confirmation-barrier" data-token="human-confirmation" data-kind="blocked"/>
  <text x="758" y="142" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#0B766E" text-anchor="middle">④</text>
  <text x="610" y="270" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#0B766E">预防屏障：路径上显式阻断</text>

  <rect x="35" y="430" width="200" height="60" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="input-isolation"/>
  <text x="135" y="469" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">① 输入隔离</text>
  <rect x="250" y="430" width="200" height="60" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="least-privilege"/>
  <text x="350" y="469" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">② 最小权限</text>
  <rect x="465" y="430" width="200" height="60" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="parameter-validation"/>
  <text x="565" y="469" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">③ 参数校验</text>
  <rect x="680" y="430" width="200" height="60" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="human-confirmation"/>
  <text x="780" y="469" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">④ 人工确认</text>

  <rect x="930" y="430" width="220" height="68" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="logging-response"/>
  <text x="1040" y="458" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="middle">⑤ 日志检测</text>
  <text x="1040" y="488" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">影响发生后</text>
  <rect x="930" y="535" width="220" height="68" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="injection-node" data-node="containment-feedback"/>
  <text x="1040" y="563" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="middle">遏制与反馈</text>
  <text x="1040" y="593" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">收紧控制</text>

  <path d="M970 185 H990 V425" fill="none" stroke="#0B766E" stroke-width="3" marker-end="url(#response-arrow)" data-region="detection-edge" data-from="tool-impact" data-to="logging-response" data-edge="tool-impact-logging-response"/>
  <path d="M970 340 H1010 V425" fill="none" stroke="#0B766E" stroke-width="3" marker-end="url(#response-arrow)" data-region="detection-edge" data-from="data-impact" data-to="logging-response" data-edge="data-impact-logging-response"/>
  <line x1="1040" y1="498" x2="1040" y2="530" stroke="#0B766E" stroke-width="3" marker-end="url(#response-arrow)" data-region="response-edge" data-from="logging-response" data-to="containment-feedback" data-edge="logging-response-containment-feedback"/>
  <path d="M930 569 H900 V625 H135 V495" fill="none" stroke="#0B766E" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#response-arrow)" data-region="response-edge" data-from="containment-feedback" data-to="input-isolation" data-edge="containment-feedback-input-isolation"/>
  <text x="480" y="610" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#0B766E">影响后：检测 → 遏制 → 反馈</text>
</svg>
