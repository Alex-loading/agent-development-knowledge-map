  <polyline points="484,218 544,266 604,298 664,322 724,336" fill="none" stroke="#a16207" stroke-width="5" stroke-dasharray="12 8"/>
  <rect x="478" y="212" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="538" y="260" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="598" y="292" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="658" y="316" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="718" y="330" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
  <text x="450" y="398" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#1e3a8a">train 0.90 / 0.70</text>
  <text x="450" y="430" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#1e3a8a">0.55 / 0.45 / 0.38</text>
  <text x="450" y="462" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">validation 0.95 / 0.75</text>
  <text x="450" y="494" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">0.60 / 0.50 / 0.44</text>

  <rect x="806" y="126" width="348" height="386" rx="22" fill="#ffffff" stroke="#a16207" stroke-width="5"/>
  <text x="830" y="168" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#78350f">③ 过拟合 · 分叉</text>
  <line x1="844" y1="374" x2="1120" y2="374" stroke="#64748b" stroke-width="3"/>
  <line x1="844" y1="206" x2="844" y2="374" stroke="#64748b" stroke-width="3"/>
  <polyline points="864,232 924,296 984,334 1044,352 1104,366" fill="none" stroke="#2563eb" stroke-width="5"/>
