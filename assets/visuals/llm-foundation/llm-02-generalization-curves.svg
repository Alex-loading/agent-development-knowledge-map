  <polyline points="864,216 924,276 984,316 1044,310 1104,282" fill="none" stroke="#a16207" stroke-width="5" stroke-dasharray="12 8"/>
  <rect x="858" y="210" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="918" y="270" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="978" y="310" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="1038" y="304" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="1098" y="276" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
  <line x1="984" y1="190" x2="984" y2="374" stroke="#be185d" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="830" y="398" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#1e3a8a">train 0.90 / 0.60</text>
  <text x="830" y="430" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#1e3a8a">0.40 / 0.30 / 0.20</text>
  <text x="830" y="462" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">validation 1.00 / 0.70</text>
  <text x="830" y="494" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">0.50 / 0.52 / 0.65</text>

  <rect x="46" y="530" width="1108" height="112" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="70" y="568" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#78350f">validation 最小点：最佳 epoch 3 · 分叉始于 epoch 4</text>
  <text x="70" y="614" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#334155">④ 查泄漏 → ⑤ 业务切片 → ⑥ 部署监控</text>
  <line x1="760" y1="600" x2="1110" y2="600" stroke="#1d4ed8" stroke-width="5" marker-end="url(#evidence-arrow)"/>
  <text x="800" y="636" font-family="system-ui, sans-serif" font-size="26" fill="#475569">训练损失不是发布许可</text>
</svg>
