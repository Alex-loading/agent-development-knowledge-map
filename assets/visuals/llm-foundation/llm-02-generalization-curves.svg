<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="generalization-title generalization-desc">
  <title id="generalization-title">训练与验证曲线的三种诊断组合</title>
  <desc id="generalization-desc">教学示例，非实测。epoch 1、2、3、4、5。第一组 train 为 0.95、0.90、0.86、0.83、0.81，validation 为 1.00、0.96、0.92、0.90、0.89；训练与验证损失在教学示例中仍高，只提示疑似欠拟合，需对照任务基线与可接受阈值，不能仅凭这些数值直接定性。同步改善 train 为 0.90、0.70、0.55、0.45、0.38，validation 为 0.95、0.75、0.60、0.50、0.44。过拟合 train 为 0.90、0.60、0.40、0.30、0.20，validation 为 1.00、0.70、0.50、0.52、0.65；最佳 epoch 3，分叉始于 epoch 4。loss 两位小数；epoch 为整数。</desc>
  <defs>
    <marker id="evidence-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/>
  <text x="48" y="58" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#172554">训练下降，验证在说什么？</text>
  <rect x="850" y="24" width="302" height="60" rx="18" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>
  <text x="882" y="63" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#78350f">教学示例 · 非实测</text>
  <text x="48" y="100" font-family="system-ui, sans-serif" font-size="26" fill="#475569">epoch 1 / 2 / 3 / 4 / 5　·　loss 两位小数；epoch 为整数。</text>

  <rect x="46" y="126" width="350" height="386" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="4"/>
  <text x="70" y="158" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#334155">① 训练/验证仍高</text>
  <text x="70" y="190" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#334155">→ 疑似欠拟合</text>
  <text x="70" y="222" font-family="system-ui, sans-serif" font-size="26" fill="#475569">绝对损失需任务基线 / 阈值</text>
  <line x1="84" y1="374" x2="360" y2="374" stroke="#64748b" stroke-width="3"/>
  <line x1="84" y1="250" x2="84" y2="374" stroke="#64748b" stroke-width="3"/>
  <polyline points="104,272 164,282 224,292 284,300 344,306" fill="none" stroke="#2563eb" stroke-width="5"/>
  <circle cx="104" cy="272" r="7" fill="#2563eb"/><circle cx="164" cy="282" r="7" fill="#2563eb"/><circle cx="224" cy="292" r="7" fill="#2563eb"/><circle cx="284" cy="300" r="7" fill="#2563eb"/><circle cx="344" cy="306" r="7" fill="#2563eb"/>
  <polyline points="104,256 164,266 224,276 284,282 344,286" fill="none" stroke="#a16207" stroke-width="5" stroke-dasharray="12 8"/>
  <rect x="98" y="250" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="158" y="260" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="218" y="270" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="278" y="276" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><rect x="338" y="280" width="12" height="12" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
  <text x="70" y="398" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#1e3a8a">train 0.95 / 0.90</text>
  <text x="70" y="430" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#1e3a8a">0.86 / 0.83 / 0.81</text>
  <text x="70" y="462" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">validation 1.00 / 0.96</text>
  <text x="70" y="494" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">0.92 / 0.90 / 0.89</text>

