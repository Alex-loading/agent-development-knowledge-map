lignment"/><text x="445" y="439" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >引用对齐 [1]</text><rect x="40" y="390" width="240" height="82" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="grounding-node" data-node="review"/><text x="160" y="439" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >拒答或复核</text><line x1="280" y1="196" x2="320" y2="196" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="grounding-edge" data-from="question" data-to="document-version" data-edge="question-document-version"/><line x1="565" y1="196" x2="605" y2="196" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="grounding-edge" data-from="document-version" data-to="recall" data-edge="document-version-recall"/><line x1="850" y1="196" x2="890" y2="196" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="grounding-edge" data-from="recall" data-to="ranking" data-edge="recall-ranking"/><line x1="1015" y1="237" x2="1015" y2="385" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="grounding-edge" data-from="ranking" data-to="context" data-edge="ranking-context"/><line x1="895" y1="431" x2="855" y2="431" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="grounding-edge" data-from="context" data-to="claim" data-edge="context-claim"/><line x1="610" y1="431" x2="570" y2="431" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="grounding-edge" data-from="claim" data-to="citation-alignment" data-edge="claim-citation-alignment"/><line x1="325" y1="431" x2="285" y2="431" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="grounding-edge" data-from="citation-alignment" data-to="review" data-edge="citation-alignment-review"/><rect x="125" y="270" width="160" height="60" rx="14" fill="#F5D7D2" 