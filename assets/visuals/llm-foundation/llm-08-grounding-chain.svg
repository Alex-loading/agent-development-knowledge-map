</defs>
<rect x="0" y="0" width="1200" height="675" fill="#F6F0E3"/>
<path d="M34 112 H1166" stroke="#18312D" stroke-width="2"/>
<text x="42" y="62" font-family="Avenir Next, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#18312D" text-anchor="start" >证据进入上下文后，还要逐段验证忠实性</text>
