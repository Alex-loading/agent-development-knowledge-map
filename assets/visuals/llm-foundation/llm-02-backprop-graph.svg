<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="backprop-title backprop-desc">
  <title id="backprop-title">共享变量分叉、汇合与梯度累加</title>
  <desc id="backprop-desc">共享变量 x 2 与参数 w 3。正向上支 a 6，下支 b 4，汇合 c 10，得到 L 50。反向两条路径对 x 的贡献是 30 与 40，在共享变量处累加为 70；dL/dw 20。本整数教学图不舍入。</desc>
  <defs>
    <marker id="forward-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="gradient-arrow" markerWidth="13" markerHeight="13" refX="2" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M12 0 L0 6 L12 12" fill="none" stroke="#a16207" stroke-width="2"/>
    </marker>
    <pattern id="sum-hatch" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="12" height="12" fill="#fef3c7"/>
      <path d="M0 12 L12 0" fill="none" stroke="#d97706" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/>
  <text x="48" y="60" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#172554">共享变量的梯度为何要相加？</text>
  <text x="48" y="98" font-family="system-ui, sans-serif" font-size="26" fill="#475569">本整数教学图不舍入。</text>
  <text x="48" y="144" font-family="system-ui, sans-serif" font-size="29" font-weight="800" fill="#1e3a8a">① forward · 实线向右</text>

  <rect x="56" y="246" width="136" height="86" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="92" y="298" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#172554">x 2</text>
  <rect x="56" y="154" width="136" height="68" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="92" y="198" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#4c1d95">w 3</text>

  <line x1="192" y1="270" x2="310" y2="204" stroke="#1d4ed8" stroke-width="5" marker-end="url(#forward-arrow)"/>
  <line x1="192" y1="188" x2="310" y2="188" stroke="#1d4ed8" stroke-width="5" marker-end="url(#forward-arrow)"/>
  <circle cx="370" cy="194" r="60" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="328" y="188" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#1e3a8a">a = xw</text>
  <text x="345" y="226" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#172554">a 6</text>

  <line x1="192" y1="308" x2="310" y2="382" stroke="#1d4ed8" stroke-width="5" marker-end="url(#forward-arrow)"/>
  <circle cx="370" cy="402" r="60" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="334" y="396" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#1e3a8a">b = x²</text>
  <text x="345" y="434" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#172554">b 4</text>

  <line x1="430" y1="194" x2="560" y2="276" stroke="#1d4ed8" stroke-width="5" marker-end="url(#forward-arrow)"/>
  <line x1="430" y1="402" x2="560" y2="318" stroke="#1d4ed8" stroke-width="5" marker-end="url(#forward-arrow)"/>
  <circle cx="622" cy="298" r="64" fill="#ecfccb" stroke="#4d7c0f" stroke-width="4"/>
  <text x="574" y="292" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#365314">c = a + b</text>
  <text x="592" y="332" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#172554">c 10</text>

  <line x1="686" y1="298" x2="814" y2="298" stroke="#1d4ed8" stroke-width="5" marker-end="url(#forward-arrow)"/>
  <polygon points="884,228 954,298 884,368 814,298" fill="#fce7f3" stroke="#be185d" stroke-width="4"/>
  <text x="842" y="292" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#831843">L = c²/2</text>
  <text x="850" y="332" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#831843">L 50</text>

  <text x="48" y="510" font-family="system-ui, sans-serif" font-size="29" font-weight="800" fill="#78350f">② backward · 虚线逆拓扑</text>
  <path d="M884 382 C790 514 704 514 624 382" fill="none" stroke="#a16207" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#gradient-arrow)"/>
  <text x="674" y="476" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">dL/dc 10 · dc/da 1 · dc/db 1</text>
  <path d="M584 356 C520 526 452 526 392 474" fill="none" stroke="#a16207" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#gradient-arrow)"/>
  <path d="M578 250 C520 108 454 108 402 130" fill="none" stroke="#a16207" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#gradient-arrow)"/>
  <text x="252" y="540" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">经 b：10 × 1 × 4 = 40</text>
  <text x="252" y="118" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">经 a：10 × 1 × 3 = 30</text>

  <rect x="56" y="560" width="600" height="82" rx="18" fill="url(#sum-hatch)" stroke="#a16207" stroke-width="4"/>
  <text x="82" y="610" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#78350f">③ x 汇合累加：30 + 40 = 70</text>
  <rect x="686" y="560" width="222" height="82" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
  <text x="720" y="610" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#4c1d95">dL/dw 20</text>
  <rect x="934" y="560" width="218" height="82" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="962" y="594" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#334155">梯度 ≠ 新参数</text>
  <text x="962" y="628" font-family="system-ui, sans-serif" font-size="26" fill="#334155">随后交给优化器</text>
</svg>
