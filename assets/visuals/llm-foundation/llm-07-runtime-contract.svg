<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Prompt 是可版本化的运行时契约</title>
<desc id="desc">目标、可信固定规则、不可信运行时数据、few-shot 边界、Schema、失败行为与评测版本沿单向流程排列；运行时数据不能覆盖固定规则。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B766E"/></marker>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#49645E" stroke-width="3"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="675" fill="#F6F0E3"/>
<path d="M34 112 H1166" stroke="#18312D" stroke-width="2"/>
<text x="42" y="62" font-family="Avenir Next, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#18312D" text-anchor="start" >Prompt 是可版本化的运行时契约</text>
<rect x="40" y="160" width="245" height="105" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="contract-node" data-node="goal"/><text x="163" y="207" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >任务目标</text><text x="163" y="241" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >可测成功</text><rect x="330" y="160" width="245" height="105" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="contract-node" data-node="fixed-rules"/><text x="453" y="207" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >可信固定规则</text><text x="453" y="241" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >锁定不可覆盖</text><rect x="620" y="160" width="245" height="105" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="contract-node" data-node="runtime-data"/><text x="743" y="207" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >运行时数据</text><text x="743" y="241" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >不可信卡槽</text><rect x="910" y="160" width="245" height="105" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="contract-node" data-node="few-shot-boundary"/><text x="1033" y="207" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >Few-shot 边界</text><text x="1033" y="241" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >正例和反例</text><rect x="910" y="340" width="245" height="105" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="contract-node" data-node="schema"/><text x="1033" y="387" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >输出 Schema</text><text x="1033" y="421" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >字段契约</text><rect x="620" y="340" width="245" height="105" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="contract-node" data-node="failure-behavior"/><text x="743" y="387" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >失败行为</text><text x="743" y="421" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >拒绝或升级</text><rect x="330" y="340" width="245" height="105" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="contract-node" data-node="eval-version"/><text x="453" y="387" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >评测版本</text><text x="453" y="421" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >P·M·S·E</text><line x1="285" y1="212" x2="325" y2="212" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="contract-edge" data-from="goal" data-to="fixed-rules" data-edge="goal-fixed-rules"/><line x1="575" y1="212" x2="615" y2="212" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="contract-edge" data-from="fixed-rules" data-to="runtime-data" data-edge="fixed-rules-runtime-data"/><line x1="865" y1="212" x2="905" y2="212" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="contract-edge" data-from="runtime-data" data-to="few-shot-boundary" data-edge="runtime-data-few-shot-boundary"/><line x1="1032" y1="265" x2="1032" y2="335" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="contract-edge" data-from="few-shot-boundary" data-to="schema" data-edge="few-shot-boundary-schema"/><line x1="910" y1="392" x2="870" y2="392" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="contract-edge" data-from="schema" data-to="failure-behavior" data-edge="schema-failure-behavior"/><line x1="620" y1="392" x2="580" y2="392" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="contract-edge" data-from="failure-behavior" data-to="eval-version" data-edge="failure-behavior-eval-version"/><rect x="330" y="122" width="245" height="30" rx="8" fill="#CDE9DF" stroke="#0B766E" stroke-width="2" /><text x="452" y="148" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#0B766E" text-anchor="middle" >🔒 可信规则区</text><rect x="620" y="122" width="245" height="30" rx="8" fill="url(#hatch)" stroke="#B94B42" stroke-width="2" /><text x="742" y="148" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#B94B42" text-anchor="middle" >卡槽 · 不可信数据区</text><rect x="72" y="505" width="1056" height="105" rx="16" fill="#FFFDF8" stroke="#18312D" stroke-width="2" /><text x="100" y="545" font-family="Avenir Next, PingFang SC, sans-serif" font-size="27" font-weight="800" fill="#0B766E" text-anchor="start" >单向契约：固定规则约束运行时数据；数据只能填入声明槽位。</text><text x="100" y="585" font-family="Avenir Next, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#B94B42" text-anchor="start" >“忽略前述规则”仍是数据，不能反向覆盖规则。</text>
</svg>
