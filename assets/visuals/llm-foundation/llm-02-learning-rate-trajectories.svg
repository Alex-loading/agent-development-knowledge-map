<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="lr-title lr-desc">
  <title id="lr-title">同一损失地形上的三种学习率轨迹</title>
  <desc id="lr-desc">L(w) 等于 (w-1)²，从 w0 等于 0 出发执行三步。η 0.1 的权重为 0.200、0.360、0.488，损失为 0.6400、0.4096、0.2621。η 0.5 的权重为 1.000、1.000、1.000，损失为 0.0000、0.0000、0.0000。η 1.1 的权重为 2.200、-0.440、2.728，损失为 1.4400、2.0736、2.9860。w 三位、loss 四位；断言使用未舍入值。</desc>
  <defs>
    <marker id="lr-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/>
  <text x="48" y="58" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#172554">学习率改变的是每一步有多远</text>
  <text x="48" y="96" font-family="system-ui, sans-serif" font-size="26" fill="#475569">L(w) = (w-1)² · w0 = 0 · 各执行三步 · w 三位、loss 四位；断言使用未舍入值。</text>

  <rect x="46" y="126" width="350" height="424" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="4" stroke-dasharray="6 8"/>
  <text x="70" y="168" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#334155">① 小步 · η 0.1</text>
  <path d="M84 360 Q216 164 352 360" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="104" cy="332" r="12" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <circle cx="150" cy="278" r="12" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <circle cx="190" cy="240" r="12" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <circle cx="222" cy="218" r="12" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <polyline points="104,332 150,278 190,240 222,218" fill="none" stroke="#334155" stroke-width="5" stroke-dasharray="7 8" marker-end="url(#lr-arrow)"/>
  <text x="70" y="398" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#334155">w：0.200 / 0.360</text>
  <text x="70" y="432" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#334155">　 0.488</text>
  <text x="70" y="466" font-family="system-ui, sans-serif" font-size="26" fill="#334155">loss：0.6400 / 0.4096</text>
  <text x="70" y="500" font-family="system-ui, sans-serif" font-size="26" fill="#334155">　　 0.2621</text>
  <text x="70" y="534" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#334155">缓慢靠近低谷</text>

  <rect x="426" y="126" width="350" height="424" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="450" y="168" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#1e3a8a">② 适中 · η 0.5</text>
  <path d="M464 360 Q596 164 732 360" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="484" cy="332" r="12" fill="#2563eb" stroke="#172554" stroke-width="3"/>
  <circle cx="596" cy="164" r="14" fill="#2563eb" stroke="#172554" stroke-width="4"/>
  <line x1="484" y1="332" x2="596" y2="178" stroke="#2563eb" stroke-width="6" marker-end="url(#lr-arrow)"/>
  <text x="450" y="398" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#1e3a8a">w：1.000 / 1.000</text>
  <text x="450" y="432" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#1e3a8a">　 1.000</text>
  <text x="450" y="466" font-family="system-ui, sans-serif" font-size="26" fill="#1e3a8a">loss：0.0000 / 0.0000</text>
  <text x="450" y="500" font-family="system-ui, sans-serif" font-size="26" fill="#1e3a8a">　　 0.0000</text>
  <text x="450" y="534" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#1e3a8a">一步到达低谷</text>

  <rect x="806" y="126" width="348" height="424" rx="22" fill="#ffffff" stroke="#a16207" stroke-width="6"/>
  <text x="830" y="168" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#78350f">③ 大步 · η 1.1</text>
  <path d="M844 360 Q976 164 1112 360" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <polyline points="864,332 1076,294 832,380 1130,404" fill="none" stroke="#a16207" stroke-width="8" marker-end="url(#lr-arrow)"/>
  <circle cx="864" cy="332" r="12" fill="#fef3c7" stroke="#78350f" stroke-width="4"/>
  <circle cx="1076" cy="294" r="12" fill="#fef3c7" stroke="#78350f" stroke-width="4"/>
  <circle cx="832" cy="380" r="12" fill="#fef3c7" stroke="#78350f" stroke-width="4"/>
  <circle cx="1130" cy="404" r="12" fill="#fef3c7" stroke="#78350f" stroke-width="4"/>
  <text x="830" y="420" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#78350f">w：2.200 / -0.440</text>
  <text x="830" y="454" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#78350f">　 2.728</text>
  <text x="830" y="488" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">loss：1.4400 / 2.0736</text>
  <text x="830" y="522" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">　　 2.9860</text>
  <text x="830" y="546" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#78350f">跨谷震荡并增大</text>

  <rect x="46" y="576" width="1108" height="66" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="72" y="618" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#334155">观察信号：慢降 / 到谷底 / 震荡发散　·　梯度清零是框架循环职责</text>
</svg>
