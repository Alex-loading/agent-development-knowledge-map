<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="rag-title rag-desc">
  <title id="rag-title">RAG / SFT 决策：命名轴 + 示例证据</title>
  <desc id="rag-desc">四个用例按更新频率、引用需求、稳定行为与示例证据进入三条路线。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">RAG / SFT 决策：命名轴 + 示例证据</text>
  <text x="48" y="88" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">高阈值 = 3 · u更新 c引用 s稳定 b预算 r风险 ex示例</text>
  <text x="48" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">用例</text>
  <text x="270" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">六轴 u/c/s/b/r/ex</text>
  <text x="640" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">路线 → 下一步</text>
  <rect x="48" y="146" width="1104" height="88" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3" data-region="decision-row" data-row="0"/>
  <text x="68" y="198" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">每日制度问答</text><text x="290" y="198" font-family="Trebuchet MS" font-size="26" fill="#18212B">3/3/F/1/3/F</text>
  <text x="640" y="172" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#1F7A78">RAG</text><text x="640" y="202" font-family="Trebuchet MS" font-size="26" fill="#18212B">下一步：检索 / 引用 / 权限评测</text><text x="640" y="230" font-family="Trebuchet MS" font-size="26" fill="#18212B">高风险切片+回滚；低算力基线</text>
  <rect x="48" y="242" width="1104" height="88" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3" data-region="decision-row" data-row="1"/>
  <text x="68" y="294" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">稳定客服语气</text><text x="290" y="294" font-family="Trebuchet MS" font-size="26" fill="#18212B">1/1/T/2/2/T</text>
  <text x="640" y="268" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#1F7A78">SFT/LoRA</text><text x="640" y="298" font-family="Trebuchet MS" font-size="26" fill="#18212B">下一步：对比 Prompt / 工具基线</text><text x="640" y="326" font-family="Trebuchet MS" font-size="26" fill="#18212B">标准切片+回滚；训练/服务成本</text>
  <rect x="48" y="338" width="1104" height="88" rx="16" fill="#F4E8EB" stroke="#A33A24" stroke-width="3" data-region="decision-row" data-row="2"/>
  <text x="68" y="390" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">不稳定任务目标</text><text x="290" y="390" font-family="Trebuchet MS" font-size="26" fill="#18212B">1/1/F/2/2/T</text>
  <text x="640" y="364" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">insufficient evidence—do not fine-tune</text><text x="640" y="394" font-family="Trebuchet MS" font-size="26" fill="#18212B">下一步：澄清目标并建基线</text><text x="640" y="422" font-family="Trebuchet MS" font-size="26" fill="#18212B">标准切片+回滚；训练/服务成本</text>
  <rect x="48" y="434" width="1104" height="88" rx="16" fill="#F4E8EB" stroke="#A33A24" stroke-width="3" data-region="decision-row" data-row="3"/>
  <text x="68" y="486" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">稳定但无示例</text><text x="290" y="486" font-family="Trebuchet MS" font-size="26" fill="#18212B">1/1/T/2/2/F</text>
  <text x="640" y="460" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">insufficient evidence—do not fine-tune</text><text x="640" y="490" font-family="Trebuchet MS" font-size="26" fill="#18212B">下一步：收集示例并建基线</text><text x="640" y="518" font-family="Trebuchet MS" font-size="26" fill="#18212B">标准切片+回滚；训练/服务成本</text>
  <text x="48" y="548" font-family="Trebuchet MS" font-size="26" fill="#18212B">Method：updateFrequency / citationNeed 达 3 → RAG；</text>
  <text x="48" y="578" font-family="Trebuchet MS" font-size="26" fill="#18212B">stableBehavior + hasExamples → SFT/LoRA；其余先建 Prompt/工具基线。</text>
  <text x="48" y="608" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">insufficient evidence—do not fine-tune · 风险切片 + 成本检查 + 回滚</text>
  <text x="48" y="638" font-family="Trebuchet MS" font-size="26" fill="#18212B">Rounding：等级为整数；布尔证据不换算总分。风险、成本与回滚进入评测。</text>
  <g data-region="rag-axis-cell" data-row="0" data-column="updateFrequency" data-value="3"/><g data-region="rag-axis-cell" data-row="0" data-column="citationNeed" data-value="3"/><g data-region="rag-axis-cell" data-row="0" data-column="stableBehavior" data-value="false"/><g data-region="rag-axis-cell" data-row="0" data-column="computeBudget" data-value="1"/><g data-region="rag-axis-cell" data-row="0" data-column="risk" data-value="3"/><g data-region="rag-axis-cell" data-row="0" data-column="hasExamples" data-value="false"/>
  <g data-region="rag-axis-cell" data-row="1" data-column="updateFrequency" data-value="1"/><g data-region="rag-axis-cell" data-row="1" data-column="citationNeed" data-value="1"/><g data-region="rag-axis-cell" data-row="1" data-column="stableBehavior" data-value="true"/><g data-region="rag-axis-cell" data-row="1" data-column="computeBudget" data-value="2"/><g data-region="rag-axis-cell" data-row="1" data-column="risk" data-value="2"/><g data-region="rag-axis-cell" data-row="1" data-column="hasExamples" data-value="true"/>
  <g data-region="rag-axis-cell" data-row="2" data-column="updateFrequency" data-value="1"/><g data-region="rag-axis-cell" data-row="2" data-column="citationNeed" data-value="1"/><g data-region="rag-axis-cell" data-row="2" data-column="stableBehavior" data-value="false"/><g data-region="rag-axis-cell" data-row="2" data-column="computeBudget" data-value="2"/><g data-region="rag-axis-cell" data-row="2" data-column="risk" data-value="2"/><g data-region="rag-axis-cell" data-row="2" data-column="hasExamples" data-value="true"/>
  <g data-region="rag-axis-cell" data-row="3" data-column="updateFrequency" data-value="1"/><g data-region="rag-axis-cell" data-row="3" data-column="citationNeed" data-value="1"/><g data-region="rag-axis-cell" data-row="3" data-column="stableBehavior" data-value="true"/><g data-region="rag-axis-cell" data-row="3" data-column="computeBudget" data-value="2"/><g data-region="rag-axis-cell" data-row="3" data-column="risk" data-value="2"/><g data-region="rag-axis-cell" data-row="3" data-column="hasExamples" data-value="false"/>
  <g data-region="rag-evaluation" data-row="0" data-value="high-risk slices + rollback|low-compute baseline required|evaluate retrieval, citations and permissions"/>
  <g data-region="rag-evaluation" data-row="1" data-value="standard slices + rollback|compare training and serving cost|compare against the Prompt/tool baseline before training"/>
  <g data-region="rag-evaluation" data-row="2" data-value="standard slices + rollback|compare training and serving cost|establish Prompt/tool baseline and clarify the target"/>
  <g data-region="rag-evaluation" data-row="3" data-value="standard slices + rollback|compare training and serving cost|establish Prompt/tool baseline and continue collecting data"/>
</svg>
