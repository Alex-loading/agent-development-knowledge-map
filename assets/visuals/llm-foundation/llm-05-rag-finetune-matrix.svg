<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="rag-title rag-desc">
<title id="rag-title">RAG / SFT 决策：命名轴 + 示例证据</title><desc id="rag-desc">四个用例按更新频率、引用需求、稳定行为与示例证据进入三条路线。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
<text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B" >RAG / SFT 决策：命名轴 + 示例证据</text>
<text x="48" y="88" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" >高阈值 = 3；等级 1/2/3；布尔证据不换算总分</text>
<text x="48" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >用例</text><text x="270" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >更新 / 引用</text><text x="470" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >行为 / 示例</text><text x="640" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >路线 → 下一步</text>
<rect x="48" y="152" width="1104" height="76" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3" data-region="decision-row" data-row="0"/><text x="68" y="198" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >每日制度问答</text><text x="290" y="198" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >3 / 3</text><text x="490" y="198" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >false / false</text><text x="640" y="184" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#1F7A78" >RAG</text><text x="640" y="214" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >评测检索、引用与权限</text><rect x="48" y="244" width="1104" height="76" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3" data-region="decision-row" data-row="1"/><text x="68" y="290" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >稳定客服语气</text><text x="290" y="290" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >1 / 1</text><text x="490" y="290" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >true / true</text><text x="640" y="276" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#1F7A78" >SFT/LoRA</text><text x="640" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >先对比 Prompt / 工具基线</text><rect x="48" y="336" width="1104" height="76" rx="16" fill="#F4E8EB" stroke="#A33A24" stroke-width="3" data-region="decision-row" data-row="2"/><text x="68" y="382" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >不稳定任务目标</text><text x="290" y="382" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >1 / 1</text><text x="490" y="382" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >false / true</text><text x="640" y="368" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >insufficient evidence—do not fine-tune</text><text x="640" y="398" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >先澄清目标并建基线</text><rect x="48" y="428" width="1104" height="76" rx="16" fill="#F4E8EB" stroke="#A33A24" stroke-width="3" data-region="decision-row" data-row="3"/><text x="68" y="474" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >稳定但无示例</text><text x="290" y="474" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >1 / 1</text><text x="490" y="474" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >true / false</text><text x="640" y="460" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >insufficient evidence—do not fine-tune</text><text x="640" y="490" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >先收集示例并建基线</text>
<text x="48" y="536" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Method：updateFrequency 或 citationNeed 达 3 → RAG；</text>
<text x="48" y="568" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >否则 stableBehavior 且 hasExamples → SFT/LoRA。</text>
<text x="48" y="602" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >其余 → insufficient evidence—do not fine-tune；先 Prompt/工具基线并收集证据。</text>
<text x="48" y="638" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Rounding：等级为整数；布尔证据不换算总分。风险切片、成本与回滚进入评测。</text></svg>
