  <text x="716" y="293" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">0</text>
  <rect x="770" y="262" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="2" data-column="1" data-value="0"/>
  <text x="800" y="293" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">0</text>
