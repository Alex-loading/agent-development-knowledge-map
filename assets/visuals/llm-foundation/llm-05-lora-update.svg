  <g data-region="lora-node" data-node="frozen-w"><rect x="178" y="412" width="155" height="54" rx="12" fill="#F4E8EB" stroke="#315C9B" stroke-width="3"/><text x="195" y="449" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">xW 🔒</text></g>
