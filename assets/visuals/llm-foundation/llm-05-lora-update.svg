  <rect x="686" y="306" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="3" data-column="0" data-value="-1"/>
  <text x="716" y="337" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">-1</text>
  <rect x="770" y="306" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="3" data-column="1" data-value="0"/>
  <text x="800" y="337" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">0</text>
  <rect x="854" y="306" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="3" data-column="2" data-value="1"/>
  <text x="884" y="337" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">1</text>
  <rect x="938" y="306" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="3" data-column="3" data-value="0"/>
  <text x="968" y="337" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">0</text>
  <rect x="48" y="396" width="1104" height="254" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
  <g><rect data-region="lora-node" data-node="x" x="68" y="430" width="58" height="54" rx="12" fill="#FFF3D5" stroke="#18212B" stroke-width="3"/><text x="86" y="467" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">x</text></g>
  <g><rect data-region="lora-node" data-node="wx" x="178" y="410" width="184" height="54" rx="12" fill="#F4E8EB" stroke="#315C9B" stroke-width="3"/><text x="202" y="447" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">Wx 🔒</text></g>
  <g><rect data-region="lora-node" data-node="ax" x="178" y="484" width="150" height="54" rx="12" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/><text x="207" y="521" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">Ax</text></g>
  <g><rect data-region="lora-node" data-node="bax" x="374" y="484" width="224" height="54" rx="12" fill="#FFF3D5" stroke="#C58A10" stroke-width="3"/><text x="396" y="521" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">B(Ax)=ΔWx</text></g>
  <g><circle data-region="lora-node" data-node="plus" cx="650" cy="450" r="28" fill="#FFFFFF" stroke="#18212B" stroke-width="3"/><text x="640" y="460" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">+</text></g>
  <g><rect data-region="lora-node" data-node="adapted-output" x="704" y="423" width="210" height="54" rx="12" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/><text x="723" y="460" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">适配后输出</text></g>
  <g><rect data-region="lora-node" data-node="train-boundary" x="940" y="406" width="190" height="78" rx="12" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/><text x="960" y="438" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">训练</text><text x="960" y="470" font-family="Trebuchet MS" font-size="26" fill="#18212B">只更新 A/B</text></g>
  <path data-region="lora-edge" data-edge="x-wx" data-from="x" data-to="wx" d="M126 444 H174" fill="none" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/>
  <path data-region="lora-edge" data-edge="x-ax" data-from="x" data-to="ax" d="M126 470 H150 V511 H174" fill="none" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/>
  <path data-region="lora-edge" data-edge="ax-bax" data-from="ax" data-to="bax" d="M328 511 H370" fill="none" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/>
  <path data-region="lora-edge" data-edge="wx-plus" data-from="wx" data-to="plus" d="M362 437 H618" fill="none" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/>
  <path data-region="lora-edge" data-edge="bax-plus" data-from="bax" data-to="plus" d="M598 511 H612 V472" fill="none" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/>
  <path data-region="lora-edge" data-edge="plus-output" data-from="plus" data-to="adapted-output" d="M678 450 H700" fill="none" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="68" y="568" font-family="Trebuchet MS" font-size="26" fill="#18212B">W(4×4) × x(4×1) → Wx(4×1)</text>
  <text x="68" y="600" font-family="Trebuchet MS" font-size="26" fill="#18212B">A(1×4) × x(4×1) → Ax(1×1)</text>
  <text x="68" y="632" font-family="Trebuchet MS" font-size="26" fill="#18212B">B(4×1) × Ax(1×1) → B(Ax)=ΔWx(4×1)</text>
  <g><rect data-region="lora-node" data-node="deploy-boundary" x="620" y="530" width="510" height="104" rx="12" fill="#FFF3D5" stroke="#C58A10" stroke-width="3"/><text data-region="lora-deploy-text" data-kind="deployment-mode" x="640" y="560" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">部署：base+adapter / W+ΔW 合并</text><text data-region="lora-deploy-text" data-kind="parameter-count" x="640" y="590" font-family="Trebuchet MS" font-size="26" fill="#18212B">参数 8 vs fullParameters 16</text><text data-region="lora-deploy-text" data-kind="rounding" x="640" y="618" font-family="Trebuchet MS" font-size="26" fill="#18212B">Rounding：整数原样。</text></g>
</svg>
