  <text x="800" y="249" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">0</text>
  <rect x="854" y="218" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="1" data-column="2" data-value="-2"/>
  <text x="884" y="249" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">-2</text>
  <rect x="938" y="218" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="1" data-column="3" data-value="0"/>
  <text x="968" y="249" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">0</text>
