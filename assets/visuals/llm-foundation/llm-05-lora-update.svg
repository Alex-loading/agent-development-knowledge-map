  <g data-region="lora-node" data-node="train-boundary"><rect x="916" y="408" width="214" height="76" rx="12" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/><text x="936" y="439" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">训练</text><text x="936" y="471" font-family="Trebuchet MS" font-size="26" fill="#18212B">只更新 A/B</text></g>
