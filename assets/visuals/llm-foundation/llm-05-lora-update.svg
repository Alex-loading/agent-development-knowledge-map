<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="lora-title lora-desc">
<title id="lora-title">LoRA：冻结 W，学习低秩 ΔW = BA</title><desc id="lora-desc">四乘四原权重旁路由 A 与 B 构成秩一增量，展示完整增量矩阵和参数量。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
<text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B" >LoRA：冻结 W，学习低秩 ΔW = BA</text>
<text x="48" y="92" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >教学示例 · 非实测</text>
<rect x="48" y="122" width="260" height="250" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" /><text x="70" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" >冻结 W 4×4 🔒</text><text x="70" y="204" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >主路径：xW</text><text x="70" y="250" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >full 参数 4×4 = 16</text><text x="70" y="296" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >W 不更新</text><text x="70" y="342" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >基础模型仍需加载</text>
<rect x="346" y="122" width="260" height="250" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3" /><text x="368" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#1F7A78" >低秩旁路（可训练）</text><text x="368" y="204" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >A 1×4 = [1,0,-1,0]</text><text x="368" y="250" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >B 4×1 = [1,2,0,-1]ᵀ</text><text x="368" y="296" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >rank = 1</text><text x="368" y="342" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >adapter 参数 4+4 = 8</text>
<rect x="644" y="122" width="508" height="250" rx="16" fill="#FFF3D5" stroke="#C58A10" stroke-width="3" /><text x="666" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#8A6510" >ΔW = BA（4×4）</text>
<rect x="686" y="174" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="0" data-column="0" data-value="1"/><text x="716" y="205" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >1</text><rect x="770" y="174" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="0" data-column="1" data-value="0"/><text x="800" y="205" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0</text><rect x="854" y="174" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="0" data-column="2" data-value="-1"/><text x="884" y="205" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >-1</text><rect x="938" y="174" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="0" data-column="3" data-value="0"/><text x="968" y="205" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0</text><rect x="686" y="218" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="1" data-column="0" data-value="2"/><text x="716" y="249" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >2</text><rect x="770" y="218" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="1" data-column="1" data-value="0"/><text x="800" y="249" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0</text><rect x="854" y="218" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="1" data-column="2" data-value="-2"/><text x="884" y="249" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >-2</text><rect x="938" y="218" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="1" data-column="3" data-value="0"/><text x="968" y="249" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0</text><rect x="686" y="262" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="2" data-column="0" data-value="0"/><text x="716" y="293" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0</text><rect x="770" y="262" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="2" data-column="1" data-value="0"/><text x="800" y="293" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0</text><rect x="854" y="262" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="2" data-column="2" data-value="0"/><text x="884" y="293" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0</text><rect x="938" y="262" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="2" data-column="3" data-value="0"/><text x="968" y="293" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0</text><rect x="686" y="306" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="3" data-column="0" data-value="-1"/><text x="716" y="337" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >-1</text><rect x="770" y="306" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="3" data-column="1" data-value="0"/><text x="800" y="337" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0</text><rect x="854" y="306" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="3" data-column="2" data-value="1"/><text x="884" y="337" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >1</text><rect x="938" y="306" width="84" height="44" rx="0" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="lora-delta-cell" data-row="3" data-column="3" data-value="0"/><text x="968" y="337" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0</text>
<path data-region="teaching-edge" data-edge="w-sum" d="M308 350 H625" fill="none" stroke="#18212B" stroke-width="4"/>
<path data-region="teaching-edge" data-edge="a-b-delta" d="M606 330 H625 V350" fill="none" stroke="#18212B" stroke-width="4"/>
<circle cx="625" cy="350" r="7" fill="#18212B"/><line x1="625" y1="350" x2="640" y2="350" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="48" y="412" width="1104" height="206" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" /><text x="72" y="452" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Input：冻结 W 为 4×4、rank=1、A=[1,0,-1,0]、B=[1,2,0,-1]^T。</text><text x="72" y="492" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Method：ΔW=BA；adapter 参数量为 A 与 B 元素数之和。</text><text x="72" y="532" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >Result：ΔW 逐格如上；adapterParameters 8 vs fullParameters 16。</text><text x="72" y="572" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >Rounding：整数原样。LoRA 是更新方式，不保证可解释地存储事实。</text><text x="72" y="608" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >基础模型、激活、数据、训练、评测与部署成本仍然存在。</text></svg>
