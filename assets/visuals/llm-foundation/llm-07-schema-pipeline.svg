<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">从模型文本到可信对象：四道独立校验门</title>
<desc id="desc">模型文本依次经过 JSON 解析、required type enum、跨字段业务规则、权限与数据库检查；每关有独立错误分支，只有 typed object 能进入副作用区。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B766E"/></marker>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#49645E" stroke-width="3"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="675" fill="#F6F0E3"/>
<path d="M34 112 H1166" stroke="#18312D" stroke-width="2"/>
<text x="42" y="62" font-family="Avenir Next, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#18312D" text-anchor="start" >从模型文本到可信对象：四道独立校验门</text>
<rect x="40" y="150" width="210" height="90" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="model-text"/><text x="145" y="189" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >模型文本</text><text x="145" y="223" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >不可信原始输出</text><rect x="330" y="150" width="210" height="90" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="json-parse"/><text x="435" y="189" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >① JSON 解析</text><text x="435" y="223" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >语法</text><rect x="620" y="150" width="250" height="90" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="required-type-enum"/><text x="745" y="189" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >② Schema</text><text x="745" y="223" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >required · type · enum</text><rect x="620" y="350" width="250" height="90" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="business-rules"/><text x="745" y="389" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >③ 跨字段规则</text><text x="745" y="423" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >业务一致性</text><rect x="910" y="350" width="250" height="90" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="permission-database"/><text x="1035" y="389" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >④ 权限和数据库</text><text x="1035" y="423" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >外部状态</text><rect x="910" y="520" width="250" height="75" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="typed-object"/><text x="1035" y="552" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >Typed object</text><text x="1035" y="586" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >仅全通过后可信</text><rect x="620" y="520" width="250" height="75" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="side-effect"/><text x="745" y="552" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >副作用区</text><text x="745" y="586" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >可信消费</text><line x1="250" y1="195" x2="325" y2="195" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="schema-main-edge" data-from="model-text" data-to="json-parse" data-edge="model-text-json-parse"/><line x1="540" y1="195" x2="615" y2="195" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="schema-main-edge" data-from="json-parse" data-to="required-type-enum" data-edge="json-parse-required-type-enum"/><line x1="745" y1="240" x2="745" y2="345" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="schema-main-edge" data-from="required-type-enum" data-to="business-rules" data-edge="required-type-enum-business-rules"/><line x1="870" y1="395" x2="905" y2="395" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="schema-main-edge" data-from="business-rules" data-to="permission-database" data-edge="business-rules-permission-database"/><line x1="1035" y1="440" x2="1035" y2="515" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="schema-main-edge" data-from="permission-database" data-to="typed-object" data-edge="permission-database-typed-object"/><line x1="910" y1="558" x2="875" y2="558" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="schema-main-edge" data-from="typed-object" data-to="side-effect" data-edge="typed-object-side-effect"/><rect x="40" y="300" width="210" height="72" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="parse-error"/><text x="145" y="330" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >语法错误</text><text x="145" y="364" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >修复或降级</text><rect x="330" y="300" width="210" height="72" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="schema-error"/><text x="435" y="330" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >结构错误</text><text x="435" y="364" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >修复或降级</text><rect x="40" y="470" width="210" height="72" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="business-error"/><text x="145" y="500" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >业务错误</text><text x="145" y="534" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >拒绝或人工</text><rect x="330" y="520" width="250" height="75" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="schema-node" data-node="permission-error"/><text x="455" y="552" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >权限或状态错误</text><text x="455" y="586" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >拒绝或人工</text><line x1="400" y1="240" x2="145" y2="295" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="schema-error-edge" data-from="json-parse" data-to="parse-error" data-edge="json-parse-parse-error"/><line x1="620" y1="195" x2="540" y2="336" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="schema-error-edge" data-from="required-type-enum" data-to="schema-error" data-edge="required-type-enum-schema-error"/><path d="M620 395 C500 445 360 460 250 506" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="schema-error-edge" data-from="business-rules" data-to="business-error" data-edge="business-rules-business-error"/><path d="M910 420 H890 V485 H600 V558 H580" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="schema-error-edge" data-from="permission-database" data-to="permission-error" data-edge="permission-database-permission-error"/><text x="45" y="625" font-family="Avenir Next, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#18312D" text-anchor="start" >JSON 语法只是第一关；结构、业务、权限和外部状态分开验证。</text>
</svg>
