<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="llm-field-map-title llm-field-map-desc">
  <title id="llm-field-map-title">大模型领域地图：方法轴与生成能力轴</title>
  <desc id="llm-field-map-desc">整张图由人工智能 AI 外框包围。左侧方法轴中，机器学习框位于 AI 内，深度学习框位于机器学习内；搜索与规划位于 AI 内但在机器学习外，说明 AI 还包含非学习方法。右侧生成能力轴中，生成式 AI 虚线框包含语言生成和图像音频生成；LLM 位于语言生成区域，并用明确连线连接左侧深度学习。视觉与语音标签位于深度学习中但不属于 LLM，说明深度学习不只处理语言。底部图例用实线、虚线和斜线阴影分别表示方法包含、生成能力与两轴交叉。</desc>
  <defs>
    <pattern id="cross-hatch" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="16" fill="#fef3c7"/>
      <path d="M-4 4 L4 -4 M0 16 L16 0 M12 20 L20 12" fill="none" stroke="#d97706" stroke-width="3"/>
    </pattern>
    <marker id="axis-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/>
  <rect data-region="ai-universe" x="24" y="22" width="1152" height="631" rx="28" fill="#eef6ff" stroke="#1d4ed8" stroke-width="4"/>
  <text x="58" y="70" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#172554">① 总目标：人工智能 AI</text>
  <text x="624" y="68" font-family="system-ui, sans-serif" font-size="28" fill="#334155">同一宇宙，两条互补分类轴</text>

  <g aria-label="方法包含轴">
    <rect data-region="method-panel" x="52" y="104" width="520" height="430" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <text x="78" y="148" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#0f172a">② 方法包含链</text>
    <rect data-region="machine-learning" x="190" y="172" width="350" height="305" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="215" y="218" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">机器学习 ML</text>
    <rect data-region="deep-learning" x="280" y="252" width="230" height="164" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
    <text x="300" y="294" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#4c1d95">深度学习 DL</text>
    <rect data-region="search-planning" x="62" y="220" width="120" height="165" rx="16" fill="#ecfccb" stroke="#4d7c0f" stroke-width="3" aria-label="搜索 / 规划"/>
    <text x="78" y="510" font-family="system-ui, sans-serif" font-size="26" fill="#334155">实线：ML ⊂ AI · DL ⊂ ML</text>
  </g>

  <g aria-label="生成能力轴">
    <rect data-region="capability-panel" x="594" y="104" width="554" height="430" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <text x="620" y="148" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#0f172a">③ 生成能力轴</text>
    <rect data-region="generative-ai" x="620" y="172" width="500" height="305" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="644" y="218" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#9a3412">生成式 AI</text>
    <rect x="646" y="246" width="215" height="120" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
    <text x="674" y="316" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#7c2d12">语言生成</text>
    <rect x="882" y="246" width="214" height="120" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
    <text x="906" y="298" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#831843">图像生成</text>
    <text x="906" y="338" font-family="system-ui, sans-serif" font-size="28" fill="#831843">音频生成</text>
  </g>

  <g aria-label="两轴交叉">
    <line data-region="dl-to-llm" x1="510" y1="335" x2="682" y2="421" stroke="#7c3aed" stroke-width="6" marker-end="url(#axis-arrow)"/>
    <rect data-region="llm" x="682" y="382" width="178" height="78" rx="18" fill="url(#cross-hatch)" stroke="#a16207" stroke-width="4"/>
    <text x="711" y="432" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#78350f">LLM</text>
    <text x="878" y="410" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#4c1d95">④ 交叉处：LLM</text>
    <text x="878" y="450" font-family="system-ui, sans-serif" font-size="26" fill="#4c1d95">深度学习 × 语言生成</text>
  </g>

  <g aria-label="两个反例">
    <text x="70" y="194" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#365314">⑤ 两个反例</text>
    <text x="78" y="276" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#365314">搜索 /</text>
    <text x="78" y="312" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#365314">规划</text>
    <text x="78" y="354" font-family="system-ui, sans-serif" font-size="26" fill="#365314">非学习 AI</text>
    <text x="311" y="352" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#4c1d95">视觉 / 语音</text>
    <text x="325" y="390" font-family="system-ui, sans-serif" font-size="26" fill="#4c1d95">非语言 DL</text>
  </g>

  <g aria-label="视觉编码图例">
    <rect x="52" y="558" width="1096" height="68" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <line x1="75" y1="592" x2="115" y2="592" stroke="#2563eb" stroke-width="5"/>
    <text x="128" y="604" font-family="system-ui, sans-serif" font-size="26" fill="#1e293b">实线嵌套：方法包含</text>
    <line x1="406" y1="592" x2="446" y2="592" stroke="#ea580c" stroke-width="5" stroke-dasharray="10 7"/>
    <text x="459" y="604" font-family="system-ui, sans-serif" font-size="26" fill="#1e293b">虚线边界：生成能力</text>
    <rect x="786" y="576" width="44" height="32" rx="6" fill="url(#cross-hatch)" stroke="#a16207" stroke-width="2"/>
    <text x="844" y="604" font-family="system-ui, sans-serif" font-size="26" fill="#1e293b">斜线阴影：两轴交叉</text>
  </g>
</svg>
