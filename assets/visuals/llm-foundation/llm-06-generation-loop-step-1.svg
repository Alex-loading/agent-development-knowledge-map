<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="generation-step-1-title generation-step-1-desc">
<title id="generation-step-1-title">采样链 · 步骤 1/5</title><desc id="generation-step-1-desc">固定布局累计展示 raw logits、temperature、softmax、top-p nucleus 与逆 CDF 抽样。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
<text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B" >采样链 · 步骤 1/5</text><g data-region="phase-raw" data-phase="raw" data-state="active"><rect x="48" y="118" width="202" height="330" rx="16" fill="#FFF3D5" stroke="#C58A10" stroke-width="3" data-phase="raw" data-state="active"/><text x="66" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="raw" data-state="active">1 RAW</text><text x="66" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="raw" data-state="active">C 0.0000</text><text x="66" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="raw" data-state="active">A 2.0000</text><text x="66" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="raw" data-state="active">B 1.0000</text><text x="66" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="raw" data-state="active">步骤 1</text></g><g data-region="phase-temperature" data-phase="temperature" data-state="placeholder"><rect x="270" y="118" width="202" height="330" rx="16" fill="#EEE9DC" stroke="#9B968D" stroke-width="3" data-phase="temperature" data-state="placeholder"/><text x="290" y="160" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#6F6A61" data-phase="temperature" data-state="placeholder">2 待解锁</text></g><g data-region="phase-softmax" data-phase="softmax" data-state="placeholder"><rect x="492" y="118" width="202" height="330" rx="16" fill="#EEE9DC" stroke="#9B968D" stroke-width="3" data-phase="softmax" data-state="placeholder"/><text x="512" y="160" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#6F6A61" data-phase="softmax" data-state="placeholder">3 待解锁</text></g><g data-region="phase-nucleus" data-phase="nucleus" data-state="placeholder"><rect x="714" y="118" width="202" height="330" rx="16" fill="#EEE9DC" stroke="#9B968D" stroke-width="3" data-phase="nucleus" data-state="placeholder"/><text x="734" y="160" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#6F6A61" data-phase="nucleus" data-state="placeholder">4 待解锁</text></g><g data-region="phase-sample" data-phase="sample" data-state="placeholder"><rect x="936" y="118" width="202" height="330" rx="16" fill="#EEE9DC" stroke="#9B968D" stroke-width="3" data-phase="sample" data-state="placeholder"/><text x="956" y="160" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#6F6A61" data-phase="sample" data-state="placeholder">5 待解锁</text></g><rect x="48" y="488" width="1104" height="138" rx="16" fill="#FFFFFF" stroke="#1F7A78" stroke-width="3" /><text x="72" y="528" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >固定数值：C/A/B logits 0/2/1；T=1；top-p=.8；u=.7。</text><text x="72" y="566" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >stable softmax → 最小 nucleus → 集合内重归一化 → 逆 CDF 抽样。</text><text x="72" y="604" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >概率四位小数；累计比较使用未舍入值。教学示例 · 非实测</text></svg>
