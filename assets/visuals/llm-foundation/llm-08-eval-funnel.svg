<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">总体 86.7%，仍被对抗切片 Hard Gate 阻断</title>
<desc id="desc">需求日志事故经治理进入 normal 六比六、boundary 四比五、adversarial 三比四切片，再经组合 grader 与阈值进入发布门；总体十三比十五但对抗切片未达百分百，因此阻断并回流。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B766E"/></marker>
