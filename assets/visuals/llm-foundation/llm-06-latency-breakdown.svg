<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="latency-title latency-desc">
<title id="latency-title">把 TTFT、decode 与尾延迟拆开</title><desc id="latency-desc">延迟瀑布展示 queue、prefill、首包和五段 decode，并计算 nearest-rank P95。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
<text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B" >把 TTFT、decode 与尾延迟拆开</text>
<text x="48" y="88" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" >单请求教学瀑布（ms）</text>
<rect x="48" y="118" width="160" height="96" rx="4" fill="#F4E8EB" stroke="#18212B" stroke-width="3" data-region="latency-segment" data-index="0" data-value="40"/><text x="60" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >Queue</text><text x="60" y="196" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >40 ms</text><rect x="208" y="118" width="320" height="96" rx="4" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="latency-segment" data-index="1" data-value="80"/><text x="220" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >Prefill</text><text x="220" y="196" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >80 ms</text><rect x="528" y="118" width="80" height="96" rx="4" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="latency-segment" data-index="2" data-value="20"/><text x="540" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >首包</text><text x="540" y="196" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >20 ms</text><rect x="608" y="118" width="400" height="96" rx="4" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="latency-segment" data-index="3" data-value="100"/><text x="620" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >5×decode</text><text x="620" y="196" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >100 ms</text>
<text x="48" y="258" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >TTFT = queue 40 + prefill 80 + first packet 20 = 140 ms</text><text x="48" y="298" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >E2E = TTFT 140 + decode 5×20 = 240 ms</text>
<rect x="48" y="338" width="1104" height="278" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" /><text x="72" y="378" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" >20 个样本先排序；P95 nearest-rank = ceil(0.95×20) = rank 19</text><text x="72" y="418" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >sorted：100 / 110 / 120 / 130 / 140 / 150 / 160 / 170 / 180 / 190</text><text x="72" y="454" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >200 / 210 / 220 / 230 / 240 / 250 / 260 / 270 / 280 / 500</text><text x="72" y="494" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >Result：P95 = 280 ms；max = 500 ms（平均值不能代替尾延迟）</text><text x="72" y="534" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Input：queue=40、prefill=80、首包=20、5 个 decode 间隔各 20；20 样本。</text><text x="72" y="570" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Method：TTFT 分段求和；E2E 加 decode；P95=nearest-rank ceil(0.95N)。</text><text x="72" y="604" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Rounding：毫秒整数；P95 不插值。诊断须按长度、并发与 cache hit 分桶。</text></svg>
