<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="latency-title latency-desc">
  <title id="latency-title">把 TTFT、decode 与尾延迟拆开</title>
  <desc id="latency-desc">延迟瀑布展示 TTFT、TPOT 与端到端；二十个排序点标出 rank 19 的 P95 与 rank 20 最大值，诊断矩阵覆盖 Queue 高、Prefill 慢、Decode 慢和 P95 尾异常。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">把 TTFT、decode 与尾延迟拆开</text>
  <text x="48" y="88" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">单请求教学瀑布 · queue=40 · prefill=80 · 首包=20 · 5 个 decode</text>
  <rect x="48" y="118" width="160" height="96" rx="4" fill="#F4E8EB" stroke="#18212B" stroke-width="3" data-region="latency-segment" data-index="0" data-value="40"/>
  <text x="60" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">Queue</text>
  <text x="60" y="196" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B">40 ms</text>
  <rect x="208" y="118" width="320" height="96" rx="4" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="latency-segment" data-index="1" data-value="80"/>
  <text x="220" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">Prefill</text>
  <text x="220" y="196" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B">80 ms</text>
  <rect x="528" y="118" width="80" height="96" rx="4" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="latency-segment" data-index="2" data-value="20"/>
  <text x="540" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">首包</text>
  <text x="540" y="196" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B">20 ms</text>
  <rect x="608" y="118" width="400" height="96" rx="4" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="latency-segment" data-index="3" data-value="100"/>
  <text x="620" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">5×decode</text>
  <text x="620" y="196" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B">100 ms</text>
  <text x="48" y="258" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">TTFT = queue 40 + prefill 80 + first packet 20 = 140 ms</text>
  <text x="48" y="298" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">TTFT 140 ms　|　E2E = 240 ms　|　TPOT = 20 ms</text>
  <rect x="48" y="330" width="1104" height="308" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
  <text x="64" y="364" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">排序 rank 1→20 · rank 19 · P95 = 280 ms · rank 20 · max = 500 ms</text>
  <g data-region="latency-rank-plot" data-origin-x="64" data-scale="54" aria-label="按 rank 排序的二十个延迟样本">
    <rect x="64" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="1" data-value="100"/>
    <text x="66" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">100</text>
    <rect x="118" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="2" data-value="110"/>
    <text x="120" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">110</text>
    <rect x="172" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="3" data-value="120"/>
    <text x="174" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">120</text>
    <rect x="226" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="4" data-value="130"/>
    <text x="228" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">130</text>
    <rect x="280" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="5" data-value="140"/>
    <text x="282" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">140</text>
    <rect x="334" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="6" data-value="150"/>
    <text x="336" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">150</text>
    <rect x="388" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="7" data-value="160"/>
    <text x="390" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">160</text>
    <rect x="442" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="8" data-value="170"/>
    <text x="444" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">170</text>
    <rect x="496" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="9" data-value="180"/>
    <text x="498" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">180</text>
    <rect x="550" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="10" data-value="190"/>
    <text x="552" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">190</text>
    <rect x="604" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="11" data-value="200"/>
    <text x="606" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">200</text>
    <rect x="658" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="12" data-value="210"/>
    <text x="660" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">210</text>
    <rect x="712" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="13" data-value="220"/>
    <text x="714" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">220</text>
    <rect x="766" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="14" data-value="230"/>
    <text x="768" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">230</text>
    <rect x="820" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="15" data-value="240"/>
    <text x="822" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">240</text>
    <rect x="874" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="16" data-value="250"/>
    <text x="876" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">250</text>
    <rect x="928" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="17" data-value="260"/>
    <text x="930" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">260</text>
    <rect x="982" y="378" width="50" height="42" rx="4" fill="#E9F2EE" stroke="#315C9B" stroke-width="2" data-region="latency-rank-point" data-index="18" data-value="270"/>
    <text x="984" y="408" font-family="Trebuchet MS" font-size="26" fill="#18212B">270</text>
    <rect x="1036" y="378" width="50" height="42" rx="4" fill="#FFF3D5" stroke="#A33A24" stroke-width="3" data-region="latency-rank-point" data-index="19" data-value="280"/>
    <text x="1038" y="408" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">280</text>
    <rect x="1090" y="378" width="50" height="42" rx="4" fill="url(#hatch)" stroke="#A33A24" stroke-width="3" data-region="latency-rank-point" data-index="20" data-value="500"/>
    <text x="1092" y="408" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">500</text>
  </g>
  <line x1="1036" y1="370" x2="1036" y2="428" stroke="#A33A24" stroke-width="4" data-region="p95-marker" data-index="19" data-value="280"/>
  <text x="64" y="454" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">rank 轴：左低右高；每格显示该 rank 的延迟毫秒值</text>
  <g data-region="latency-diagnostic-row" data-row="0"><text x="72" y="490" font-family="Trebuchet MS" font-size="26" fill="#18212B">Queue 高 → queue_ms → 限流 / 扩容 / 调度</text></g>
  <g data-region="latency-diagnostic-row" data-row="1"><text x="72" y="526" font-family="Trebuchet MS" font-size="26" fill="#18212B">Prefill 慢 → prefill_ms → 缩输入 / prefix cache</text></g>
  <g data-region="latency-diagnostic-row" data-row="2"><text x="72" y="562" font-family="Trebuchet MS" font-size="26" fill="#18212B">Decode 慢 → TPOT → batching / KV cache / 小模型</text></g>
  <g data-region="latency-diagnostic-row" data-row="3"><text x="72" y="598" font-family="Trebuchet MS" font-size="26" fill="#18212B">P95 尾异常 → 分桶 P95 → 查长请求 / 冷启动 / 争用</text></g>
  <text x="72" y="630" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">Rounding：毫秒整数；P95 不插值。</text>
</svg>
