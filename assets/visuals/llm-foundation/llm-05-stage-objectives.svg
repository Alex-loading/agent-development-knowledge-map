<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="stages-title stages-desc">
<title id="stages-title">相邻阶段，不同数据与直接目标</title><desc id="stages-desc">横向比较预训练、继续预训练与 SFT 的数据、目标和边界。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
<text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B" >相邻阶段，不同数据与直接目标</text>
<rect x="48" y="86" width="170" height="64" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="base-model"/><text x="66" y="127" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >基础起点</text><rect x="278" y="86" width="220" height="64" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="pretraining"/><text x="296" y="127" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >I 预训练</text><rect x="558" y="86" width="250" height="64" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="continued-pretraining"/><text x="576" y="127" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >II 继续预训练</text><rect x="868" y="86" width="220" height="64" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="sft"/><text x="886" y="127" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >III SFT</text>
<line data-region="teaching-edge" data-edge="base-pretrain" x1="218" y1="118" x2="278" y2="118" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/><line data-region="teaching-edge" data-edge="pretrain-continue" x1="498" y1="118" x2="558" y2="118" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/><line data-region="teaching-edge" data-edge="continue-sft" x1="808" y1="118" x2="868" y2="118" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/><line data-region="teaching-edge" data-edge="sft-evaluate" x1="978" y1="150" x2="978" y2="500" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="206" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" >数据</text><text x="48" y="310" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" >直接目标</text><text x="48" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >不能自动保证</text>
<rect x="278" y="174" width="220" height="70" rx="16" fill="#FFFFFF" stroke="#18212B" stroke-width="3" /><text x="296" y="216" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >大规模原始文本</text>
<rect x="558" y="174" width="250" height="70" rx="16" fill="#FFFFFF" stroke="#18212B" stroke-width="3" /><text x="578" y="216" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >领域连续文本</text>
<rect x="868" y="174" width="220" height="70" rx="16" fill="#FFFFFF" stroke="#18212B" stroke-width="3" /><text x="888" y="216" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >输入 → 示范输出</text>
<rect x="278" y="278" width="220" height="70" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" /><text x="296" y="320" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >下一 token</text>
<rect x="558" y="278" width="250" height="70" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" /><text x="578" y="320" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >仍是下一 token</text>
<rect x="868" y="278" width="220" height="70" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" /><text x="888" y="320" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >任务行为 / 格式</text>
<rect x="278" y="382" width="220" height="96" rx="16" fill="#F4E8EB" stroke="#18212B" stroke-width="3" /><text x="296" y="420" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >事实出处</text><text x="296" y="454" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >权限与版本</text>
<rect x="558" y="382" width="250" height="96" rx="16" fill="#F4E8EB" stroke="#18212B" stroke-width="3" /><text x="578" y="420" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >可靠灌入知识</text><text x="578" y="454" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >无回归退化</text>
<rect x="868" y="382" width="220" height="96" rx="16" fill="#F4E8EB" stroke="#18212B" stroke-width="3" /><text x="888" y="420" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >基础能力补齐</text><text x="888" y="454" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >事实正确</text>
<rect x="808" y="500" width="280" height="64" rx="16" fill="#F4E8EB" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="evaluation"/><text x="826" y="541" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >留出集 + 回归评测</text>
<text x="48" y="604" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >阶段名称相邻 ≠ 优化目标相同；SFT 用示范塑造行为，不是简单继续喂文本。</text></svg>
