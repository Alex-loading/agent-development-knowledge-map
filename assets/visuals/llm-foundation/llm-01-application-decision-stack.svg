<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="decision-title decision-desc">
  <title id="decision-title">Agent 失败的分层诊断与模型改动证据门</title>
  <desc id="decision-desc">从用户症状开始，沿调用链依次检查应用层、模型服务层与模型层的基础模型能力。可复现评测证据门位于三层定位之后，修复选择位于证据门之后；只有充分上下文和正确流程下仍可复现模型能力瓶颈，才进入换模型或微调。</desc>
  <defs>
    <marker id="decision-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#1d4ed8"/>
    </marker>
    <pattern id="gate-hatch" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="14" height="14" fill="#fef3c7"/>
      <path d="M-3 3 L3 -3 M0 14 L14 0 M11 17 L17 11" fill="none" stroke="#d97706" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/>
  <text x="48" y="60" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#172554">回答失败：沿调用链定位，再选择修复</text>
  <rect x="48" y="88" width="1104" height="70" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="76" y="132" font-family="system-ui, sans-serif" font-size="29" font-weight="800" fill="#9a3412">① 用户症状：事实错 · 格式错 · 工具失败 · 延迟异常</text>

  <rect x="48" y="190" width="304" height="206" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="74" y="234" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#1e3a8a">② 应用层</text>
  <text x="74" y="278" font-family="system-ui, sans-serif" font-size="27" fill="#334155">输入 · 检索 · prompt</text>
  <text x="74" y="320" font-family="system-ui, sans-serif" font-size="27" fill="#334155">工具 · Schema 校验</text>
  <text x="74" y="366" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">观察：资料、参数、结果</text>
  <line x1="352" y1="292" x2="386" y2="292" stroke="#1d4ed8" stroke-width="5" marker-end="url(#decision-arrow)"/>

  <rect x="400" y="190" width="304" height="206" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="4"/>
  <text x="426" y="234" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#334155">③ 服务层</text>
  <text x="426" y="278" font-family="system-ui, sans-serif" font-size="27" fill="#334155">API · 运行 · 版本</text>
  <text x="426" y="320" font-family="system-ui, sans-serif" font-size="27" fill="#334155">超时 · 降级 · 可观测</text>
  <text x="426" y="366" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#334155">观察：错误、延迟、版本</text>
  <line x1="704" y1="292" x2="738" y2="292" stroke="#1d4ed8" stroke-width="5" marker-end="url(#decision-arrow)"/>

  <rect x="752" y="190" width="400" height="206" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
  <text x="778" y="234" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#4c1d95">④ 模型层</text>
  <rect x="778" y="258" width="348" height="74" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="810" y="304" font-family="system-ui, sans-serif" font-size="29" font-weight="800" fill="#4c1d95">基础模型 · 能力边界</text>
  <text x="778" y="370" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#4c1d95">充分上下文下仍失败？</text>

  <line x1="952" y1="396" x2="952" y2="424" stroke="#1d4ed8" stroke-width="5" marker-end="url(#decision-arrow)"/>
  <rect x="744" y="418" width="408" height="132" rx="22" fill="#fff7ed" stroke="#a16207" stroke-width="5"/>
  <text x="774" y="458" font-family="system-ui, sans-serif" font-size="29" font-weight="800" fill="#78350f">⑤ 评测证据门</text>
  <text x="774" y="500" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">可复现 · 流程正确</text>
  <text x="774" y="536" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">瓶颈确属基础模型</text>

  <line x1="744" y1="482" x2="454" y2="482" stroke="#64748b" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#decision-arrow)"/>
  <rect x="48" y="432" width="390" height="112" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="74" y="474" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#334155">未通过：回到应用 / 服务层</text>
  <text x="74" y="518" font-family="system-ui, sans-serif" font-size="26" fill="#334155">修检索、prompt、工具或运行</text>

  <line x1="952" y1="550" x2="952" y2="566" stroke="#a16207" stroke-width="6" marker-end="url(#decision-arrow)"/>
  <rect x="470" y="572" width="682" height="74" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
  <text x="496" y="618" font-family="system-ui, sans-serif" font-size="29" font-weight="800" fill="#4c1d95">⑥ 修复选择：换模型 / 微调 · 仅在证据门之后</text>
</svg>
