<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="decision-title decision-desc">
  <title id="decision-title">Agent 失败的分层诊断与模型改动证据门</title>
  <desc id="decision-desc">从用户症状开始，依次检查应用层、模型服务层和模型层。输入检索、prompt、工具与 Schema 校验修复在前，换模型或微调必须位于可复现评测证据门之后。分层诊断图只冻结结构、关系、边界与阅读顺序，不编码数值主张。</desc>
  <defs>
    <marker id="decision-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#1d4ed8"/>
    </marker>
    <pattern id="gate-hatch" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="14" height="14" fill="#fef3c7"/>
      <path d="M-3 3 L3 -3 M0 14 L14 0 M11 17 L17 11" fill="none" stroke="#d97706" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/>
  <text x="48" y="62" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#172554">回答失败，先修哪一层？</text>
  <rect x="48" y="98" width="1104" height="74" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="76" y="144" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#9a3412">⚠ 用户症状：事实错 · 格式错 · 工具失败 · 延迟异常</text>

  <rect x="48" y="198" width="514" height="294" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="76" y="242" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#1e3a8a">沿调用链定位</text>
  <rect x="76" y="266" width="458" height="60" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="98" y="305" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#172554">① 应用层 · 输入 / 检索 / prompt</text>
  <rect x="76" y="340" width="458" height="60" rx="14" fill="#ecfccb" stroke="#4d7c0f" stroke-width="3"/>
  <text x="98" y="379" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#365314">② 应用层 · 工具 / Schema 校验</text>
  <rect x="76" y="414" width="458" height="60" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
  <text x="98" y="453" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#334155">③ 服务层 · 运行 / 超时 / 版本</text>

  <line x1="562" y1="344" x2="620" y2="344" stroke="#1d4ed8" stroke-width="6" marker-end="url(#decision-arrow)"/>
  <rect x="636" y="198" width="516" height="294" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
  <text x="664" y="242" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#4c1d95">选择最靠近故障的修复</text>
  <text x="664" y="292" font-family="system-ui, sans-serif" font-size="27" fill="#334155">资料缺失 → 修文档版本与检索</text>
  <text x="664" y="336" font-family="system-ui, sans-serif" font-size="27" fill="#334155">格式不稳 → 修 prompt 与 Schema</text>
  <text x="664" y="380" font-family="system-ui, sans-serif" font-size="27" fill="#334155">计算错误 → 交给确定性工具</text>
  <text x="664" y="424" font-family="system-ui, sans-serif" font-size="27" fill="#334155">运行失败 → 修服务、超时与降级</text>
  <text x="664" y="468" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#4c1d95">每项修复 → 回归评测</text>

  <line x1="894" y1="492" x2="894" y2="520" stroke="#1d4ed8" stroke-width="6" marker-end="url(#decision-arrow)"/>
  <polygon points="530,568 682,510 834,568 682,626" fill="url(#gate-hatch)" stroke="#a16207" stroke-width="5"/>
  <text x="620" y="558" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#78350f">④ 证据门</text>
  <text x="610" y="600" font-family="system-ui, sans-serif" font-size="26" fill="#78350f">模型能力瓶颈？</text>
  <line x1="834" y1="568" x2="842" y2="568" stroke="#a16207" stroke-width="6" marker-end="url(#decision-arrow)"/>
  <rect x="856" y="518" width="296" height="102" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
  <text x="884" y="558" font-family="system-ui, sans-serif" font-size="29" font-weight="800" fill="#4c1d95">⑤ 换模型 / 微调</text>
  <text x="884" y="598" font-family="system-ui, sans-serif" font-size="26" fill="#4c1d95">仅在证据门之后</text>
  <line x1="530" y1="568" x2="420" y2="568" stroke="#64748b" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#decision-arrow)"/>
  <rect x="48" y="518" width="356" height="102" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="76" y="558" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#334155">未通过 → 回到应用链</text>
  <text x="76" y="598" font-family="system-ui, sans-serif" font-size="26" fill="#334155">充分上下文与正确流程先验证</text>
</svg>
