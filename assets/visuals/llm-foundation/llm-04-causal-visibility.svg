<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="cv-title cv-desc">
  <title id="cv-title">因果下三角可见性与未来泄漏</title>
  <desc id="cv-desc">四乘四网格展示 j 小于等于 i 的可见矩阵、逐行权重和错误全可见对照。</desc>
  <defs>
    <pattern id="cv-mask" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8B4A65" stroke-width="3"/>
    </pattern>
    <marker id="cv-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#18212B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">因果可见性：每一行只读自身与过去</text>
  <text x="918" y="50" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">教学示例 · 非实测</text>
  <text x="48" y="94" font-family="Trebuchet MS" font-size="26" fill="#18212B">n 4 · 0-based 规则 j≤i · 所有允许 score=0</text>

  <text x="180" y="146" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">K0　K1　K2　K3</text>
  <text x="70" y="222" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">Q0</text>
  <text x="70" y="294" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">Q1</text>
  <text x="70" y="366" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">Q2</text>
  <text x="70" y="438" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">Q3</text>
  <g data-region="causal-grid" data-origin-x="180" data-origin-y="180" data-cell-size="72">
    <rect data-region="visibility-cell" data-row="0" data-column="0" data-value="1" x="180" y="180" width="72" height="72" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="0" data-column="1" data-value="0" x="252" y="180" width="72" height="72" fill="url(#cv-mask)" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="0" data-column="2" data-value="0" x="324" y="180" width="72" height="72" fill="url(#cv-mask)" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="0" data-column="3" data-value="0" x="396" y="180" width="72" height="72" fill="url(#cv-mask)" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="1" data-column="0" data-value="1" x="180" y="252" width="72" height="72" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="1" data-column="1" data-value="1" x="252" y="252" width="72" height="72" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="1" data-column="2" data-value="0" x="324" y="252" width="72" height="72" fill="url(#cv-mask)" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="1" data-column="3" data-value="0" x="396" y="252" width="72" height="72" fill="url(#cv-mask)" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="2" data-column="0" data-value="1" x="180" y="324" width="72" height="72" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="2" data-column="1" data-value="1" x="252" y="324" width="72" height="72" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="2" data-column="2" data-value="1" x="324" y="324" width="72" height="72" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="2" data-column="3" data-value="0" x="396" y="324" width="72" height="72" fill="url(#cv-mask)" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="3" data-column="0" data-value="1" x="180" y="396" width="72" height="72" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="3" data-column="1" data-value="1" x="252" y="396" width="72" height="72" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="3" data-column="2" data-value="1" x="324" y="396" width="72" height="72" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
    <rect data-region="visibility-cell" data-row="3" data-column="3" data-value="1" x="396" y="396" width="72" height="72" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
  </g>
  <text x="202" y="224" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">1</text>
  <text x="274" y="224" font-family="Trebuchet MS" font-size="30" fill="#18212B">0</text>
  <text x="346" y="224" font-family="Trebuchet MS" font-size="30" fill="#18212B">0</text>
  <text x="418" y="224" font-family="Trebuchet MS" font-size="30" fill="#18212B">0</text>
  <text x="202" y="296" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">1</text>
  <text x="274" y="296" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">1</text>
  <text x="346" y="296" font-family="Trebuchet MS" font-size="30" fill="#18212B">0</text>
  <text x="418" y="296" font-family="Trebuchet MS" font-size="30" fill="#18212B">0</text>
  <text x="202" y="368" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">1</text>
  <text x="274" y="368" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">1</text>
  <text x="346" y="368" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">1</text>
  <text x="418" y="368" font-family="Trebuchet MS" font-size="30" fill="#18212B">0</text>
  <text x="202" y="440" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">1</text>
  <text x="274" y="440" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">1</text>
  <text x="346" y="440" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">1</text>
  <text x="418" y="440" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">1</text>

  <rect x="504" y="146" width="320" height="354" rx="20" fill="#FFFFFF" stroke="#315C9B" stroke-width="4"/>
  <text x="528" y="188" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#315C9B">逐行可见 softmax</text>
  <text x="528" y="236" font-family="Trebuchet MS" font-size="26" fill="#18212B">M0 1 0 0 0</text>
  <text x="528" y="274" font-family="Trebuchet MS" font-size="26" fill="#18212B">M1 1 1 0 0</text>
  <text x="528" y="312" font-family="Trebuchet MS" font-size="26" fill="#18212B">M2 1 1 1 0</text>
  <text x="528" y="350" font-family="Trebuchet MS" font-size="26" fill="#18212B">M3 1 1 1 1</text>
  <text x="528" y="398" font-family="Trebuchet MS" font-size="26" fill="#18212B">Q0 → 1.0000</text>
  <text x="528" y="432" font-family="Trebuchet MS" font-size="26" fill="#18212B">Q1 → 0.5000 ×2</text>
  <text x="528" y="466" font-family="Trebuchet MS" font-size="26" fill="#18212B">Q2 → 0.3333 ×3</text>
  <text x="528" y="496" font-family="Trebuchet MS" font-size="26" fill="#18212B">Q3 → 0.2500 ×4</text>

  <line x1="826" y1="322" x2="842" y2="322" stroke="#A33A24" stroke-width="5" marker-end="url(#cv-arrow)"/>
  <rect x="850" y="146" width="302" height="354" rx="20" fill="#F4E8EB" stroke="#A33A24" stroke-width="4"/>
  <text x="874" y="188" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#A33A24">错误对照：全可见</text>
  <text x="874" y="236" font-family="Trebuchet MS" font-size="30" fill="#18212B">1 1 1 1</text>
  <text x="874" y="278" font-family="Trebuchet MS" font-size="30" fill="#18212B">1 1 1 1</text>
  <text x="874" y="320" font-family="Trebuchet MS" font-size="30" fill="#18212B">1 1 1 1</text>
  <text x="874" y="362" font-family="Trebuchet MS" font-size="30" fill="#18212B">1 1 1 1</text>
  <text x="874" y="404" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">错误全可见</text>
  <text x="874" y="436" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">= 未来答案泄漏</text>
  <text x="874" y="476" font-family="Trebuchet MS" font-size="26" fill="#18212B">训练偷看后续 token</text>

  <rect x="48" y="514" width="1104" height="130" rx="18" fill="#FFF3D5" stroke="#C58A10" stroke-width="3"/>
  <text x="70" y="544" font-family="Trebuchet MS" font-size="26" fill="#18212B">Method：0-based 规则 j≤i 生成嵌套 0/1 可见矩阵；逐行仅对可见位置 softmax。</text>
  <text x="70" y="574" font-family="Trebuchet MS" font-size="26" fill="#18212B">W0 1.0000 / 0.0000 / 0.0000 / 0.0000</text>
  <text x="610" y="574" font-family="Trebuchet MS" font-size="26" fill="#18212B">W1 0.5000 / 0.5000 / 0.0000 / 0.0000</text>
  <text x="70" y="606" font-family="Trebuchet MS" font-size="26" fill="#18212B">W2 0.3333 / 0.3333 / 0.3333 / 0.0000</text>
  <text x="610" y="606" font-family="Trebuchet MS" font-size="26" fill="#18212B">W3 0.2500 / 0.2500 / 0.2500 / 0.2500</text>
  <text x="70" y="636" font-family="Trebuchet MS" font-size="26" fill="#18212B">Rounding：权重四位小数；矩阵元素为整数 0/1。</text>
  <text x="730" y="636" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">错误全可见 = 未来答案泄漏</text>
</svg>
