<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="generation-step-4-title generation-step-4-desc">
  <title id="generation-step-4-title">采样链 · 步骤 4/5</title>
  <desc id="generation-step-4-desc">完整保留 softmax 概率条，再增加 A、B 的 nucleus 重归一化区间。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker></defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">采样链 · 步骤 4/5</text>
  <g data-region="phase-raw" data-phase="raw" data-state="active">
    <rect x="48" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="raw" data-state="active"/>
    <text x="66" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="raw" data-state="active">1 RAW</text>
    <text x="66" y="210" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="raw" data-state="active">C 0.0000</text>
    <text x="66" y="258" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="raw" data-state="active">A 2.0000</text>
    <text x="66" y="306" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="raw" data-state="active">B 1.0000</text>
    <text x="66" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="raw" data-state="active">步骤 1</text>
  </g>
  <g data-region="phase-temperature" data-phase="temperature" data-state="active">
    <rect x="270" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="temperature" data-state="active"/>
    <text x="288" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="temperature" data-state="active">2 SCALE T</text>
    <text x="288" y="210" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="temperature" data-state="active">T = 1</text>
    <text x="288" y="258" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="temperature" data-state="active">z/T = 0 / 2 / 1</text>
    <text x="288" y="306" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="temperature" data-state="active">顺序 C / A / B</text>
    <text x="288" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="temperature" data-state="active">步骤 2</text>
  </g>
  <g data-region="phase-softmax" data-phase="softmax" data-state="active">
    <rect x="492" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="softmax" data-state="active"/>
    <text x="510" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="softmax" data-state="active">3 SOFTMAX</text>
    <text x="510" y="210" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="softmax" data-state="active">C .0900</text>
    <text x="510" y="258" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="softmax" data-state="active">A .6652</text>
    <text x="510" y="306" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="softmax" data-state="active">B .2447</text>
    <rect data-region="generation-probability" data-token="C" data-value="0.09003057317038046" x="510" y="326" width="14.4049" height="12" fill="#315C9B"/>
    <rect data-region="generation-probability" data-token="A" data-value="0.6652409557748218" x="510" y="346" width="106.4386" height="12" fill="#315C9B"/>
    <rect data-region="generation-probability" data-token="B" data-value="0.24472847105479764" x="510" y="366" width="39.1566" height="12" fill="#315C9B"/>
    <text x="510" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="softmax" data-state="active">步骤 3</text>
  </g>
  <g data-region="phase-nucleus" data-phase="nucleus" data-state="active">
    <rect x="714" y="118" width="202" height="330" rx="16" fill="#FFF3D5" stroke="#C58A10" stroke-width="3" data-phase="nucleus" data-state="active"/>
    <text x="732" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="nucleus" data-state="active">4 NUCLEUS</text>
    <text x="732" y="210" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="nucleus" data-state="active">top-p = .8</text>
    <text x="732" y="258" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="nucleus" data-state="active">A + B = .9100</text>
    <text x="732" y="306" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="nucleus" data-state="active">renorm</text>
    <text x="732" y="354" font-family="Trebuchet MS" font-size="26" fill="#18212B" data-phase="nucleus" data-state="active">.7311 / .2689</text>
    <rect data-region="nucleus-member" data-token="A" data-value="0.7310585786300049" x="732" y="376" width="116.9694" height="12" fill="#1F7A78"/>
    <rect data-region="nucleus-member" data-token="B" data-value="0.2689414213699951" x="848.9694" y="376" width="43.0306" height="12" fill="#A33A24"/>
    <text x="732" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="nucleus" data-state="active">步骤 4</text>
  </g>
  <g data-region="phase-sample" data-phase="sample" data-state="placeholder">
    <rect x="936" y="118" width="202" height="330" rx="16" fill="#EEE9DC" stroke="#9B968D" stroke-width="3" data-phase="sample" data-state="placeholder"/>
    <text x="956" y="160" font-family="Trebuchet MS" font-size="26" fill="#6F6A61" data-phase="sample" data-state="placeholder">5 待解锁</text>
  </g>
  <path d="M251 108 H261 M261 101 L269 108 L261 115" fill="none" stroke="#18212B" stroke-width="4"/>
  <path d="M473 108 H483 M483 101 L491 108 L483 115" fill="none" stroke="#18212B" stroke-width="4"/>
  <path d="M695 108 H705 M705 101 L713 108 L705 115" fill="none" stroke="#18212B" stroke-width="4"/>
  <path d="M917 108 H927 M927 101 L935 108 L927 115" fill="none" stroke="#18212B" stroke-width="4"/>
  <rect x="48" y="488" width="1104" height="138" rx="16" fill="#FFFFFF" stroke="#1F7A78" stroke-width="3"/>
  <text x="72" y="528" font-family="Trebuchet MS" font-size="26" fill="#18212B">固定数值：C/A/B logits 0/2/1；T=1；top-p=.8；u=.7。</text>
  <text x="72" y="566" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">stable softmax → 最小 nucleus → 集合内重归一化 → 逆 CDF 抽样。</text>
  <text x="72" y="604" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">概率四位小数；累计比较使用未舍入值。教学示例 · 非实测</text>
</svg>
