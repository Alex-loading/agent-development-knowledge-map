<text x="72" y="500" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" >参数更新：预训练 / SFT / 偏好目标；LoRA 只描述更新预算。</text>
<text x="72" y="540" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >上下文更新：RAG 提供新鲜、可引用、可做权限过滤的运行时证据。</text>
<text x="72" y="580" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >结论：先定义基础能力、稳定行为、知识新鲜度或证据需求，再选路线。</text>
<text x="72" y="614" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >训练不替代检索；RAG 也不是训练损失。</text></svg>
