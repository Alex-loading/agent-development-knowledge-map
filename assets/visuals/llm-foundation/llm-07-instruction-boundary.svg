<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">执行权属于模型外的安全门</title>
<desc id="desc">高层规则与用户、检索、工具输入进入模型形成提议；外部权限、参数校验和高风险确认依次通过后才执行，三条攻击虚线都被叉号阻断。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B766E"/></marker>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#49645E" stroke-width="3"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="675" fill="#F6F0E3"/>
<path d="M34 112 H1166" stroke="#18312D" stroke-width="2"/>
<text x="42" y="62" font-family="Avenir Next, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#18312D" text-anchor="start" >执行权属于模型外的安全门</text>
<rect x="35" y="132" width="290" height="435" rx="16" fill="url(#hatch)" stroke="#B94B42" stroke-width="3" /><text x="180" y="166" font-family="Avenir Next, PingFang SC, sans-serif" font-size="28" font-weight="800" fill="#B94B42" text-anchor="middle" >不可信输入区</text><rect x="65" y="195" width="230" height="72" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="trust-node" data-node="user-input"/><text x="180" y="225" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >用户输入</text><text x="180" y="259" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >直接注入</text><rect x="65" y="300" width="230" height="72" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="trust-node" data-node="retrieval-input"/><text x="180" y="330" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >检索文档</text><text x="180" y="364" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >间接注入</text><rect x="65" y="405" width="230" height="72" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="trust-node" data-node="tool-input"/><text x="180" y="435" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >工具结果</text><text x="180" y="469" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >间接注入</text><rect x="365" y="135" width="220" height="84" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="trust-node" data-node="high-level-rules"/><text x="475" y="171" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >高层规则</text><text x="475" y="205" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >表达优先级</text><rect x="365" y="285" width="220" height="100" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="trust-node" data-node="model-proposal"/><text x="475" y="329" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >模型提议</text><text x="475" y="363" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >不是授权</text><rect x="640" y="135" width="220" height="78" rx="14" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="trust-node" data-node="permission-gate"/><text x="750" y="182" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >① 外部权限</text><rect x="640" y="260" width="220" height="78" rx="14" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="trust-node" data-node="parameter-gate"/><text x="750" y="307" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >② 参数校验</text><rect x="640" y="385" width="220" height="78" rx="14" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="trust-node" data-node="confirmation-gate"/><text x="750" y="432" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >③ 高风险确认</text><rect x="930" y="278" width="220" height="100" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="trust-node" data-node="execute"/><text x="1040" y="322" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >✓ 执行动作</text><text x="1040" y="356" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >模型外系统</text><line x1="475" y1="219" x2="475" y2="280" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="allowed-edge" data-from="high-level-rules" data-to="model-proposal" data-edge="high-level-rules-model-proposal"/><line x1="295" y1="231" x2="360" y2="315" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="allowed-edge" data-from="user-input" data-to="model-proposal" data-edge="user-input-model-proposal"/><line x1="295" y1="336" x2="360" y2="336" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="allowed-edge" data-from="retrieval-input" data-to="model-proposal" data-edge="retrieval-input-model-proposal"/><line x1="295" y1="441" x2="360" y2="360" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="allowed-edge" data-from="tool-input" data-to="model-proposal" data-edge="tool-input-model-proposal"/><line x1="585" y1="315" x2="635" y2="174" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="allowed-edge" data-from="model-proposal" data-to="permission-gate" data-edge="model-proposal-permission-gate"/><line x1="750" y1="213" x2="750" y2="255" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="allowed-edge" data-from="permission-gate" data-to="parameter-gate" data-edge="permission-gate-parameter-gate"/><line x1="750" y1="338" x2="750" y2="380" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="allowed-edge" data-from="parameter-gate" data-to="confirmation-gate" data-edge="parameter-gate-confirmation-gate"/><line x1="860" y1="424" x2="925" y2="350" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="allowed-edge" data-from="confirmation-gate" data-to="execute" data-edge="confirmation-gate-execute"/><path d="M295 222 C390 120 860 115 925 300" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="attack-edge" data-from="user-input" data-to="execute" data-edge="user-input-execute"/><path d="M295 336 C420 505 820 505 925 326" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="attack-edge" data-from="retrieval-input" data-to="execute" data-edge="retrieval-input-execute"/><path d="M295 450 C430 560 860 560 925 352" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="attack-edge" data-from="tool-input" data-to="execute" data-edge="tool-input-execute"/><text x="915" y="300" font-family="Avenir Next, PingFang SC, sans-serif" font-size="30" font-weight="800" fill="#B94B42" text-anchor="middle" >×</text><text x="915" y="326" font-family="Avenir Next, PingFang SC, sans-serif" font-size="30" font-weight="800" fill="#B94B42" text-anchor="middle" >×</text><text x="915" y="352" font-family="Avenir Next, PingFang SC, sans-serif" font-size="30" font-weight="800" fill="#B94B42" text-anchor="middle" >×</text><text x="610" y="530" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#B94B42" text-anchor="middle" >× 攻击路径不可越过外部门</text><text x="600" y="620" font-family="Avenir Next, PingFang SC, sans-serif" font-size="28" font-weight="800" fill="#18312D" text-anchor="middle" >指令层级表达优先级；真正的安全边界在模型外。</text>
</svg>
