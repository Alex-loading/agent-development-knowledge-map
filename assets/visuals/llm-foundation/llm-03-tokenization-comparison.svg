<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="tok-title tok-desc">
  <title id="tok-title">固定教学 tokenizer 的分段对比</title>
  <desc id="tok-desc">三段原文在 longest-match 规则和 Unicode code point 规则下获得不同分段与计数。</desc>
  <defs>
    <pattern id="tok-stripe" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#315C9B" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">固定教学 tokenizer：同一原文，不同边界</text>
  <text x="842" y="50" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">不是生产模型测量</text>
  <rect x="48" y="76" width="1104" height="70" rx="16" fill="#FFFDF7" stroke="#18212B" stroke-width="3"/>
  <text x="68" y="112" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">A：longest-match　　B：Unicode code point　　Rounding：计数为整数。</text>
  <text x="68" y="140" font-family="Trebuchet MS" font-size="26" fill="#18212B">教学 tokenizer A / 教学 tokenizer B · 必须保存原文与规则版本</text>

  <text x="48" y="186" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#315C9B">原文 AI好</text>
  <g data-region="token-row" data-text-index="0" data-tokenizer="A" data-origin-x="240" data-scale="60">
    <rect data-region="token-segment" data-text-index="0" data-tokenizer="A" data-index="0" data-count="2" x="240" y="158" width="120" height="46" rx="10" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="0" data-tokenizer="A" data-index="1" data-count="1" x="360" y="158" width="60" height="46" rx="10" fill="#FFFFFF" stroke="#1F7A78" stroke-width="3" stroke-dasharray="8 5"/>
  </g>
  <text x="248" y="192" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">AI</text>
  <text x="374" y="192" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">好</text>
  <text x="460" y="192" font-family="Trebuchet MS" font-size="26" fill="#18212B">A AI / 好　计数 2 / 3</text>
  <g data-region="token-row" data-text-index="0" data-tokenizer="B" data-origin-x="240" data-scale="60">
    <rect data-region="token-segment" data-text-index="0" data-tokenizer="B" data-index="0" data-count="1" x="240" y="210" width="60" height="46" rx="10" fill="url(#tok-stripe)" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="0" data-tokenizer="B" data-index="1" data-count="1" x="300" y="210" width="60" height="46" rx="10" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="0" data-tokenizer="B" data-index="2" data-count="1" x="360" y="210" width="60" height="46" rx="10" fill="url(#tok-stripe)" stroke="#315C9B" stroke-width="3"/>
  </g>
  <text x="258" y="244" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">A</text>
  <text x="318" y="244" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">I</text>
  <text x="374" y="244" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">好</text>
  <text x="460" y="244" font-family="Trebuchet MS" font-size="26" fill="#18212B">B A / I / 好</text>

  <text x="48" y="302" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#315C9B">原文 {"x":1}</text>
  <g data-region="token-row" data-text-index="1" data-tokenizer="A" data-origin-x="240" data-scale="38">
    <rect data-region="token-segment" data-text-index="1" data-tokenizer="A" data-index="0" data-count="5" x="240" y="274" width="190" height="46" rx="10" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="1" data-tokenizer="A" data-index="1" data-count="1" x="430" y="274" width="38" height="46" rx="10" fill="#FFFFFF" stroke="#1F7A78" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="1" data-tokenizer="A" data-index="2" data-count="1" x="468" y="274" width="38" height="46" rx="10" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
  </g>
  <text x="252" y="308" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">{"x":</text>
  <text x="438" y="308" font-family="Trebuchet MS" font-size="26" fill="#18212B">1</text>
  <text x="476" y="308" font-family="Trebuchet MS" font-size="26" fill="#18212B">}</text>
  <text x="544" y="308" font-family="Trebuchet MS" font-size="26" fill="#18212B">A {"x": / 1 / }　计数 3 / 7</text>
  <g data-region="token-row" data-text-index="1" data-tokenizer="B" data-origin-x="240" data-scale="38">
    <rect data-region="token-segment" data-text-index="1" data-tokenizer="B" data-index="0" data-count="1" x="240" y="326" width="38" height="46" fill="url(#tok-stripe)" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="1" data-tokenizer="B" data-index="1" data-count="1" x="278" y="326" width="38" height="46" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="1" data-tokenizer="B" data-index="2" data-count="1" x="316" y="326" width="38" height="46" fill="url(#tok-stripe)" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="1" data-tokenizer="B" data-index="3" data-count="1" x="354" y="326" width="38" height="46" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="1" data-tokenizer="B" data-index="4" data-count="1" x="392" y="326" width="38" height="46" fill="url(#tok-stripe)" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="1" data-tokenizer="B" data-index="5" data-count="1" x="430" y="326" width="38" height="46" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="1" data-tokenizer="B" data-index="6" data-count="1" x="468" y="326" width="38" height="46" fill="url(#tok-stripe)" stroke="#315C9B" stroke-width="3"/>
  </g>
  <text x="252" y="360" font-family="Trebuchet MS" font-size="26" fill="#18212B">{</text>
  <text x="286" y="360" font-family="Trebuchet MS" font-size="26" fill="#18212B">"</text>
  <text x="324" y="360" font-family="Trebuchet MS" font-size="26" fill="#18212B">x</text>
  <text x="362" y="360" font-family="Trebuchet MS" font-size="26" fill="#18212B">"</text>
  <text x="400" y="360" font-family="Trebuchet MS" font-size="26" fill="#18212B">:</text>
  <text x="438" y="360" font-family="Trebuchet MS" font-size="26" fill="#18212B">1</text>
  <text x="476" y="360" font-family="Trebuchet MS" font-size="26" fill="#18212B">}</text>
  <text x="544" y="360" font-family="Trebuchet MS" font-size="26" fill="#18212B">B { / " / x / " / : / 1 / }</text>

  <text x="48" y="430" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#315C9B">原文 x+=1</text>
  <g data-region="token-row" data-text-index="2" data-tokenizer="A" data-origin-x="240" data-scale="55">
    <rect data-region="token-segment" data-text-index="2" data-tokenizer="A" data-index="0" data-count="1" x="240" y="402" width="55" height="46" rx="10" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="2" data-tokenizer="A" data-index="1" data-count="2" x="295" y="402" width="110" height="46" rx="10" fill="#FFFFFF" stroke="#1F7A78" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="2" data-tokenizer="A" data-index="2" data-count="1" x="405" y="402" width="55" height="46" rx="10" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
  </g>
  <text x="256" y="436" font-family="Trebuchet MS" font-size="26" fill="#18212B">x</text>
  <text x="328" y="436" font-family="Trebuchet MS" font-size="26" fill="#18212B">+=</text>
  <text x="422" y="436" font-family="Trebuchet MS" font-size="26" fill="#18212B">1</text>
  <text x="500" y="436" font-family="Trebuchet MS" font-size="26" fill="#18212B">A x / += / 1　计数 3 / 4</text>
  <g data-region="token-row" data-text-index="2" data-tokenizer="B" data-origin-x="240" data-scale="55">
    <rect data-region="token-segment" data-text-index="2" data-tokenizer="B" data-index="0" data-count="1" x="240" y="454" width="55" height="46" fill="url(#tok-stripe)" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="2" data-tokenizer="B" data-index="1" data-count="1" x="295" y="454" width="55" height="46" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="2" data-tokenizer="B" data-index="2" data-count="1" x="350" y="454" width="55" height="46" fill="url(#tok-stripe)" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="token-segment" data-text-index="2" data-tokenizer="B" data-index="3" data-count="1" x="405" y="454" width="55" height="46" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
  </g>
  <text x="256" y="488" font-family="Trebuchet MS" font-size="26" fill="#18212B">x</text>
  <text x="312" y="488" font-family="Trebuchet MS" font-size="26" fill="#18212B">+</text>
  <text x="367" y="488" font-family="Trebuchet MS" font-size="26" fill="#18212B">=</text>
  <text x="422" y="488" font-family="Trebuchet MS" font-size="26" fill="#18212B">1</text>
  <text x="500" y="488" font-family="Trebuchet MS" font-size="26" fill="#18212B">B x / + / = / 1</text>

  <rect x="48" y="526" width="1104" height="114" rx="18" fill="#FFF3D5" stroke="#C58A10" stroke-width="3"/>
  <text x="70" y="565" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">教学 tokenizer A 词表：AI 1　好 2　{"x": 3　1 4　} 5　x 6　+= 7</text>
  <text x="70" y="603" font-family="Trebuchet MS" font-size="26" fill="#18212B">A 8　I 9　+ 10　= 11　Method：从原文执行 longest-match / code point</text>
  <text x="70" y="634" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">边界结论：固定比例不可外推；目标模型预算必须实测。</text>
</svg>
