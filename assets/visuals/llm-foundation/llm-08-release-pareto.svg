<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">先守安全硬门，再在两个独立坐标系判断 Pareto</title>
  <desc id="desc">A 到 E 指标表先以安全百分之九十九点五淘汰 C；质量成本与质量 P95 两面板共享候选编号，B 支配 D，A B E 非支配，不合成综合分。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0B766E"/>
    </marker>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#49645E" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F6F0E3"/>
  <path d="M34 112 H1166" stroke="#18312D" stroke-width="2"/>
  <text x="42" y="62" font-family="Avenir Next, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#18312D" text-anchor="start">先守安全硬门，再在两个独立坐标系判断 Pareto</text>
  <text x="35" y="140" font-family="Avenir Next, PingFang SC, sans-serif" font-size="28" font-weight="800" fill="#B94B42" text-anchor="start">① 安全硬门 99.5%</text>
  <rect x="35" y="155" width="385" height="430" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="2"/>
  <text x="55" y="190" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="start">候选   质量   安全   成本   P95</text>
  <rect x="50" y="215" width="355" height="48" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="pareto-table-row" data-node="A" data-kind="eligible" data-value="82|99.7|1|450" data-index="0"/>
  <text x="228" y="247" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">A  82.0  99.7  1.0  450</text>
  <rect x="50" y="273" width="355" height="48" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="pareto-table-row" data-node="B" data-kind="eligible" data-value="88|99.8|2|700" data-index="1"/>
  <text x="228" y="305" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">B  88.0  99.8  2.0  700</text>
  <rect x="50" y="331" width="355" height="48" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="pareto-table-row" data-node="C" data-kind="rejected" data-value="86|99.4|1.5|500" data-index="2"/>
  <text x="228" y="363" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">C  86.0  99.4  1.5  500</text>
  <rect x="50" y="389" width="355" height="48" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="pareto-table-row" data-node="D" data-kind="eligible" data-value="88|99.8|2.4|850" data-index="3"/>
  <text x="228" y="421" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">D  88.0  99.8  2.4  850</text>
  <rect x="50" y="447" width="355" height="48" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="pareto-table-row" data-node="E" data-kind="eligible" data-value="91|99.6|3.4|1100" data-index="4"/>
  <text x="228" y="479" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">E  91.0  99.6  3.4  1100</text>
  <text x="55" y="525" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#B94B42" text-anchor="start">Input：A–E · safety gate 99.5%</text>
  <text x="55" y="562" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#B94B42" text-anchor="start">Result：C 淘汰 · B dominates D</text>
