  <text x="617" y="438" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="start">B</text>
  <circle cx="602.5" cy="448.33333333333337" r="19" fill="none" stroke="#D58B28" stroke-width="2"/>
  <polygon points="647.5,436.33333333333337 659.5,458.33333333333337 635.5,458.33333333333337" fill="#CDE9DF" stroke="#0B766E" stroke-width="3" data-region="pareto-point" data-node="D" data-stage="quality-cost" data-value="2.4" data-count="88" data-kind="dominated" data-origin-x="647.5" data-origin-y="448.33333333333337"/>
