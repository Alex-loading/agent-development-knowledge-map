  <text x="774" y="375" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="start">E</text>
  <circle cx="760" cy="385" r="19" fill="none" stroke="#D58B28" stroke-width="2"/>
  <text x="840" y="150" font-family="Avenir Next, PingFang SC, sans-serif" font-size="28" font-weight="800" fill="#0B766E" text-anchor="start">③ 质量–P95</text>
  <line x1="840" y1="575" x2="1110" y2="575" stroke="#18312D" stroke-width="3"/>
  <line x1="840" y1="575" x2="840" y2="385" stroke="#18312D" stroke-width="3"/>
  <text x="975" y="615" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#49645E" text-anchor="middle">P95 ms</text>
  <text x="832" y="370" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#49645E" text-anchor="end">质量</text>
  <circle cx="840" cy="575" r="10" fill="#CDE9DF" stroke="#0B766E" stroke-width="3" data-region="pareto-point" data-node="A" data-stage="quality-latency" data-value="450" data-count="82" data-kind="non-dominated" data-origin-x="840" data-origin-y="575"/>
  <text x="854" y="565" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="start">A</text>
  <circle cx="840" cy="575" r="19" fill="none" stroke="#D58B28" stroke-width="2"/>
  <rect x="933.8461538461538" y="438.33333333333337" width="20" height="20" rx="2" fill="#CDE9DF" stroke="#0B766E" stroke-width="3" data-region="pareto-point" data-node="B" data-stage="quality-latency" data-value="700" data-count="88" data-kind="non-dominated" data-origin-x="943.8461538461538" data-origin-y="448.33333333333337"/>
  <text x="958" y="438" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="start">B</text>
  <circle cx="943.8461538461538" cy="448.33333333333337" r="19" fill="none" stroke="#D58B28" stroke-width="2"/>
  <polygon points="1006.1538461538462,436.33333333333337 1018.1538461538462,458.33333333333337 994.1538461538462,458.33333333333337" fill="#CDE9DF" stroke="#0B766E" stroke-width="3" data-region="pareto-point" data-node="D" data-stage="quality-latency" data-value="850" data-count="88" data-kind="dominated" data-origin-x="1006.1538461538462" data-origin-y="448.33333333333337"/>
  <text x="1020" y="438" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="start">D</text>
  <polygon points="1100,379 1110,373 1120,379 1120,391 1110,397 1100,391" fill="#CDE9DF" stroke="#0B766E" stroke-width="3" data-region="pareto-point" data-node="E" data-stage="quality-latency" data-value="1100" data-count="91" data-kind="non-dominated" data-origin-x="1110" data-origin-y="385"/>
  <text x="1124" y="375" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="start">E</text>
  <circle cx="1110" cy="385" r="19" fill="none" stroke="#D58B28" stroke-width="2"/>
  <text x="490" y="310" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#49645E" text-anchor="start">Method：先安全过滤，再判断 dominance</text>
  <text x="490" y="350" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#49645E" text-anchor="start">Rounding：质量安全成本一位；P95 整数</text>
  <text x="55" y="600" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#B94B42" text-anchor="start">C：safety rejected，未进入面板</text>
  <path d="M614 448 L636 448" stroke="#B94B42" stroke-width="3" marker-end="url(#arrow)" data-region="dominance-edge" data-from="B" data-to="D" data-edge="B-D"/>
  <text x="625" y="425" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#B94B42" text-anchor="middle">B 支配 D</text>
  <text x="600" y="638" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="middle">A / B / E 非支配 · 两面板独立单位 · 不制造综合分</text>
</svg>
