  <line data-region="direction-2" x1="540" y1="324" x2="560" y2="324" stroke="#18212B" stroke-width="4" marker-end="url(#sms4-arrow)"/>
  <rect x="48" y="584" width="1104" height="60" rx="16" fill="#18212B"/>
  <text x="70" y="623" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#FFFFFF">步骤 3：scaled 0.000 / 0.693 / 9.000 → mask 未来格 → weights 0.333 / 0.667 / 0.000。</text>
