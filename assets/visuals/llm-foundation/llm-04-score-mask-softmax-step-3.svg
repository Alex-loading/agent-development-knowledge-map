<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="sms4-title sms4-desc">
  <title id="sms4-title">步骤三：保留 QKV 与 raw，追加 scale、mask 和 softmax</title>
  <desc id="sms4-desc">固定布局保留步骤一和步骤二的完整结构，第三阶段追加三个完整一乘三矩阵，最终聚合阶段仍为占位。</desc>
  <defs>
    <pattern id="sms4-mask" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/>
    </pattern>
    <marker id="sms4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="48" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">步骤 3 / 4 · 累计 QKV + raw + normalize</text>
  <text x="958" y="48" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">教学示例 · 非实测</text>

