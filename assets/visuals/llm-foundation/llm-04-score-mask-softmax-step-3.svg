      <text x="730" y="282" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#8B4A65">k1</text>
      <text x="810" y="282" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#8B4A65">k2</text>
      <text x="578" y="329" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">q0</text>
