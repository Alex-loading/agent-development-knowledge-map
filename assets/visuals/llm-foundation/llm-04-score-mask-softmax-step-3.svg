      <text x="578" y="457" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">q0</text>
      <rect data-region="attention-cell" data-phase="normalize" data-state="active" data-stage="weights" data-row="0" data-column="0" data-value="0.3333333333333333" x="632" y="422" width="80" height="52" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
      <rect data-region="attention-cell" data-phase="normalize" data-state="active" data-stage="weights" data-row="0" data-column="1" data-value="0.6666666666666666" x="712" y="422" width="80" height="52" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
      <rect data-region="attention-cell" data-phase="normalize" data-state="active" data-stage="weights" data-row="0" data-column="2" data-value="0" x="792" y="422" width="80" height="52" fill="#F4E8EB" stroke="#A33A24" stroke-width="3"/>
      <text x="644" y="457" font-family="Trebuchet MS" font-size="26" fill="#18212B">.333</text>
      <text x="724" y="457" font-family="Trebuchet MS" font-size="26" fill="#18212B">.667</text>
      <text x="820" y="457" font-family="Trebuchet MS" font-size="26" fill="#18212B">0</text>
