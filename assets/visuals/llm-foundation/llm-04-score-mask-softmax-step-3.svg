    <text x="78" y="428" font-family="Trebuchet MS" font-size="26" fill="#18212B">V2 0.000 / 3.000</text>
    <text x="78" y="488" font-family="Trebuchet MS" font-size="26" fill="#18212B">V3 9.000 / 9.000</text>
