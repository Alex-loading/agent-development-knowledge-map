      <text x="730" y="162" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#8B4A65">k1</text>
      <text x="810" y="162" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#8B4A65">k2</text>
      <text x="578" y="205" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">q0</text>
      <rect data-region="attention-cell" data-phase="normalize" data-state="active" data-stage="scaled" data-row="0" data-column="0" data-value="0" x="632" y="170" width="80" height="52" fill="#FFFFFF" stroke="#18212B" stroke-width="3"/>
      <rect data-region="attention-cell" data-phase="normalize" data-state="active" data-stage="scaled" data-row="0" data-column="1" data-value="0.6931471805599453" x="712" y="170" width="80" height="52" fill="#FFFFFF" stroke="#18212B" stroke-width="3"/>
      <rect data-region="attention-cell" data-phase="normalize" data-state="active" data-stage="scaled" data-row="0" data-column="2" data-value="9" x="792" y="170" width="80" height="52" fill="#FFFFFF" stroke="#18212B" stroke-width="3"/>
