  <text x="48" y="48" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">QK → scale → causal mask → softmax → ΣV</text>
  <text x="918" y="48" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">教学示例 · 非实测</text>

