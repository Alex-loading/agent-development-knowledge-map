<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="sms-title sms-desc">
  <title id="sms-title">raw、scaled、masked、softmax 四个一乘三矩阵与 Value 聚合</title>
  <desc id="sms-desc">同一 q0 行依次展示 raw QK、除以根号 d_k、因果掩码与 softmax 权重四个完整矩阵，最后独立聚合三个 Value 得到二维输出。</desc>
