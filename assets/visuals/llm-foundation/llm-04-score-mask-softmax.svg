  <text x="292" y="314" font-family="Trebuchet MS" font-size="26" fill="#18212B">除以 sqrt(d_k)</text>

  <rect x="492" y="78" width="210" height="252" rx="18" fill="#F4E8EB" stroke="#8B4A65" stroke-width="4"/>
