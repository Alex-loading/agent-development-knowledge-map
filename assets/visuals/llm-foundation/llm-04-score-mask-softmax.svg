    <text x="638" y="195" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">−∞</text>
  </g>
  <text x="514" y="250" font-family="Trebuchet MS" font-size="26" fill="#18212B">0 / .693 / −∞</text>
  <text x="514" y="282" font-family="Trebuchet MS" font-size="26" fill="#A33A24">未来索引 2</text>
  <text x="514" y="314" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">先排除未来格</text>

  <rect x="714" y="78" width="210" height="252" rx="18" fill="#E9F2EE" stroke="#1F7A78" stroke-width="4"/>
