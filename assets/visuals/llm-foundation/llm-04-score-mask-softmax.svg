      <line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/>
    </pattern>
    <marker id="sms-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/>
    </marker>
  </defs>
