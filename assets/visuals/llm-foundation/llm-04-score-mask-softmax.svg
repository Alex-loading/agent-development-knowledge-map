  <rect x="48" y="350" width="1104" height="298" rx="20" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
  <text x="70" y="386" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#315C9B">同一 q0 行的可重算链</text>
  <text x="70" y="422" font-family="Trebuchet MS" font-size="26" fill="#18212B">Input：raw QK 0.000 / 1.386 / 18.000；d_k 4；未来索引 2</text>
  <text x="70" y="458" font-family="Trebuchet MS" font-size="26" fill="#18212B">Method：除以 sqrt(d_k) → softmax 前 mask → stable softmax → 按权重乘 V</text>
  <text x="70" y="494" font-family="Trebuchet MS" font-size="26" fill="#18212B">scaled 0.000 / 0.693 / 9.000　masked 0.000 / 0.693 / −∞</text>
  <text x="70" y="530" font-family="Trebuchet MS" font-size="26" fill="#18212B">weights 0.333 / 0.667 / 0.000　output 0.333 / 2.000</text>
  <text x="70" y="566" font-family="Trebuchet MS" font-size="26" fill="#18212B">V1 1.000 / 0.000　V2 0.000 / 3.000　V3 9.000 / 9.000</text>
  <text x="70" y="602" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">Rounding：权重与输出三位小数；-Infinity 原样。</text>
  <text x="70" y="638" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">结论：先 mask 再归一；Q/K 决定权重，真正被汇总的是 Value。</text>
