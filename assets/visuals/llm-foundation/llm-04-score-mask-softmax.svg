  <rect x="936" y="78" width="216" height="252" rx="18" fill="#FFFFFF" stroke="#18212B" stroke-width="4"/>
  <text x="958" y="112" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#18212B">5 ΣV output</text>
  <text x="958" y="144" font-family="Trebuchet MS" font-size="26" fill="#18212B">V1 [1, 0]</text>
  <text x="958" y="176" font-family="Trebuchet MS" font-size="26" fill="#18212B">V2 [0, 3]</text>
  <text x="958" y="208" font-family="Trebuchet MS" font-size="26" fill="#18212B">V3 [9, 9]</text>
