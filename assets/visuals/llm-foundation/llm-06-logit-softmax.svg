<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="softmax-title softmax-desc">
<title id="softmax-title">Logits → stable softmax → 当前步概率</title><desc id="softmax-desc">三个候选展示 logits、减最大值指数、概率与平移不变边界。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
<text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B" >Logits → stable softmax → 当前步概率</text>
<text x="48" y="88" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >教学示例 · 非实测</text>
<text x="48" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >候选</text><text x="230" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >logit z</text><text x="420" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >exp(z−max)</text><text x="650" y="132" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >probability</text>
<rect x="48" y="158" width="800" height="70" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3" data-region="softmax-row" data-row="0"/><text x="72" y="203" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >A</text><text x="252" y="203" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >2</text><text x="440" y="203" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >1.0000</text><rect x="650" y="175" width="173" height="36" rx="6" fill="#1F7A78" stroke="#18212B" stroke-width="3" data-region="probability-bar" data-index="0" data-value="0.6652409557748218"/><text x="878" y="203" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0.6652</text><rect x="48" y="250" width="800" height="70" rx="16" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="softmax-row" data-row="1"/><text x="72" y="295" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >B</text><text x="252" y="295" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >1</text><text x="440" y="295" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.3679</text><rect x="650" y="267" width="64" height="36" rx="6" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="probability-bar" data-index="1" data-value="0.24472847105479764"/><text x="878" y="295" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0.2447</text><rect x="48" y="342" width="800" height="70" rx="16" fill="#FFFFFF" stroke="#18212B" stroke-width="3" data-region="softmax-row" data-row="2"/><text x="72" y="387" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >C</text><text x="252" y="387" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0</text><text x="440" y="387" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.1353</text><rect x="650" y="359" width="23" height="36" rx="6" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="probability-bar" data-index="2" data-value="0.09003057317038046"/><text x="878" y="387" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >0.0900</text>
<rect x="48" y="470" width="1104" height="160" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" /><text x="72" y="510" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Input：候选 A/B/C logits=[2,1,0]。</text><text x="72" y="546" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Method：减最大值的 stable softmax；exp = 1.0000 / 0.3679 / 0.1353。</text><text x="72" y="582" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >Result：probabilities 0.6652 / 0.2447 / 0.0900；sum = 1.0000；greedy = A。</text><text x="72" y="616" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >Rounding：指数与概率四位小数。整体平移 logits 不改变 softmax。</text></svg>
