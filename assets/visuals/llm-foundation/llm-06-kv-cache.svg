<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="kv-title kv-desc">
<title id="kv-title">KV Cache：少重算，显存换并发</title><desc id="kv-desc">无缓存重复前缀与缓存历史 K/V 对照，并按冻结公式显示容量。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
<text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B" >KV Cache：少重算，显存换并发</text>
<text x="48" y="88" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >无缓存：每步重算历史前缀</text><text x="48" y="252" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#1F7A78" >有缓存：读取历史 K/V，只追加当前 K/V</text>
<rect x="48" y="112" width="220" height="90" rx="16" fill="#F4E8EB" stroke="#A33A24" stroke-width="3" /><text x="68" y="150" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >decode 1</text><text x="68" y="184" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >重算 2 个位置</text><rect x="298" y="112" width="220" height="90" rx="16" fill="#F4E8EB" stroke="#A33A24" stroke-width="3" /><text x="318" y="150" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >decode 2</text><text x="318" y="184" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >重算 3 个位置</text><rect x="548" y="112" width="220" height="90" rx="16" fill="#F4E8EB" stroke="#A33A24" stroke-width="3" /><text x="568" y="150" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >decode 3</text><text x="568" y="184" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >重算 4 个位置</text>
<rect x="48" y="276" width="220" height="90" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3" data-region="kv-step" data-index="0"/><text x="68" y="314" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >decode 1</text><text x="68" y="348" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >读旧 K/V + 添新</text><rect x="298" y="276" width="220" height="90" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3" data-region="kv-step" data-index="1"/><text x="318" y="314" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >decode 2</text><text x="318" y="348" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >读旧 K/V + 添新</text><rect x="548" y="276" width="220" height="90" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3" data-region="kv-step" data-index="2"/><text x="568" y="314" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >decode 3</text><text x="568" y="348" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >读旧 K/V + 添新</text>
<rect x="822" y="112" width="330" height="254" rx="16" fill="#FFF3D5" stroke="#C58A10" stroke-width="3" /><text x="844" y="150" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#8A6510" >容量尺</text><text x="844" y="190" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >2 × layers × sequences</text><text x="844" y="226" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >× length × KV heads</text><text x="844" y="262" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >× head dim × bytes</text><text x="844" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >2×2×1×4×1×2×2</text><text x="844" y="342" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >= 64 bytes / seq</text>
<rect x="48" y="406" width="1104" height="218" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" /><text x="72" y="446" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Input：layers=2、length=4、KV heads=1、head dim=2、bytes=2、预算 576 bytes。</text><text x="72" y="484" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Method：2×layers×sequences×length×heads×dim×bytes；容量向下取整。</text><text x="72" y="522" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >Result：64 bytes/seq → 9 并发；长度翻倍 → 128 bytes/seq → 4 并发。</text><text x="72" y="560" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Rounding：bytes 与序列数为整数。实际实现还有分页、碎片、预留与元数据。</text><text x="72" y="598" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >KV Cache 保存每层历史 K/V，不是 Query、最终答案或 RAG。</text></svg>
