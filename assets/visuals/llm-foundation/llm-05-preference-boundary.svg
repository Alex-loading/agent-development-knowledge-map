<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="pref-title pref-desc">
<title id="pref-title">偏好是相对选择，不是全面真值</title><desc id="pref-desc">同一 prompt 产生回答 A 与 B，偏好标签形成优化信号并改变行为分布，右侧显示四个独立目标。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
<text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B" >偏好是相对选择，不是全面真值</text>
<rect x="48" y="104" width="170" height="64" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="prompt"/><text x="66" y="145" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >同一 prompt</text><rect x="286" y="70" width="190" height="64" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="answer-a"/><text x="304" y="111" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >回答 A ✓</text><rect x="286" y="158" width="190" height="64" rx="16" fill="#F4E8EB" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="answer-b"/><text x="304" y="199" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >回答 B ×</text>
<rect x="544" y="104" width="210" height="76" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="preference-label"/><text x="562" y="151" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >相对偏好标签</text><rect x="822" y="104" width="240" height="76" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="optimization-signal"/><text x="840" y="151" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >优化信号（多种算法）</text><rect x="822" y="228" width="240" height="76" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="behavior-distribution"/><text x="840" y="275" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >新行为分布</text>
<line data-region="teaching-edge" data-edge="prompt-a" x1="218" y1="136" x2="286" y2="102" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/><line data-region="teaching-edge" data-edge="prompt-b" x1="218" y1="136" x2="286" y2="190" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/><line data-region="teaching-edge" data-edge="answers-label" x1="476" y1="102" x2="544" y2="136" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/><line data-region="teaching-edge" data-edge="label-signal" x1="754" y1="142" x2="822" y2="142" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/><line data-region="teaching-edge" data-edge="signal-distribution" x1="942" y1="180" x2="942" y2="228" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="346" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#315C9B" >多目标边界：不能用一个 chosen 标签抹平四个维度</text>
<rect x="70" y="390" width="220" height="72" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="helpful"/><text x="88" y="435" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >有用 helpful</text><rect x="332" y="390" width="220" height="72" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="safe"/><text x="350" y="435" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >安全 safe</text><rect x="594" y="390" width="220" height="72" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="informative"/><text x="612" y="435" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >信息量 informative</text><rect x="856" y="390" width="220" height="72" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="calibrated"/><text x="874" y="435" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >校准 calibrated</text>
<rect x="48" y="506" width="1104" height="116" rx="16" fill="#FFFFFF" stroke="#A33A24" stroke-width="3" /><text x="72" y="548" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >偏好标签受标注群体、候选长度与风格影响；“更受偏好”不证明事实正确。</text><text x="72" y="590" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >RLHF 不是单一算法：奖励模型 + PPO 与 DPO 的中间结构不同。</text></svg>
