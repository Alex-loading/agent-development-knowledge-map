<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="pref-title pref-desc">
  <title id="pref-title">偏好学习先比较候选，再改变行为分布</title>
  <desc id="pref-desc">同一提示产生回答 A 与回答 B；两条带方向的路径汇入同一个配对比较节点，形成偏好标签与优化信号，改变行为分布，但多目标之间仍存在边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">偏好学习：比较候选，而不是判定绝对真值</text>

  <rect x="48" y="112" width="148" height="64" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="teaching-node" data-node="prompt"/>
  <text x="122" y="153" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">同一 prompt</text>

  <g data-region="teaching-node" data-node="answer-a">
    <rect x="240" y="68" width="160" height="64" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="preference-node" data-node="answer-a"/>
    <text x="320" y="107" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">回答 A</text>
  </g>
  <g data-region="teaching-node" data-node="answer-b">
    <rect x="240" y="156" width="160" height="64" rx="16" fill="#F4E8EB" stroke="#18212B" stroke-width="3" data-region="preference-node" data-node="answer-b"/>
    <text x="320" y="195" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">回答 B</text>
  </g>

  <rect x="458" y="106" width="190" height="76" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="preference-node" data-node="pairwise-comparison"/>
  <text x="553" y="153" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">配对比较</text>

  <g data-region="teaching-node" data-node="preference-label">
    <rect x="700" y="106" width="170" height="76" rx="16" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="preference-node" data-node="preference-label"/>
    <text x="785" y="153" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">偏好标签</text>
  </g>

  <g data-region="teaching-node" data-node="optimization-signal">
    <rect x="922" y="106" width="230" height="76" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="preference-node" data-node="optimization-signal"/>
    <text x="1037" y="137" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">优化信号</text>
    <text x="1037" y="166" font-family="Trebuchet MS" font-size="26" text-anchor="middle" fill="#315C9B">RM / PPO / DPO</text>
  </g>

  <line x1="196" y1="144" x2="240" y2="100" stroke="#18212B" stroke-width="3" marker-end="url(#arrow)" data-region="teaching-edge" data-edge="prompt-a"/>
  <line x1="196" y1="144" x2="240" y2="188" stroke="#18212B" stroke-width="3" marker-end="url(#arrow)" data-region="teaching-edge" data-edge="prompt-b"/>
  <line x1="400" y1="100" x2="458" y2="130" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)" data-region="preference-edge" data-edge="answer-a-comparison" data-from="answer-a" data-to="pairwise-comparison"/>
  <line x1="400" y1="188" x2="458" y2="158" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)" data-region="preference-edge" data-edge="answer-b-comparison" data-from="answer-b" data-to="pairwise-comparison"/>
  <polygon points="458,130 444,130 450,119" fill="#18212B" aria-hidden="true"/>
  <polygon points="458,158 450,169 444,158" fill="#18212B" aria-hidden="true"/>
  <g data-region="teaching-edge" data-edge="answers-label">
    <line x1="648" y1="144" x2="700" y2="144" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)" data-region="preference-edge" data-edge="comparison-label" data-from="pairwise-comparison" data-to="preference-label"/>
  </g>
  <polygon points="700,144 686,136 686,152" fill="#18212B" aria-hidden="true"/>
  <g data-region="teaching-edge" data-edge="label-signal">
    <line x1="870" y1="144" x2="922" y2="144" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)" data-region="preference-edge" data-edge="label-signal" data-from="preference-label" data-to="optimization-signal"/>
  </g>
  <polygon points="922,144 908,136 908,152" fill="#18212B" aria-hidden="true"/>

  <g data-region="teaching-node" data-node="behavior-distribution">
    <rect x="922" y="236" width="230" height="68" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3" data-region="preference-node" data-node="behavior-distribution"/>
    <text x="1037" y="264" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">行为分布改变</text>
    <text x="1037" y="292" font-family="Trebuchet MS" font-size="26" text-anchor="middle" fill="#315C9B">偏好回答概率上升</text>
  </g>
  <g data-region="teaching-edge" data-edge="signal-distribution">
    <line x1="1037" y1="182" x2="1037" y2="236" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)" data-region="preference-edge" data-edge="signal-distribution" data-from="optimization-signal" data-to="behavior-distribution"/>
  </g>
  <polygon points="1037,236 1029,222 1045,222" fill="#18212B" aria-hidden="true"/>

  <rect x="48" y="350" width="1104" height="174" rx="18" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-region="preference-node" data-node="multi-objective-boundary"/>
  <text x="72" y="387" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">多目标边界：一个 chosen 标签不能抹平不同维度</text>
  <line x1="1037" y1="304" x2="1037" y2="350" stroke="#18212B" stroke-width="4" marker-end="url(#arrow)" data-region="preference-edge" data-edge="distribution-boundary" data-from="behavior-distribution" data-to="multi-objective-boundary"/>
  <polygon points="1037,350 1029,336 1045,336" fill="#18212B" aria-hidden="true"/>

  <g data-region="teaching-node" data-node="helpful">
    <rect x="72" y="414" width="238" height="76" rx="14" fill="#E9F2EE" stroke="#18212B" stroke-width="2"/>
    <text x="191" y="447" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">有用 helpful</text>
    <text x="191" y="476" font-family="Trebuchet MS" font-size="26" text-anchor="middle" fill="#315C9B">能否解决任务？</text>
  </g>
  <g data-region="teaching-node" data-node="safe">
    <rect x="334" y="414" width="238" height="76" rx="14" fill="#FFF3D5" stroke="#18212B" stroke-width="2"/>
    <text x="453" y="447" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">安全 safe</text>
    <text x="453" y="476" font-family="Trebuchet MS" font-size="26" text-anchor="middle" fill="#315C9B">风险是否可控？</text>
  </g>
  <g data-region="teaching-node" data-node="informative">
    <rect x="596" y="414" width="238" height="76" rx="14" fill="#E9F2EE" stroke="#18212B" stroke-width="2"/>
    <text x="715" y="447" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">信息量 informative</text>
    <text x="715" y="476" font-family="Trebuchet MS" font-size="26" text-anchor="middle" fill="#315C9B">是否提供足够依据？</text>
  </g>
  <g data-region="teaching-node" data-node="calibrated">
    <rect x="858" y="414" width="270" height="76" rx="14" fill="#FFF3D5" stroke="#18212B" stroke-width="2"/>
    <text x="993" y="447" font-family="Trebuchet MS" font-size="26" font-weight="700" text-anchor="middle" fill="#18212B">校准 calibrated</text>
    <text x="993" y="476" font-family="Trebuchet MS" font-size="26" text-anchor="middle" fill="#315C9B">信心是否匹配证据？</text>
  </g>

  <rect x="48" y="554" width="1104" height="76" rx="16" fill="#F4E8EB" stroke="#A33A24" stroke-width="3"/>
  <text x="72" y="601" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">偏好 ≠ 事实真值；不是所有目标同时改善。</text>
</svg>
