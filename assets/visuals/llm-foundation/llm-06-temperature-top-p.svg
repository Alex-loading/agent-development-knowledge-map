<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="temp-title temp-desc">
<title id="temp-title">Temperature 重塑分布，top-p 截取动态集合</title><desc id="temp-desc">三个温度分布与基准温度下的累计 top-p 集合。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
<text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B" >Temperature 重塑分布，top-p 截取动态集合</text>
<text x="48" y="88" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >候选原序 C / A / B；logits 0 / 2 / 1；教学示例 · 非实测</text>
<rect x="48" y="126" width="250" height="280" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-region="temperature-panel" data-index="0" data-value="0.5"/><text x="68" y="164" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" >T=0.5</text><text x="68" y="210" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >C</text><rect x="110" y="184" width="2" height="34" rx="6" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="temperature-bar" data-row="0" data-column="0" data-value="0.015876239976466765"/><text x="204" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.0159</text><text x="68" y="272" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >A</text><rect x="110" y="246" width="87" height="34" rx="6" fill="#1F7A78" stroke="#18212B" stroke-width="3" data-region="temperature-bar" data-row="0" data-column="1" data-value="0.8668133321973347"/><text x="204" y="272" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.8668</text><text x="68" y="334" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >B</text><rect x="110" y="308" width="12" height="34" rx="6" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="temperature-bar" data-row="0" data-column="2" data-value="0.11731042782619835"/><text x="204" y="334" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.1173</text><rect x="326" y="126" width="250" height="280" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3" data-region="temperature-panel" data-index="1" data-value="1"/><text x="346" y="164" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" >T=1</text><text x="346" y="210" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >C</text><rect x="388" y="184" width="9" height="34" rx="6" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="temperature-bar" data-row="1" data-column="0" data-value="0.09003057317038046"/><text x="482" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.0900</text><text x="346" y="272" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >A</text><rect x="388" y="246" width="67" height="34" rx="6" fill="#1F7A78" stroke="#18212B" stroke-width="3" data-region="temperature-bar" data-row="1" data-column="1" data-value="0.6652409557748218"/><text x="482" y="272" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.6652</text><text x="346" y="334" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >B</text><rect x="388" y="308" width="24" height="34" rx="6" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="temperature-bar" data-row="1" data-column="2" data-value="0.24472847105479764"/><text x="482" y="334" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.2447</text><rect x="604" y="126" width="250" height="280" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-region="temperature-panel" data-index="2" data-value="2"/><text x="624" y="164" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" >T=2</text><text x="624" y="210" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >C</text><rect x="666" y="184" width="19" height="34" rx="6" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="temperature-bar" data-row="2" data-column="0" data-value="0.1863237232258476"/><text x="760" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.1863</text><text x="624" y="272" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >A</text><rect x="666" y="246" width="51" height="34" rx="6" fill="#1F7A78" stroke="#18212B" stroke-width="3" data-region="temperature-bar" data-row="2" data-column="1" data-value="0.506480391055654"/><text x="760" y="272" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.5065</text><text x="624" y="334" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >B</text><rect x="666" y="308" width="31" height="34" rx="6" fill="#FFF3D5" stroke="#18212B" stroke-width="3" data-region="temperature-bar" data-row="2" data-column="2" data-value="0.3071958857184984"/><text x="760" y="334" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >0.3072</text>
<rect x="900" y="126" width="252" height="280" rx="16" fill="#FFF3D5" stroke="#C58A10" stroke-width="3" /><text x="922" y="164" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#8A6510" >T=1, top-p=0.8</text><text x="922" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >A 0.6652  ✓</text><text x="922" y="252" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >累计 0.6652</text><text x="922" y="294" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >B 0.2447  ✓</text><text x="922" y="336" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >累计 0.9100 ≥ .8</text><text x="922" y="378" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >C 0.0900  ×</text>
<rect x="48" y="442" width="1104" height="184" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" /><text x="72" y="482" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Input：candidates C/A/B；logits 0/2/1；T = 0.5 / 1 / 2；top-p = 0.8。</text><text x="72" y="520" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Method：p=softmax(z/T)；按概率排序，取累计质量达阈值的最小前缀。</text><text x="72" y="558" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >Result：nucleus = A / B；保留集合内还需重新归一化后采样。</text><text x="72" y="594" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >Rounding：概率四位小数；阈值比较使用未舍入值。两者都不会增加知识。</text></svg>
