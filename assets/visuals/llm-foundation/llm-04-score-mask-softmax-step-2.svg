<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="sms4-title sms4-desc">
  <title id="sms4-title">步骤二：完整保留 QKV 投影并追加 raw QK 矩阵</title>
  <desc id="sms4-desc">固定布局完整保留步骤一的 Q、三列 K 和三组 V，第二阶段追加带 q0 行与 k0、k1、k2 列轴的 raw QK 矩阵。</desc>
  <defs>
    <pattern id="sms4-mask" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/>
    </pattern>
    <marker id="sms4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="48" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">步骤 2 / 4 · 累计 QKV + raw QK matrix</text>
  <text x="958" y="48" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">教学示例 · 非实测</text>

  <g data-region="phase-project" data-phase="project" data-state="active">
    <rect x="48" y="92" width="232" height="466" rx="18" fill="#FFF3D5" stroke="#C58A10" stroke-width="4"/>
    <text x="64" y="130" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#8A6510">步骤 1 · Q/K/V</text>
    <rect data-region="phase-node" data-phase="project" data-state="active" data-node="h" x="64" y="150" width="200" height="46" rx="10" fill="#FFFFFF" stroke="#18212B" stroke-width="3"/>
    <text x="82" y="181" font-family="Trebuchet MS" font-size="26" fill="#18212B">表示 h → 投影</text>
    <rect data-region="phase-node" data-phase="project" data-state="active" data-node="q" x="64" y="210" width="200" height="46" rx="10" fill="#DCE5F2" stroke="#315C9B" stroke-width="3"/>
    <text x="82" y="241" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">Q：当前 q0</text>
    <rect data-region="phase-node" data-phase="project" data-state="active" data-node="k0" x="64" y="270" width="60" height="46" rx="8" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="phase-node" data-phase="project" data-state="active" data-node="k1" x="134" y="270" width="60" height="46" rx="8" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
    <rect data-region="phase-node" data-phase="project" data-state="active" data-node="k2" x="204" y="270" width="60" height="46" rx="8" fill="#F4E8EB" stroke="#A33A24" stroke-width="3"/>
    <text x="76" y="301" font-family="Trebuchet MS" font-size="26" fill="#18212B">K0</text>
    <text x="146" y="301" font-family="Trebuchet MS" font-size="26" fill="#18212B">K1</text>
    <text x="216" y="301" font-family="Trebuchet MS" font-size="26" fill="#18212B">K2</text>
    <rect data-region="phase-node" data-phase="project" data-state="active" data-node="v0" data-value="1,0" x="64" y="336" width="200" height="48" rx="8" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
    <rect data-region="phase-node" data-phase="project" data-state="active" data-node="v1" data-value="0,3" x="64" y="396" width="200" height="48" rx="8" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
    <rect data-region="phase-node" data-phase="project" data-state="active" data-node="v2" data-value="9,9" x="64" y="456" width="200" height="48" rx="8" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
    <text x="78" y="368" font-family="Trebuchet MS" font-size="26" fill="#18212B">V1 1.000 / 0.000</text>
    <text x="78" y="428" font-family="Trebuchet MS" font-size="26" fill="#18212B">V2 0.000 / 3.000</text>
    <text x="78" y="488" font-family="Trebuchet MS" font-size="26" fill="#18212B">V3 9.000 / 9.000</text>
    <text x="64" y="526" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#8A6510">Q/K 匹配</text>
    <text x="64" y="550" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#8A6510">V 被汇总</text>
  </g>

  <g data-region="phase-compare" data-phase="compare" data-state="active">
    <rect x="306" y="92" width="232" height="466" rx="18" fill="#FFFFFF" stroke="#315C9B" stroke-width="4"/>
    <text x="322" y="130" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#315C9B">步骤 2 · raw QK</text>
    <g data-region="attention-matrix" data-phase="compare" data-state="active" data-stage="raw" data-origin-x="370" data-origin-y="224" data-cell-width="52" data-cell-height="58">
      <text x="380" y="210" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">k0</text>
      <text x="432" y="210" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">k1</text>
      <text x="484" y="210" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B">k2</text>
      <text x="322" y="262" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">q0</text>
      <rect data-region="attention-cell" data-phase="compare" data-state="active" data-stage="raw" data-row="0" data-column="0" data-value="0" x="370" y="224" width="52" height="58" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
      <rect data-region="attention-cell" data-phase="compare" data-state="active" data-stage="raw" data-row="0" data-column="1" data-value="1.3862943611198906" x="422" y="224" width="52" height="58" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
      <rect data-region="attention-cell" data-phase="compare" data-state="active" data-stage="raw" data-row="0" data-column="2" data-value="18" x="474" y="224" width="52" height="58" fill="#F4E8EB" stroke="#A33A24" stroke-width="3"/>
      <text x="386" y="263" font-family="Trebuchet MS" font-size="26" fill="#18212B">0</text>
      <text x="428" y="263" font-family="Trebuchet MS" font-size="26" fill="#18212B">1.4</text>
      <text x="484" y="263" font-family="Trebuchet MS" font-size="26" fill="#18212B">18</text>
    </g>
    <text x="322" y="330" font-family="Trebuchet MS" font-size="26" fill="#18212B">raw QK</text>
    <text x="322" y="364" font-family="Trebuchet MS" font-size="26" fill="#18212B">0.000 / 1.386 /</text>
    <text x="322" y="398" font-family="Trebuchet MS" font-size="26" fill="#18212B">18.000</text>
    <text x="322" y="446" font-family="Trebuchet MS" font-size="26" fill="#18212B">d_k 4</text>
    <text x="322" y="486" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">索引 2 = 未来</text>
  </g>

  <g data-region="phase-normalize" data-phase="normalize" data-state="placeholder">
    <rect x="564" y="92" width="340" height="466" rx="18" fill="#F1EFE8" stroke="#7A7F87" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="580" y="130" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#555B63">后续阶段</text>
    <text x="620" y="304" font-family="Trebuchet MS" font-size="26" fill="#555B63">scale + mask + softmax</text>
    <text x="620" y="340" font-family="Trebuchet MS" font-size="26" fill="#555B63">等待步骤 3 激活</text>
  </g>

  <g data-region="phase-aggregate" data-phase="aggregate" data-state="placeholder">
    <rect x="930" y="92" width="222" height="466" rx="18" fill="#F1EFE8" stroke="#7A7F87" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="946" y="130" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#555B63">最终阶段</text>
    <text x="958" y="304" font-family="Trebuchet MS" font-size="26" fill="#555B63">ΣV / output</text>
    <text x="946" y="340" font-family="Trebuchet MS" font-size="26" fill="#555B63">等待步骤 4 激活</text>
  </g>

  <line data-region="direction-1" x1="282" y1="324" x2="302" y2="324" stroke="#18212B" stroke-width="4" marker-end="url(#sms4-arrow)"/>
  <rect x="48" y="584" width="1104" height="60" rx="16" fill="#18212B"/>
  <text x="70" y="623" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#FFFFFF">步骤 2：q0 比较 K0/K1/K2，raw QK = 0.000 / 1.386 / 18.000；索引 2 是未来。</text>
</svg>
