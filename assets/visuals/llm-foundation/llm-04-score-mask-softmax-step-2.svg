<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="sms2-title sms2-desc">
  <title id="sms2-title">步骤二：Q 比较 K 得到原始分数</title>
  <desc id="sms2-desc">第二步保留 Q、K、V 投影并增加原始 QK 分数，未来候选仍在分数表中。</desc>
  <defs>
    <marker id="sms2-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#18212B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="52" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">步骤 2 / 4 · Q compare allowed K / raw scores</text>
  <text x="930" y="52" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">教学示例 · 非实测</text>
  <g data-region="phase-project">
    <rect x="48" y="94" width="438" height="470" rx="22" fill="#FFF3D5" stroke="#C58A10" stroke-width="4"/>
    <text x="72" y="138" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#8A6510">步骤 1 · 投影保留</text>
    <circle cx="154" cy="226" r="54" fill="#FFFFFF" stroke="#F26B38" stroke-width="5"/>
    <text x="128" y="238" font-family="Trebuchet MS" font-size="34" font-weight="700" fill="#18212B">Q ?</text>
    <rect x="244" y="180" width="180" height="70" rx="14" fill="#DCE5F2" stroke="#315C9B" stroke-width="4"/>
    <text x="270" y="224" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">K1 / K2 / K3</text>
    <rect x="72" y="316" width="352" height="174" rx="16" fill="#E9F2EE" stroke="#1F7A78" stroke-width="4"/>
    <text x="94" y="358" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#1F5F5D">Value 信息卡</text>
    <text x="94" y="402" font-family="Trebuchet MS" font-size="26" fill="#18212B">V1 1.000 / 0.000</text>
    <text x="94" y="440" font-family="Trebuchet MS" font-size="26" fill="#18212B">V2 0.000 / 3.000</text>
    <text x="94" y="478" font-family="Trebuchet MS" font-size="26" fill="#18212B">V3 9.000 / 9.000</text>
  </g>
  <line data-region="direction-1" x1="488" y1="330" x2="548" y2="330" stroke="#18212B" stroke-width="5" marker-end="url(#sms2-arrow)"/>
  <g data-region="phase-compare">
    <rect x="558" y="94" width="594" height="470" rx="22" fill="#FFFFFF" stroke="#315C9B" stroke-width="4"/>
    <text x="582" y="138" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#315C9B">步骤 2 · Q × K 原始匹配</text>
    <rect x="600" y="186" width="150" height="110" rx="16" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/>
    <rect x="780" y="186" width="150" height="110" rx="16" fill="#FFFFFF" stroke="#18212B" stroke-width="3"/>
    <rect x="960" y="186" width="150" height="110" rx="16" fill="#F4E8EB" stroke="#A33A24" stroke-width="4"/>
    <text x="630" y="226" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#18212B">Q·K1</text>
    <text x="640" y="274" font-family="Trebuchet MS" font-size="32" fill="#18212B">0.000</text>
    <text x="810" y="226" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#18212B">Q·K2</text>
    <text x="820" y="274" font-family="Trebuchet MS" font-size="32" fill="#18212B">1.386</text>
    <text x="990" y="226" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#18212B">Q·K3</text>
    <text x="1000" y="274" font-family="Trebuchet MS" font-size="32" fill="#18212B">18.000</text>
    <text x="582" y="354" font-family="Trebuchet MS" font-size="28" fill="#18212B">raw QK 0.000 / 1.386 / 18.000</text>
    <text x="582" y="402" font-family="Trebuchet MS" font-size="26" fill="#18212B">未来索引 2 仍在原始分数中</text>
    <text x="582" y="448" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">高分不等于允许读取</text>
    <text x="582" y="496" font-family="Trebuchet MS" font-size="26" fill="#18212B">下一步才做 scale、mask 与 softmax</text>
  </g>
  <rect x="48" y="590" width="1104" height="54" rx="14" fill="#18212B"/>
  <text x="70" y="626" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#FFFFFF">本步结论：Q/K 产生 raw scores；因果合法性不能由分数大小替代。</text>
</svg>
