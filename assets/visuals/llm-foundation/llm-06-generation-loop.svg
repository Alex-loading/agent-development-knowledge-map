<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="generation-title generation-desc">
  <title id="generation-title">Prefill → decode → 明确停止</title>
  <desc id="generation-desc">一次请求进入 prefill 后，逐步执行 logits、温度、softmax、top-p、逆 CDF 采样、追加与 KV 更新，下一状态为 EOS。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">Prefill → decode → 明确停止</text>
  <g data-region="phase-raw" data-phase="raw" data-state="active">
    <rect x="48" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="raw" data-state="active"/>
    <text x="66" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="raw" data-state="active">1 RAW</text>
    <text x="66" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="raw" data-state="active">C 0.0000</text>
    <text x="66" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="raw" data-state="active">A 2.0000</text>
    <text x="66" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="raw" data-state="active">B 1.0000</text>
    <text x="66" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="raw" data-state="active">步骤 1</text>
  </g>
  <g data-region="phase-temperature" data-phase="temperature" data-state="active">
    <rect x="270" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="temperature" data-state="active"/>
    <text x="288" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="temperature" data-state="active">2 SCALE T</text>
    <text x="288" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="temperature" data-state="active">T=1</text>
    <text x="288" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="temperature" data-state="active">logits 0/2/1</text>
    <text x="288" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="temperature" data-state="active">顺序 C / A / B</text>
    <text x="288" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="temperature" data-state="active">步骤 2</text>
  </g>
  <g data-region="phase-softmax" data-phase="softmax" data-state="active">
    <rect x="492" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="softmax" data-state="active"/>
    <text x="510" y="150" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="softmax" data-state="active">3 stable</text>
    <text x="510" y="180" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="softmax" data-state="active">softmax</text>
    <text x="510" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="softmax" data-state="active">C 0.0900</text>
    <text x="510" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="softmax" data-state="active">A 0.6652</text>
    <text x="510" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="softmax" data-state="active">B 0.2447</text>
    <text x="510" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="softmax" data-state="active">步骤 3</text>
    <rect data-region="generation-probability" data-token="C" data-value="0.09003057317038046" x="510" y="326" width="14.4049" height="12" fill="#315C9B"/>
    <rect data-region="generation-probability" data-token="A" data-value="0.6652409557748218" x="510" y="346" width="106.4386" height="12" fill="#315C9B"/>
    <rect data-region="generation-probability" data-token="B" data-value="0.24472847105479764" x="510" y="366" width="39.1566" height="12" fill="#315C9B"/>
  </g>
  <g data-region="phase-nucleus" data-phase="nucleus" data-state="active">
    <rect x="714" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="nucleus" data-state="active"/>
    <text x="732" y="150" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="nucleus" data-state="active">4 最小</text>
    <text x="732" y="180" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="nucleus" data-state="active">nucleus</text>
    <text x="732" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="nucleus" data-state="active">top-p=.8</text>
    <text x="732" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="nucleus" data-state="active">A + B = .9100</text>
    <text x="732" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="nucleus" data-state="active">renorm</text>
    <text x="732" y="354" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="nucleus" data-state="active">0.7311/0.2689</text>
    <text x="732" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="nucleus" data-state="active">步骤 4</text>
    <rect data-region="nucleus-member" data-token="A" data-value="0.7310585786300049" x="732" y="376" width="116.9694" height="12" fill="#1F7A78"/>
    <rect data-region="nucleus-member" data-token="B" data-value="0.2689414213699951" x="848.9694" y="376" width="43.0306" height="12" fill="#A33A24"/>
  </g>
  <g data-region="phase-sample" data-phase="sample" data-state="active">
    <rect x="936" y="118" width="202" height="330" rx="16" fill="#FFF3D5" stroke="#C58A10" stroke-width="3" data-phase="sample" data-state="active"/>
    <text x="954" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="sample" data-state="active">5 逆 CDF</text>
    <text x="954" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="sample" data-state="active">u=.7</text>
    <text x="954" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="sample" data-state="active">selected A</text>
    <text x="954" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="sample" data-state="active">next → EOS</text>
    <text x="954" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="sample" data-state="active">步骤 5</text>
    <line data-region="cdf-sample" data-value="0.7" x1="1066" y1="340" x2="1066" y2="390" stroke="#A33A24" stroke-width="5"/>
  </g>
  <path data-region="phase-direction" data-from="raw" data-to="temperature" d="M251 108 H261 M261 101 L269 108 L261 115" fill="none" stroke="#18212B" stroke-width="4"/>
  <path data-region="phase-direction" data-from="temperature" data-to="softmax" d="M473 108 H483 M483 101 L491 108 L483 115" fill="none" stroke="#18212B" stroke-width="4"/>
  <path data-region="phase-direction" data-from="softmax" data-to="nucleus" d="M695 108 H705 M705 101 L713 108 L705 115" fill="none" stroke="#18212B" stroke-width="4"/>
  <path data-region="phase-direction" data-from="nucleus" data-to="sample" d="M917 108 H927 M927 101 L935 108 L927 115" fill="none" stroke="#18212B" stroke-width="4"/>
  <g data-region="generation-value" data-kind="candidates" data-value="C,A,B"/><g data-region="generation-value" data-kind="logits" data-value="0,2,1"/><g data-region="generation-value" data-kind="temperature" data-value="1"/><g data-region="generation-value" data-kind="probabilities" data-value="0.0900,0.6652,0.2447"/><g data-region="generation-value" data-kind="top-p" data-value="0.8"/><g data-region="generation-value" data-kind="nucleus" data-value="A,B"/><g data-region="generation-value" data-kind="renormalized" data-value="0.7311,0.2689"/><g data-region="generation-value" data-kind="uniform-sample" data-value="0.7"/><g data-region="generation-value" data-kind="selected" data-value="A"/><g data-region="generation-value" data-kind="next-token" data-value="EOS"/>
  <rect x="48" y="466" width="1104" height="178" rx="16" fill="#FFFFFF" stroke="#1F7A78" stroke-width="3"/>
  <g data-region="service-node" data-node="input"><rect x="60" y="480" width="100" height="42" rx="8" fill="#FFF3D5" stroke="#18212B" stroke-width="3"/><text x="76" y="510" font-family="Trebuchet MS" font-size="26" fill="#18212B">input</text></g>
  <g data-region="service-node" data-node="prefill"><rect x="186" y="480" width="110" height="42" rx="8" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/><text x="198" y="510" font-family="Trebuchet MS" font-size="26" fill="#18212B">prefill</text></g>
  <g data-region="service-node" data-node="decode"><rect x="322" y="480" width="110" height="42" rx="8" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/><text x="332" y="510" font-family="Trebuchet MS" font-size="26" fill="#18212B">decode</text></g>
  <g data-region="service-node" data-node="logits"><rect x="458" y="480" width="100" height="42" rx="8" fill="#FFFFFF" stroke="#18212B" stroke-width="3"/><text x="472" y="510" font-family="Trebuchet MS" font-size="26" fill="#18212B">logits</text></g>
  <g data-region="service-node" data-node="sampling"><rect x="584" y="480" width="126" height="42" rx="8" fill="#FFF3D5" stroke="#18212B" stroke-width="3"/><text x="594" y="510" font-family="Trebuchet MS" font-size="26" fill="#18212B">sampling</text></g>
  <g data-region="service-node" data-node="append-kv"><rect x="736" y="480" width="150" height="42" rx="8" fill="#E9F2EE" stroke="#18212B" stroke-width="3"/><text x="748" y="510" font-family="Trebuchet MS" font-size="26" fill="#18212B">append+KV</text></g>
  <line data-region="service-edge" data-edge="input-prefill" x1="160" y1="501" x2="186" y2="501" stroke="#18212B" stroke-width="3"/>
  <line data-region="service-edge" data-edge="prefill-decode" x1="296" y1="501" x2="322" y2="501" stroke="#18212B" stroke-width="3"/>
  <line data-region="service-edge" data-edge="decode-logits" x1="432" y1="501" x2="458" y2="501" stroke="#18212B" stroke-width="3"/>
  <line data-region="service-edge" data-edge="logits-sampling" x1="558" y1="501" x2="584" y2="501" stroke="#18212B" stroke-width="3"/>
  <line data-region="service-edge" data-edge="sampling-append" x1="710" y1="501" x2="736" y2="501" stroke="#18212B" stroke-width="3"/>
  <path data-region="service-edge" data-edge="append-decode" d="M811 522 V540 H377 V522" fill="none" stroke="#315C9B" stroke-width="3"/>
  <g data-region="service-node" data-node="eos"><rect x="60" y="558" width="120" height="42" rx="8" fill="#F4E8EB" stroke="#A33A24" stroke-width="3"/><text x="96" y="588" font-family="Trebuchet MS" font-size="26" fill="#18212B">EOS</text></g>
  <g data-region="service-node" data-node="stop-sequence"><rect x="200" y="558" width="180" height="42" rx="8" fill="#F4E8EB" stroke="#A33A24" stroke-width="3"/><text x="214" y="588" font-family="Trebuchet MS" font-size="26" fill="#18212B">stop 序列</text></g>
  <g data-region="service-node" data-node="max-tokens"><rect x="400" y="558" width="180" height="42" rx="8" fill="#F4E8EB" stroke="#A33A24" stroke-width="3"/><text x="416" y="588" font-family="Trebuchet MS" font-size="26" fill="#18212B">max tokens</text></g>
  <g data-region="service-node" data-node="business-complete"><rect x="600" y="558" width="180" height="42" rx="8" fill="#F4E8EB" stroke="#A33A24" stroke-width="3"/><text x="616" y="588" font-family="Trebuchet MS" font-size="26" fill="#18212B">业务完成</text></g>
  <path data-region="service-edge" data-edge="sampling-eos" d="M647 522 V548 H120 V558" fill="none" stroke="#A33A24" stroke-width="3"/>
  <path data-region="service-edge" data-edge="sampling-stop" d="M647 522 V548 H290 V558" fill="none" stroke="#A33A24" stroke-width="3"/>
  <path data-region="service-edge" data-edge="sampling-max" d="M647 522 V548 H490 V558" fill="none" stroke="#A33A24" stroke-width="3"/>
  <path data-region="service-edge" data-edge="sampling-business" d="M647 522 V558" fill="none" stroke="#A33A24" stroke-width="3"/>
  <text x="60" y="632" font-family="Trebuchet MS" font-size="26" fill="#18212B">Rounding：概率四位小数；累计比较使用未舍入值。</text>
</svg>
