<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="generation-title generation-desc">
<title id="generation-title">Prefill → decode → 明确停止</title><desc id="generation-desc">一次请求进入 prefill 后，逐步执行 logits、温度、softmax、top-p、逆 CDF 采样、追加与 KV 更新，下一状态为 EOS。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#A33A24" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
<text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B" >Prefill → decode → 明确停止</text>
<g data-region="phase-raw" data-phase="raw" data-state="active"><rect x="48" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="raw" data-state="active"/><text x="66" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="raw" data-state="active">1 RAW</text><text x="66" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="raw" data-state="active">C 0.0000</text><text x="66" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="raw" data-state="active">A 2.0000</text><text x="66" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="raw" data-state="active">B 1.0000</text><text x="66" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="raw" data-state="active">步骤 1</text></g><g data-region="phase-temperature" data-phase="temperature" data-state="active"><rect x="270" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="temperature" data-state="active"/><text x="288" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="temperature" data-state="active">2 SCALE T</text><text x="288" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="temperature" data-state="active">T = 1</text><text x="288" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="temperature" data-state="active">z/T = 0 / 2 / 1</text><text x="288" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="temperature" data-state="active">顺序 C / A / B</text><text x="288" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="temperature" data-state="active">步骤 2</text></g><g data-region="phase-softmax" data-phase="softmax" data-state="active"><rect x="492" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="softmax" data-state="active"/><text x="510" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="softmax" data-state="active">3 SOFTMAX</text><text x="510" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="softmax" data-state="active">C .0900</text><text x="510" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="softmax" data-state="active">A .6652</text><text x="510" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="softmax" data-state="active">B .2447</text><text x="510" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="softmax" data-state="active">步骤 3</text></g><g data-region="phase-nucleus" data-phase="nucleus" data-state="active"><rect x="714" y="118" width="202" height="330" rx="16" fill="#FFFFFF" stroke="#315C9B" stroke-width="3" data-phase="nucleus" data-state="active"/><text x="732" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="nucleus" data-state="active">4 NUCLEUS</text><text x="732" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="nucleus" data-state="active">top-p = .8</text><text x="732" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="nucleus" data-state="active">A + B = .9100</text><text x="732" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="nucleus" data-state="active">renorm</text><text x="732" y="354" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="nucleus" data-state="active">.7311 / .2689</text><text x="732" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="nucleus" data-state="active">步骤 4</text></g><g data-region="phase-sample" data-phase="sample" data-state="active"><rect x="936" y="118" width="202" height="330" rx="16" fill="#FFF3D5" stroke="#C58A10" stroke-width="3" data-phase="sample" data-state="active"/><text x="954" y="158" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#315C9B" data-phase="sample" data-state="active">5 SAMPLE</text><text x="954" y="210" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="sample" data-state="active">u = .7</text><text x="954" y="258" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="sample" data-state="active">CDF⁻¹ → A</text><text x="954" y="306" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" data-phase="sample" data-state="active">next → EOS</text><text x="954" y="414" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" data-phase="sample" data-state="active">步骤 5</text></g>
<rect x="48" y="470" width="1104" height="174" rx="16" fill="#FFFFFF" stroke="#1F7A78" stroke-width="3" /><text x="72" y="504" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Input：候选 C/A/B；logits 0/2/1；T=1；top-p=.8；u=.7；nextStateToken=EOS。</text><text x="72" y="536" font-family="Trebuchet MS" font-size="26" font-weight="400" fill="#18212B" >Method：stable softmax → 最小 nucleus → 集合内重归一化 → 逆 CDF 抽样。</text><text x="72" y="568" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >Result：prob 0.0900/0.6652/0.2447；nucleus A/B。</text><text x="72" y="600" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B" >Result：renorm 0.7311/0.2689；selected A → EOS。</text><text x="72" y="632" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24" >Rounding：概率四位小数；累计比较使用未舍入值。四类停止并不等价。</text></svg>
