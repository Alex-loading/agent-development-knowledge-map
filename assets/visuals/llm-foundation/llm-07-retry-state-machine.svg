<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">结构修复必须经过有限重试与幂等副作用边界</title>
  <desc id="desc">第一次结构化输出失败后，守卫判断一小于最大尝试二并进入第二次尝试；第二次成功可进入事件执行，若再次失败则守卫判断二不小于二，进入耗尽并选择降级或人工终止。下方五个事件展示合法新键执行、重复键复用和非法键拒绝。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0B766E"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B94B42"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#F7F1E3"/>
  <text x="42" y="62" font-family="Avenir Next, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#18312D">有限重试不是循环口号，而是有耗尽出口的状态机</text>
  <text x="42" y="104" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#49645E">Input：2 attempts · Method：enum → retry → idempotency · Rounding：整数</text>
  <line x1="34" y1="118" x2="1166" y2="118" stroke="#18312D" stroke-width="2"/>

  <rect x="35" y="130" width="150" height="68" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="retry-attempt" data-node="attempt-1" data-value="urgent" data-index="1"/>
  <text x="110" y="158" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">Attempt 1</text>
  <text x="110" y="188" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">urgent</text>
  <rect x="205" y="130" width="140" height="68" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="retry-state" data-node="schema-failed"/>
  <text x="275" y="158" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">枚举失败</text>
  <text x="275" y="188" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">urgent</text>
  <polygon points="410,126 470,164 410,202 350,164" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="retry-guard" data-node="guard-1" data-value="attempt 1 ＜ 2?" data-index="1"/>
  <text x="410" y="172" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="middle">1 ＜ 2?</text>
  <rect x="485" y="130" width="150" height="68" rx="14" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="retry-attempt" data-node="attempt-2" data-value="high" data-index="2"/>
  <text x="560" y="158" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">Attempt 2</text>
  <text x="560" y="188" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">high</text>
  <rect x="655" y="130" width="150" height="68" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="retry-state" data-node="validated"/>
  <text x="730" y="158" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">Validated</text>
  <text x="730" y="188" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">success</text>

  <rect x="485" y="225" width="150" height="58" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="retry-state" data-node="schema-failed-2"/>
  <text x="560" y="263" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">再次失败</text>
  <polygon points="700,216 760,254 700,292 640,254" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="retry-guard" data-node="guard-2" data-value="attempt 2 ＜ 2?" data-index="2"/>
  <text x="700" y="262" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D" text-anchor="middle">2 ＜ 2?</text>
  <rect x="780" y="225" width="150" height="58" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="retry-state" data-node="exhausted"/>
  <text x="855" y="263" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#B94B42" text-anchor="middle">耗尽</text>
  <rect x="960" y="205" width="180" height="52" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="retry-terminal" data-node="degrade"/>
  <text x="1050" y="240" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">降级</text>
  <rect x="960" y="270" width="180" height="52" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="retry-terminal" data-node="manual-termination"/>
  <text x="1050" y="305" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">人工终止</text>

  <line x1="185" y1="164" x2="200" y2="164" stroke="#0B766E" stroke-width="3" marker-end="url(#arrow)" data-region="retry-edge" data-from="attempt-1" data-to="schema-failed" data-edge="attempt-1-schema-failed"/>
  <line x1="345" y1="164" x2="355" y2="164" stroke="#0B766E" stroke-width="3" marker-end="url(#arrow)" data-region="retry-edge" data-from="schema-failed" data-to="guard-1" data-edge="schema-failed-guard-1"/>
  <line x1="470" y1="164" x2="480" y2="164" stroke="#0B766E" stroke-width="3" marker-end="url(#arrow)" data-region="retry-edge" data-from="guard-1" data-to="attempt-2" data-edge="guard-1-attempt-2" data-kind="true"/>
  <text x="476" y="150" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#0B766E" text-anchor="middle">T</text>
  <line x1="635" y1="164" x2="650" y2="164" stroke="#0B766E" stroke-width="3" marker-end="url(#arrow)" data-region="retry-edge" data-from="attempt-2" data-to="validated" data-edge="attempt-2-validated" data-state="success"/>
  <path d="M560 198 V220" fill="none" stroke="#B94B42" stroke-width="3" marker-end="url(#arrow-red)" data-region="retry-edge" data-from="attempt-2" data-to="schema-failed-2" data-edge="attempt-2-schema-failed-2" data-state="failure"/>
  <line x1="635" y1="254" x2="645" y2="254" stroke="#0B766E" stroke-width="3" marker-end="url(#arrow)" data-region="retry-edge" data-from="schema-failed-2" data-to="guard-2" data-edge="schema-failed-2-guard-2"/>
  <line x1="760" y1="254" x2="775" y2="254" stroke="#B94B42" stroke-width="3" marker-end="url(#arrow-red)" data-region="retry-edge" data-from="guard-2" data-to="exhausted" data-edge="guard-2-exhausted" data-kind="false"/>
  <text x="768" y="240" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#B94B42" text-anchor="middle">F</text>
  <path d="M930 244 H940 V231 H955" fill="none" stroke="#0B766E" stroke-width="3" marker-end="url(#arrow)" data-region="retry-edge" data-from="exhausted" data-to="degrade" data-edge="exhausted-degrade"/>
  <path d="M930 264 H940 V296 H955" fill="none" stroke="#0B766E" stroke-width="3" marker-end="url(#arrow)" data-region="retry-edge" data-from="exhausted" data-to="manual-termination" data-edge="exhausted-manual-termination"/>

  <text x="45" y="344" font-family="Avenir Next, PingFang SC, sans-serif" font-size="28" font-weight="800" fill="#0B766E">事件表：key | payload</text>
  <rect x="45" y="360" width="650" height="40" rx="12" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="idempotency-event" data-node="event-1" data-value="executed" data-index="1" data-token="ticket-42:v1" data-count="42"/>
  <text x="370" y="388" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">#1 | ticket-42:v1 | t42 / high</text>
  <rect x="45" y="408" width="650" height="40" rx="12" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="idempotency-event" data-node="event-2" data-value="deduplicated" data-index="2" data-token="ticket-42:v1" data-count="42"/>
  <text x="370" y="436" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">#2 | ticket-42:v1 | t42 / high</text>
  <rect x="45" y="456" width="650" height="40" rx="12" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="idempotency-event" data-node="event-3" data-value="executed" data-index="3" data-token="ticket-43:v1" data-count="43"/>
  <text x="370" y="484" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">#3 | ticket-43:v1 | t43 / low</text>
  <rect x="45" y="504" width="650" height="40" rx="12" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="idempotency-event" data-node="event-4" data-value="rejected" data-index="4" data-token="" data-count="44"/>
  <text x="370" y="532" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">#4 | 空 key | t44 / high</text>
  <rect x="45" y="552" width="650" height="40" rx="12" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="idempotency-event" data-node="event-5" data-value="rejected" data-index="5" data-token="invalid key" data-count="45"/>
  <text x="370" y="580" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">#5 | invalid key | t45 / high</text>

  <path d="M730 198 V330 H705 V380 H700" fill="none" stroke="#0B766E" stroke-width="3" marker-end="url(#arrow)" data-region="retry-edge" data-from="validated" data-to="event-1" data-edge="validated-event-1"/>
  <rect x="775" y="350" width="185" height="70" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="event-result" data-node="effect-1"/>
  <text x="868" y="379" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">effect-1</text>
  <text x="868" y="409" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">执行 / 去重复用</text>
  <rect x="775" y="438" width="185" height="70" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="event-result" data-node="effect-2"/>
  <text x="868" y="467" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">effect-2</text>
  <text x="868" y="497" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">第二个新 key</text>
  <rect x="775" y="520" width="185" height="70" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="event-result" data-node="rejected"/>
  <text x="868" y="549" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">REJECTED</text>
  <text x="868" y="579" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">无执行边</text>
  <path d="M695 380 H770" fill="none" stroke="#0B766E" stroke-width="3" marker-end="url(#arrow)" data-region="retry-edge" data-from="event-1" data-to="effect-1" data-edge="event-1-effect-1"/>
  <path d="M695 428 H730 V390 H770" fill="none" stroke="#0B766E" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="retry-edge" data-from="event-2" data-to="effect-1" data-edge="event-2-effect-1"/>
  <path d="M695 476 H770" fill="none" stroke="#0B766E" stroke-width="3" marker-end="url(#arrow)" data-region="retry-edge" data-from="event-3" data-to="effect-2" data-edge="event-3-effect-2"/>
  <path d="M695 524 H730 V555 H770" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow-red)" data-region="retry-edge" data-from="event-4" data-to="rejected" data-edge="event-4-rejected"/>
  <path d="M695 572 H770" fill="none" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow-red)" data-region="retry-edge" data-from="event-5" data-to="rejected" data-edge="event-5-rejected"/>

  <rect x="975" y="350" width="185" height="82" rx="14" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="retry-summary" data-node="sideEffects" data-value="2"/>
  <text x="1068" y="384" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">Result</text>
  <text x="1068" y="418" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">effects = 2</text>
  <rect x="975" y="445" width="185" height="145" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="retry-summary" data-node="cacheKeys" data-value="ticket-42:v1|ticket-43:v1"/>
  <text x="1068" y="484" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle">cache keys</text>
  <text x="1068" y="526" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle">ticket-42:v1</text>
  <text x="1068" y="568" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="600" fill="#49645E" text-anchor="middle">ticket-43:v1</text>
  <text x="45" y="632" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#18312D">原则：成功进入副作用；耗尽必须显式降级或终止。</text>
</svg>
