<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">有限重试与幂等副作用</title>
<desc id="desc">Attempt 1 的 urgent 因 enum 失败，attempt 2 的 high 通过；五条事件分别执行 effect-1、去重复用 effect-1、执行 effect-2、拒绝空 key、拒绝非法 key，最终副作用为二并缓存两个 key。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B766E"/></marker>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#49645E" stroke-width="3"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="675" fill="#F6F0E3"/>
<path d="M34 112 H1166" stroke="#18312D" stroke-width="2"/>
<text x="42" y="62" font-family="Avenir Next, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#18312D" text-anchor="start" >有限重试与幂等副作用</text>
<text x="45" y="142" font-family="Avenir Next, PingFang SC, sans-serif" font-size="28" font-weight="800" fill="#0B766E" text-anchor="start" >结构修复 · Input：2 attempts · Rounding：整数</text><rect x="45" y="160" width="210" height="78" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="retry-attempt" data-node="attempt-1" data-value="urgent" data-index="1"/><text x="150" y="193" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >Attempt 1</text><text x="150" y="227" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >priority=urgent</text><rect x="330" y="160" width="210" height="78" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="retry-state" data-node="schema-failed"/><text x="435" y="193" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >Enum fail</text><text x="435" y="227" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >urgent 不允许</text><rect x="615" y="160" width="210" height="78" rx="14" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="retry-attempt" data-node="attempt-2" data-value="high" data-index="2"/><text x="720" y="193" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >Attempt 2</text><text x="720" y="227" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >priority=high</text><rect x="900" y="160" width="210" height="78" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="retry-state" data-node="validated"/><text x="1005" y="193" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >Validated</text><text x="1005" y="227" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >attempt 2</text><line x1="255" y1="199" x2="325" y2="199" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="retry-edge" data-from="attempt-1" data-to="schema-failed" data-edge="attempt-1-schema-failed"/><line x1="540" y1="199" x2="610" y2="199" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="retry-edge" data-from="schema-failed" data-to="attempt-2" data-edge="schema-failed-attempt-2"/><line x1="825" y1="199" x2="895" y2="199" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="retry-edge" data-from="attempt-2" data-to="validated" data-edge="attempt-2-validated"/><text x="45" y="290" font-family="Avenir Next, PingFang SC, sans-serif" font-size="28" font-weight="800" fill="#0B766E" text-anchor="start" >事件表：key | payload</text><text x="560" y="290" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#49645E" text-anchor="start" >Method：enum → retry → idempotency</text><rect x="45" y="310" width="650" height="46" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="idempotency-event" data-node="event-1" data-value="executed" data-index="1" data-token="ticket-42:v1" data-count="42"/><text x="370" y="341" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >#1 | ticket-42:v1 | t42 / high</text><line x1="695" y1="333" x2="770" y2="341" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="retry-edge" data-from="event-1" data-to="effect-1" data-edge="event-1-effect-1"/><rect x="45" y="367" width="650" height="46" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="idempotency-event" data-node="event-2" data-value="deduplicated" data-index="2" data-token="ticket-42:v1" data-count="42"/><text x="370" y="398" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >#2 | ticket-42:v1 | t42 / high</text><line x1="695" y1="390" x2="770" y2="341" stroke="#0B766E" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="retry-edge" data-from="event-2" data-to="effect-1" data-edge="event-2-effect-1"/><rect x="45" y="424" width="650" height="46" rx="14" fill="#FFFDF8" stroke="#18312D" stroke-width="3" data-region="idempotency-event" data-node="event-3" data-value="executed" data-index="3" data-token="ticket-43:v1" data-count="43"/><text x="370" y="455" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >#3 | ticket-43:v1 | t43 / low</text><line x1="695" y1="447" x2="770" y2="455" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="retry-edge" data-from="event-3" data-to="effect-2" data-edge="event-3-effect-2"/><rect x="45" y="481" width="650" height="46" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="idempotency-event" data-node="event-4" data-value="rejected" data-index="4" data-token="" data-count="44"/><text x="370" y="512" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >#4 | 空 key | t44 / high</text><line x1="695" y1="504" x2="770" y2="555" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="retry-edge" data-from="event-4" data-to="rejected" data-edge="event-4-rejected"/><rect x="45" y="538" width="650" height="46" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="idempotency-event" data-node="event-5" data-value="rejected" data-index="5" data-token="invalid key" data-count="45"/><text x="370" y="569" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >#5 | invalid key | t45 / high</text><line x1="695" y1="561" x2="770" y2="555" stroke="#B94B42" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" data-region="retry-edge" data-from="event-5" data-to="rejected" data-edge="event-5-rejected"/><path d="M1005 238 C1005 275 760 270 695 333" fill="none" stroke="#0B766E" stroke-width="3"  marker-end="url(#arrow)" data-region="retry-edge" data-from="validated" data-to="event-1" data-edge="validated-event-1"/><rect x="775" y="310" width="180" height="70" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="event-result" data-node="effect-1"/><text x="865" y="339" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >effect-1</text><text x="865" y="373" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >执行 / 去重复用</text><rect x="775" y="420" width="180" height="70" rx="14" fill="#CDE9DF" stroke="#18312D" stroke-width="3" data-region="event-result" data-node="effect-2"/><text x="865" y="449" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >effect-2</text><text x="865" y="483" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >第二个新 key</text><rect x="775" y="520" width="180" height="70" rx="14" fill="#F5D7D2" stroke="#18312D" stroke-width="3" data-region="event-result" data-node="rejected"/><text x="865" y="549" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >REJECTED</text><text x="865" y="583" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >无执行边</text><rect x="980" y="310" width="170" height="82" rx="14" fill="#F4D88B" stroke="#18312D" stroke-width="3" data-region="retry-summary" data-node="sideEffects" data-value="2"/><text x="1065" y="345" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >Result</text><text x="1065" y="379" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >effects = 2</text><rect x="980" y="410" width="170" height="170" rx="14" fill="#D6E8EF" stroke="#18312D" stroke-width="3" data-region="retry-summary" data-node="cacheKeys" data-value="ticket-42:v1|ticket-43:v1"/><text x="1065" y="489" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#18312D" text-anchor="middle" >cache keys</text><text x="1065" y="523" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#49645E" text-anchor="middle" >ticket-42:v1</text><text x="1065" y="558" font-family="Avenir Next, PingFang SC, sans-serif" font-size="26" font-weight="600" fill="#49645E" text-anchor="middle" >ticket-43:v1</text>
</svg>
