<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="db-title db-desc">
  <title id="db-title">完整 Pre-Norm decoder block、残差与反向梯度路径</title>
  <desc id="db-desc">主面板从 h 经两组归一化与子层、两个真实残差加法到 block output 和 stack exit；独立虚线箭头表示梯度从输出返回输入。右侧保留 Post-Norm 与原始 encoder-decoder cross-attention 边界。</desc>
  <defs>
    <marker id="db-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#18212B"/>
    </marker>
    <marker id="db-gradient-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8B4A65"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#F7F3E8"/>
  <text x="48" y="50" font-family="Trebuchet MS" font-size="32" font-weight="700" fill="#18212B">Decoder block：完整状态、残差与梯度</text>
  <text x="750" y="50" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">GPT-like Pre-Norm · 非通用标准</text>

  <rect x="48" y="78" width="650" height="534" rx="22" fill="#FFFFFF" stroke="#315C9B" stroke-width="4"/>
  <text x="70" y="116" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#315C9B">主路：两个子层都先 LN，再做真实残差加法</text>

  <rect data-region="decoder-node" data-node="h" x="276" y="136" width="202" height="36" rx="10" fill="#FFF3D5" stroke="#C58A10" stroke-width="3"/>
  <text x="344" y="163" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">输入 h</text>
  <rect data-region="decoder-node" data-node="ln1" x="276" y="188" width="202" height="36" rx="10" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
  <text x="336" y="215" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">LN 1</text>
  <rect data-region="decoder-node" data-node="masked-mha" x="228" y="240" width="298" height="38" rx="10" fill="#DCE5F2" stroke="#315C9B" stroke-width="3"/>
  <text x="248" y="268" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">masked multi-head attention</text>
  <circle data-region="decoder-node" data-node="plus1" cx="377" cy="304" r="20" fill="#FFFFFF" stroke="#F26B38" stroke-width="4"/>
  <text x="367" y="314" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">+</text>
  <text x="410" y="313" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">residual 1</text>
  <rect data-region="decoder-node" data-node="h-prime" x="276" y="336" width="202" height="36" rx="10" fill="#FFF3D5" stroke="#C58A10" stroke-width="3"/>
  <text x="322" y="363" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">状态 h′</text>
  <rect data-region="decoder-node" data-node="ln2" x="276" y="388" width="202" height="36" rx="10" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
  <text x="336" y="415" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">LN 2</text>
  <rect data-region="decoder-node" data-node="ffn" x="276" y="440" width="202" height="36" rx="10" fill="#F4E8EB" stroke="#8B4A65" stroke-width="3"/>
  <text x="318" y="467" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">逐位置 FFN</text>
  <circle data-region="decoder-node" data-node="plus2" cx="377" cy="508" r="20" fill="#FFFFFF" stroke="#F26B38" stroke-width="4"/>
  <text x="367" y="518" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#18212B">+</text>
  <rect data-region="decoder-node" data-node="block-output" x="260" y="540" width="234" height="36" rx="10" fill="#E9F2EE" stroke="#1F7A78" stroke-width="3"/>
  <text x="280" y="567" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">block output h″</text>
  <rect data-region="decoder-node" data-node="stack-exit" x="518" y="540" width="154" height="36" rx="10" fill="#18212B" stroke="#18212B" stroke-width="3"/>
  <text x="534" y="567" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#FFFFFF">stack exit</text>

  <line data-region="decoder-edge" data-kind="main" data-from="h" data-to="ln1" x1="377" y1="174" x2="377" y2="184" stroke="#18212B" stroke-width="4" marker-end="url(#db-arrow)"/>
  <line data-region="decoder-edge" data-kind="main" data-from="ln1" data-to="masked-mha" x1="377" y1="226" x2="377" y2="236" stroke="#18212B" stroke-width="4" marker-end="url(#db-arrow)"/>
  <line data-region="decoder-edge" data-kind="main" data-from="masked-mha" data-to="plus1" x1="377" y1="280" x2="377" y2="282" stroke="#18212B" stroke-width="4" marker-end="url(#db-arrow)"/>
  <line data-region="decoder-edge" data-kind="main" data-from="plus1" data-to="h-prime" x1="377" y1="326" x2="377" y2="332" stroke="#18212B" stroke-width="4" marker-end="url(#db-arrow)"/>
  <line data-region="decoder-edge" data-kind="main" data-from="h-prime" data-to="ln2" x1="377" y1="374" x2="377" y2="384" stroke="#18212B" stroke-width="4" marker-end="url(#db-arrow)"/>
  <line data-region="decoder-edge" data-kind="main" data-from="ln2" data-to="ffn" x1="377" y1="426" x2="377" y2="436" stroke="#18212B" stroke-width="4" marker-end="url(#db-arrow)"/>
  <line data-region="decoder-edge" data-kind="main" data-from="ffn" data-to="plus2" x1="377" y1="478" x2="377" y2="486" stroke="#18212B" stroke-width="4" marker-end="url(#db-arrow)"/>
  <line data-region="decoder-edge" data-kind="main" data-from="plus2" data-to="block-output" x1="377" y1="530" x2="377" y2="536" stroke="#18212B" stroke-width="4" marker-end="url(#db-arrow)"/>
  <line data-region="decoder-edge" data-kind="main" data-from="block-output" data-to="stack-exit" x1="496" y1="558" x2="514" y2="558" stroke="#18212B" stroke-width="4" marker-end="url(#db-arrow)"/>

  <path data-region="decoder-edge" data-kind="residual" data-from="h" data-to="plus1" d="M274 154 H194 V304 H354" fill="none" stroke="#F26B38" stroke-width="5" marker-end="url(#db-arrow)"/>
  <text x="82" y="250" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">残差 1：</text>
  <text x="82" y="280" font-family="Trebuchet MS" font-size="26" fill="#18212B">h → plus1</text>
  <path data-region="decoder-edge" data-kind="residual" data-from="h-prime" data-to="plus2" d="M480 354 H610 V508 H400" fill="none" stroke="#F26B38" stroke-width="5" marker-end="url(#db-arrow)"/>
  <text x="500" y="402" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#A33A24">残差 2：</text>
  <text x="500" y="432" font-family="Trebuchet MS" font-size="26" fill="#18212B">h′ → plus2</text>

  <path data-region="decoder-edge" data-kind="gradient" data-direction="reverse" data-from="block-output" data-to="h" d="M258 558 C112 558 112 154 272 154" fill="none" stroke="#8B4A65" stroke-width="4" stroke-dasharray="5 9" marker-end="url(#db-gradient-arrow)"/>
  <text x="70" y="476" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#8B4A65">反向梯度虚线</text>
  <text x="70" y="506" font-family="Trebuchet MS" font-size="26" fill="#18212B">梯度可沿主路/</text>
  <text x="70" y="536" font-family="Trebuchet MS" font-size="26" fill="#18212B">残差返回</text>

  <rect x="726" y="78" width="426" height="206" rx="20" fill="#FFF3D5" stroke="#C58A10" stroke-width="4" stroke-dasharray="12 7"/>
  <text x="750" y="118" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#8A6510">Post-Norm 对照</text>
  <rect x="750" y="140" width="106" height="48" rx="10" fill="#FFFFFF" stroke="#18212B" stroke-width="3"/>
  <rect x="880" y="140" width="116" height="48" rx="10" fill="#FFFFFF" stroke="#F26B38" stroke-width="3"/>
  <rect x="1020" y="140" width="106" height="48" rx="10" fill="#FFFFFF" stroke="#1F7A78" stroke-width="3"/>
  <text x="772" y="173" font-family="Trebuchet MS" font-size="26" fill="#18212B">子层</text>
  <text x="894" y="173" font-family="Trebuchet MS" font-size="26" fill="#18212B">残差 +</text>
  <text x="1054" y="173" font-family="Trebuchet MS" font-size="26" fill="#18212B">LN</text>
  <line x1="858" y1="164" x2="876" y2="164" stroke="#18212B" stroke-width="3" marker-end="url(#db-arrow)"/>
  <line x1="998" y1="164" x2="1016" y2="164" stroke="#18212B" stroke-width="3" marker-end="url(#db-arrow)"/>
  <text x="750" y="226" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">Post-Norm：子层 → 相加 → LN</text>
  <text x="750" y="260" font-family="Trebuchet MS" font-size="26" fill="#18212B">Pre-Norm：LN → 子层 → 相加</text>

  <rect x="726" y="306" width="426" height="306" rx="20" fill="#E9F2EE" stroke="#1F7A78" stroke-width="4"/>
  <text x="750" y="346" font-family="Trebuchet MS" font-size="30" font-weight="700" fill="#1F5F5D">2017 原论文语境</text>
  <text x="750" y="384" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">encoder-decoder / Post-Norm</text>
  <rect x="750" y="406" width="164" height="70" rx="12" fill="#FFFFFF" stroke="#315C9B" stroke-width="3"/>
  <text x="768" y="436" font-family="Trebuchet MS" font-size="26" fill="#18212B">Encoder</text>
  <text x="768" y="468" font-family="Trebuchet MS" font-size="26" fill="#18212B">全可见 self</text>
  <rect x="964" y="406" width="164" height="70" rx="12" fill="#FFFFFF" stroke="#8B4A65" stroke-width="3"/>
  <text x="982" y="436" font-family="Trebuchet MS" font-size="26" fill="#18212B">Decoder</text>
  <text x="982" y="468" font-family="Trebuchet MS" font-size="26" fill="#18212B">因果 self</text>
  <line x1="916" y1="441" x2="958" y2="441" stroke="#18212B" stroke-width="5" marker-end="url(#db-arrow)"/>
  <circle cx="938" cy="522" r="28" fill="#F4C95D" stroke="#18212B" stroke-width="4"/>
  <text x="832" y="530" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">K,V</text>
  <text x="908" y="530" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">cross</text>
  <text x="1018" y="530" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">Q</text>
  <text x="750" y="568" font-family="Trebuchet MS" font-size="26" fill="#18212B">原版：双输入 cross-attention</text>
  <text x="750" y="598" font-family="Trebuchet MS" font-size="26" fill="#18212B">GPT-like decoder-only：无此层</text>
  <text x="48" y="642" font-family="Trebuchet MS" font-size="26" font-weight="700" fill="#18212B">边界：具体模型需查架构资料；残差相加、归一化位置与 cross-attention 不可混写。</text>
</svg>
