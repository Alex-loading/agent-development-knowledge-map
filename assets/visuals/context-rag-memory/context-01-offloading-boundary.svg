<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-context-01-offloading-boundary-title visual-context-01-offloading-boundary-desc"><title id="visual-context-01-offloading-boundary-title">活动上下文与可恢复外部状态的边界</title><desc id="visual-context-01-offloading-boundary-desc">Offloading 降低窗口占用，但不会自动提供持久性、权限隔离或完整恢复。</desc><defs><marker id="visual-context-01-offloading-boundary-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/><rect x="42" y="28" width="1116" height="96" rx="24" fill="#0f172a"/><text x="76" y="74" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">活动上下文与可恢复外部状态的边界</text><text x="76" y="103" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="start">BOUNDARY · TYPED SEMANTIC SCENE</text><polyline id="visual-context-01-offloading-boundary-edge-active-pointer" data-edge="active-pointer" data-from="active" data-to="pointer" points="320,208 346.6666666666667,208" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#visual-context-01-offloading-boundary-arrow)"/><polyline id="visual-context-01-offloading-boundary-edge-pointer-boundary" data-edge="pointer-boundary" data-from="pointer" data-to="boundary" points="466.6666666666667,170 466.6666666666667,146 733.3333333333334,146 733.3333333333334,170" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#visual-context-01-offloading-boundary-arrow)"/><g id="visual-context-01-offloading-boundary-edge-label-pointer-boundary" data-edge-label="pointer-boundary"><rect x="536.32" y="133" width="127.35999999999999" height="24" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><text x="600" y="150" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">URI + HASH + ACL</text></g><polyline id="visual-context-01-offloading-boundary-edge-boundary-external" data-edge="boundary-external" data-from="boundary" data-to="external" points="733.3333333333334,246 733.3333333333334,288 1000,288 1000,246" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#visual-context-01-offloading-boundary-arrow)"/><g id="visual-context-01-offloading-boundary-edge-label-boundary-external" data-edge-label="boundary-external"><rect x="806.4666666666667" y="275" width="120.39999999999999" height="24" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><text x="866.6666666666667" y="292" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">AUTHORIZED READ</text></g><polyline id="visual-context-01-offloading-boundary-edge-boundary-unavailable" data-edge="boundary-unavailable" data-from="boundary" data-to="unavailable" points="733.3333333333334,246 733.3333333333334,297 200,297 200,348" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#visual-context-01-offloading-boundary-arrow)"/><g id="visual-context-01-offloading-boundary-edge-label-boundary-unavailable" data-edge-label="boundary-unavailable"><rect x="413.4266666666667" y="284" width="106.47999999999999" height="24" rx="6" fill="#f8fafc" stroke="#c2410c" stroke-width="1"/><text x="466.6666666666667" y="301" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="middle">FAILED VERIFY</text></g><g id="visual-context-01-offloading-boundary-node-active" data-node="active"><rect x="80" y="170" width="240" height="76" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="200" y="214" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#14213d" text-anchor="middle">ACTIVE CONTEXT</text></g><g id="visual-context-01-offloading-boundary-node-pointer" data-node="pointer"><rect x="346.6666666666667" y="170" width="240" height="76" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="466.6666666666667" y="214" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#14213d" text-anchor="middle">RECOVERY POINTER</text></g><g id="visual-context-01-offloading-boundary-node-boundary" data-node="boundary"><rect x="613.3333333333334" y="170" width="240" height="76" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="733.3333333333334" y="214" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#14213d" text-anchor="middle">READ BOUNDARY</text></g><g id="visual-context-01-offloading-boundary-node-external" data-node="external"><rect x="880" y="170" width="240" height="76" rx="16" fill="#ffffff" stroke="#c2410c" stroke-width="3"/><text x="1000" y="214" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#14213d" text-anchor="middle">EXTERNAL STATE</text></g><g id="visual-context-01-offloading-boundary-node-unavailable" data-node="unavailable"><rect x="80" y="348" width="240" height="76" rx="16" fill="#ffffff" stroke="#be123c" stroke-width="3"/><text x="200" y="392" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#14213d" text-anchor="middle">UNAVAILABLE</text></g></svg>