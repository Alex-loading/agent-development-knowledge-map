<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-context-02-injection-loss-guard-title visual-context-02-injection-loss-guard-desc"><title id="visual-context-02-injection-loss-guard-title">Required、注入风险与细节丢失的组装守卫</title><desc id="visual-context-02-injection-loss-guard-desc">组装器应显式失败或回取原文，不能静默截断硬约束或让检索文本升级为指令。</desc><defs><marker id="visual-context-02-injection-loss-guard-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/><rect x="42" y="28" width="1116" height="96" rx="24" fill="#0f172a"/><text x="76" y="74" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">Required、注入风险与细节丢失的组装守卫</text><text x="76" y="103" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="start">DECISION · TYPED SEMANTIC SCENE</text><polyline id="visual-context-02-injection-loss-guard-edge-trust-required" data-edge="trust-required" data-from="trust" data-to="required" points="510,186 510,232 510,232 510,278" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-02-injection-loss-guard-arrow)"/><text x="510" y="227" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">YES</text><polyline id="visual-context-02-injection-loss-guard-edge-trust-exclude" data-edge="trust-exclude" data-from="trust" data-to="exclude" points="510,186 510,232 870,232 870,278" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-02-injection-loss-guard-arrow)"/><text x="690" y="227" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">NO</text><polyline id="visual-context-02-injection-loss-guard-edge-required-detail" data-edge="required-detail" data-from