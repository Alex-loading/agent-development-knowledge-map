<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-context-07-admission-conflict-title visual-context-07-admission-conflict-desc"><title id="visual-context-07-admission-conflict-title">Salience、consent、confidence 与冲突准入门</title><desc id="visual-context-07-admission-conflict-desc">Salience 只决定候选审查优先级，不是保存授权或事实置信度。</desc><defs><marker id="visual-context-07-admission-conflict-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/><rect x="42" y="28" width="1116" height="96" rx="24" fill="#0f172a"/><text x="76" y="74" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">Salience、consent、confidence 与冲突准入门</text><text x="76" y="103" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="start">DECISION · TYPED SEMANTIC SCENE</text><polyline id="visual-context-07-admission-conflict-edge-scope-sensitivity" data-edge="scope-sensitivity" data-from="scope" data-to="sensitivity" points="510,186 510,206 510,206 510,226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="510" y="201" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">YES</text><polyline id="visual-context-07-admission-conflict-edge-scope-reject" data-edge="scope-reject" data-from="scope" data-to="reject" points="510,186 510,206 870,206 870,226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="690" y="201" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">NO</text><polyline id="visual-context-07-admission-conflict-edge-sensitivity-consent" data-edge="sensitivity-consent" data-from="sensitivity" data-to="consent" points="510,264 510,284 510,284 510,304" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="510" y="279" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">YES</text><polyline id="visual-context-07-admission-conflict-edge-sensitivity-reject" data-edge="sensitivity-reject" data-from="sensitivity" data-to="reject" points="510,264 510,245 870,245 870,226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="690" y="240" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">NO</text><polyline id="visual-context-07-admission-conflict-edge-consent-confidence" data-edge="consent-confidence" data-from="consent" data-to="confidence" points="510,342 510,362 510,362 510,382" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="510" y="357" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">YES</text><polyline id="visual-context-07-admission-conflict-edge-consent-reject" data-edge="consent-reject" data-from="consent" data-to="reject" points="510,342 510,284 870,284 870,226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="690" y="279" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">NO</text><polyline id="visual-context-07-admission-conflict-edge-confidence-conflict" data-edge="confidence-conflict" data-from="confidence" data-to="conflict" points="510,420 510,440 510,440 510,460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="510" y="435" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">YES</text><polyline id="visual-context-07-admission-conflict-edge-confidence-reject" data-edge="confidence-reject" data-from="confidence" data-to="reject" points="510,420 510,323 870,323 870,226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="690" y="318" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">NO</text><polyline id="visual-context-07-admission-conflict-edge-conflict-store" data-edge="conflict-store" data-from="conflict" data-to="store" points="510,498 510,518 510,518 510,538" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="510" y="513" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">NONE</text><polyline id="visual-context-07-admission-conflict-edge-conflict-noop" data-edge="conflict-noop" data-from="conflict" data-to="no-op" points="510,498 510,518 870,518 870,538" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="690" y="513" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">UNCHANGED</text><polyline id="visual-context-07-admission-conflict-edge-conflict-supersede" data-edge="conflict-supersede" data-from="conflict" data-to="supersede" points="510,498 510,518 1075,518 1075,538" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#visual-context-07-admission-conflict-arrow)"/><text x="792.5" y="513" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">CORRECTED</text><g id="visual-context-07-admission-conflict-decision-scope" data-node="scope"><polygon points="510,148 720,167 510,186 300,167" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="510" y="172" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="middle">SUBJECT + SCOPE VALID?</text></g><g id="visual-context-07-admission-conflict-decision-sensitivity" data-node="sensitivity"><polygon points="510,226 720,245 510,264 300,245" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="510" y="250" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="middle">SENSITIVITY ALLOWED?</text></g><g id="visual-context-07-admission-conflict-decision-consent" data-node="consent"><polygon points="510,304 720,323 510,342 300,323" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="510" y="328" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="middle">CONSENT PRESENT?</text></g><g id="visual-context-07-admission-conflict-decision-confidence" data-node="confidence"><polygon points="510,382 720,401 510,420 300,401" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="510" y="406" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="middle">CONFIDENCE ≥ 0.70?</text></g><g id="visual-context-07-admission-conflict-decision-conflict" data-node="conflict"><polygon points="510,460 720,479 510,498 300,479" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="510" y="484" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="middle">EXISTING VALUE?</text></g><g id="visual-context-07-admission-conflict-outcome-reject" data-node="reject"><rect x="770" y="226" width="200" height="38" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="870" y="250" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="middle">REJECT</text></g><g id="visual-context-07-admission-conflict-outcome-store" data-node="store"><rect x="300" y="538" width="420" height="38" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="510" y="562" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="middle">STORE</text></g><g id="visual-context-07-admission-conflict-outcome-no-op" data-node="no-op"><rect x="770" y="538" width="200" height="38" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="870" y="562" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="middle">NO-OP</text></g><g id="visual-context-07-admission-conflict-outcome-supersede" data-node="supersede"><rect x="1000" y="538" width="150" height="38" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="2"/><text x="1075" y="562" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="middle">SUPERSEDE</text></g><g id="visual-context-07-admission-conflict-action-summary" data-node="action-summary"><rect x="360" y="584" width="480" height="48" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="600" y="614" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">REJECT · STORE · NO-OP · SUPERSEDE</text></g></svg>