<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="visual-context-03-compaction-loss-title visual-context-03-compaction-loss-desc"><title id="visual-context-03-compaction-loss-title">从 1200 token 到 420 token 的压缩与恢复核验</title><desc id="visual-context-03-compaction-loss-desc">摘要的价值来自可控损失与可回取性，而不是把流畅文本冒充完整事实。</desc><defs><marker id="visual-context-03-compaction-loss-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="1200" height="675" fill="#f8fafc"/><rect x="42" y="28" width="1116" height="96" rx="24" fill="#0f172a"/><text x="76" y="74" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">从 1200 token 到 420 token 的压缩与恢复核验</text><text x="76" y="103" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="start">PROCESS · TYPED SEMANTIC SCENE</text><polyline id="visual-context-03-compaction-loss-series-token-count" points="293.33333333333337,168 620,395.5 946.6666666666667,395.5" fill="none" stroke="#2563eb" stroke-width="3"/><line id="visual-context-03-compaction-loss-axis-y" x1="130" y1="168" x2="130" y2="518" stroke="#334155" stroke-width="2"/><line id="visual-context-03-compaction-loss-axis-x" x1="130" y1="518" x2="1110" y2="518" stroke="#334155" stroke-width="2"/><text x="50" y="343" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">TOKENS</text><circle id="visual-context-03-compaction-loss-point-token-count-before" data-row="token-count" data-index="before" data-value="1200" cx="293.33333333333337" cy="168" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="293.33333333333337" y="542" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">BEFORE</text><text x="293.33333333333337"